name: Run a sandboxed agent
description: >-
  Run on an already locked host and publish untrusted proposals for a separate checker. What the
  run is (the repository, the review head, the artifact names) is the policy job's run.json
inputs:
  job-dir:
    description: The directory prepare wrote, holding policy.json, task.md, meta.json and the policy job's run.json
    default: ${{ github.workspace }}/.agentic-job
  runner-home:
    description: >-
      Run the agent as the runner's user, with this directory as its home (`agentic-job run
      --runner-home`): after cgwalters-forge/actions/secure-host, in a job that holds no secret,
      no write token and no `id-token`
    required: true
  github-token:
    description: >-
      Read-only GitHub token the agent gets as GH_TOKEN, for gh and the API; empty gives it none.
      The agent can leak it: give a job token with read permissions only, or a read-only token
    default: ""
  inference-api-key:
    description: >-
      For `[inference] register = "api-key"`, the provider's API key, or with `provider = "github"`
      a GitHub token with Copilot access, never the one passed as `github-token`. Only
      `agentic-job run` gets it, which keeps it from the agent; empty for a broker
    default: ""
  inference-run-token:
    description: >-
      For `[inference] register = "github-oidc"`, the run token an earlier job's `agentic-job
      register` got, so that this job needs no `id-token: write`; pass it as a secret, which keeps
      it out of the log. The agent gets it as its own. Empty for `run` to register itself
    default: ""
  mcp-token:
    description: >-
      For an `[mcp.NAME]` server of the configuration, its credential. Only `agentic-job run`
      gets it, which keeps it from the agent; empty for a run without one
    default: ""
outputs:
  exit:
    description: Exit state of agentic-job run
    value: ${{ steps.run.outputs.exit }}
  over-budget:
    description: >-
      For a run that ended well although the cost its agent reported went over the budget, how far
      ("565.9 of 500 AIC"); empty otherwise
    value: ${{ steps.run.outputs.over-budget }}
  secret-at:
    description: >-
      For a run that uploaded nothing because a secret or a private key was in what it would have
      published, where: the file and line ("safe-outputs/aw-agent-run-1.patch, line 3"), never
      the string; empty otherwise
    value: ${{ steps.run.outputs.secret-at }}
  session-endpoint:
    description: >-
      For a session run (`[session] listen`), the `wss://` address its operator connects to on the
      runner's tailnet name; empty otherwise
    value: ${{ steps.session.outputs.endpoint }}
  safe-outputs-artifact-id:
    description: Immutable untrusted proposals upload ID; never a policy or checked artifact
    value: ${{ steps.safe-outputs.outputs.artifact-id }}
  safe-outputs-artifact-digest:
    description: SHA-256 of that upload, in hex, for check to hold the downloaded proposals to
    value: ${{ steps.safe-outputs.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    # A session run's (`[session] listen`): where its operator connects,
    # which setup served on the runner's tailnet name. Outputs and the
    # summary resolve when the job ends; setup's log line is live. Only
    # the operators the configuration names are let in there. First, as
    # it was in secure-host, before the probes.
    - name: The session's endpoint
      id: session
      shell: bash
      run: |
        [ -e /etc/agentic-job/session-endpoint ] || exit 0
        read -r endpoint < /etc/agentic-job/session-endpoint
        [[ "$endpoint" =~ ^wss://[a-z0-9.-]+/$ ]] || { echo "::error::not a session endpoint: $endpoint"; exit 1; }
        echo "endpoint=$endpoint" | tee -a "$GITHUB_OUTPUT"
        printf 'Session: an operator attaches at `%s` (specs/session.md).\n' "$endpoint" >> "$GITHUB_STEP_SUMMARY"
    # Do not let a caller accidentally turn this into an unsandboxed runner.
    # Unlocked configurations skip runner privilege probes, so reject them
    # explicitly before checking the root-owned installed configuration.
    # The probes are not made twice in a row: secure-host's check, when
    # all passed, left a record in $RUNNER_TEMP naming this job and the
    # installed configuration, in a directory of the runner's user's. Only
    # that check writes one; the next
    # check in the job consumes it, and `run` removes it, so a second run
    # in the job probes again; so does one without it (secure-host ran with
    # `check: false`, or in another job). Steps of
    # the runner's user between secure-host and this one run unprobed and
    # can write that record themselves: a caller that runs repository code
    # there gives secure-host `check: false`.
    - name: Prove the host is secured
      shell: bash
      env:
        RUNNER_HOME: ${{ inputs.runner-home }}
      run: |
        # A composite action does not enforce `required`.
        [ -n "$RUNNER_HOME" ] || { echo '::error::run requires runner-home'; exit 1; }
        python3 -c 'import sys, tomllib; c = tomllib.load(open("/etc/agentic-job/config.toml", "rb")); sys.exit(0 if c.get("sandbox", {}).get("lock-runner", True) is True else "run requires a locked host")'
        agentic-job sandbox check --unless-passed
    # The policy job's commit must be this action's: a caller that names
    # another commit for an action would run one version's binary and
    # settings with another's steps. Pinned remotely, the ref is the
    # commit; checked out (.agentic-job-source), the checkout's HEAD is.
    - name: The policy call is this action's commit
      shell: bash
      env:
        JOB_DIR: ${{ inputs.job-dir }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        want=$(jq -r '.source_sha | select(type == "string" and test("\\A[0-9a-f]{40}\\z")) // ""' "$JOB_DIR/run.json") have=$ACTION_REF
        [[ "$have" =~ ^[0-9a-f]{40}$ ]] || have=$(git -c safe.directory="*" -C "$GITHUB_ACTION_PATH" rev-parse HEAD 2> /dev/null) || have=
        [[ "$want" =~ ^[0-9a-f]{40}$ && "$have" == "$want" ]] ||
          { echo "::error::policy.yml ran at ${want:-no commit}, this action at ${have:-no commit}: pin all pieces to one commit"; exit 1; }
    # From the trusted policy upload prepare put in place, not from the
    # caller's job: the agent job passes nothing but the upload IDs.
    - name: Read the run's settings
      id: settings
      shell: bash
      env:
        JOB_DIR: ${{ inputs.job-dir }}
      run: |
        jq -e 'all(.[]; type == "string" and (test("[\\r\\n]") | not))' "$JOB_DIR/run.json" > /dev/null ||
          { echo '::error::run.json is not one line per setting'; exit 1; }
        jq -r 'to_entries[] | "\(.key)=\(.value)"' "$JOB_DIR/run.json" | tee -a "$GITHUB_OUTPUT"
    # The session comes from this action's pinned source, not target code.
    # It is installed only as the agent's user, in the agent's home.
    - name: Install the built-in scripted session
      if: ${{ steps.settings.outputs.fake_profile != '' }}
      shell: bash
      env:
        ACTION: ${{ github.action_path }}
        PROFILE: ${{ steps.settings.outputs.fake_profile }}
        RUNNER_HOME: ${{ inputs.runner-home }}
      run: |
        case "$PROFILE" in implement|comment|review) ;; *) echo '::error::unknown fake-profile'; exit 1 ;; esac
        mkdir -p -m 0700 "$RUNNER_HOME"
        env -i -C "$RUNNER_HOME" HOME="$RUNNER_HOME" LANG=C.UTF-8 PATH=/usr/local/bin:/usr/bin:/bin sh -s < "$ACTION/../workflow/dispatch-$PROFILE.sh"
    # The agent holds the token and could leak it, so it must not write.
    # A classic personal access token names its scopes, and one with any
    # but read scopes is refused here. Job, App and fine-grained tokens
    # name none: their permissions are the caller's to keep to reads.
    - name: Refuse a GitHub token that can write
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        [ -n "$GH_TOKEN" ] || exit 0
        # The header is read from stdin, to keep the token out of curl's arguments.
        headers=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -fsS --max-time 60 -o /dev/null -D - -H @- https://api.github.com/rate_limit) ||
          { echo '::error::GitHub did not take the token for the agent'; exit 1; }
        scopes=$(printf '%s\n' "$headers" | tr -d '\r' | sed -n 's/^x-oauth-scopes:[[:space:]]*//Ip')
        set -f
        for scope in ${scopes//,/ }; do
          case "$scope" in
            read:* | user:email) ;;
            *) echo "::error::the token for the agent has the scope $scope, which can write: give it read scopes only"; exit 1 ;;
          esac
        done
    - name: Run the agent
      id: run
      shell: bash
      env:
        JOB_DIR: ${{ inputs.job-dir }}
        REVIEW_HEAD: ${{ steps.settings.outputs.review_head }}
        # The run's item, which `run` polls with GH_TOKEN for the agent
        # only where the installed configuration says (`[session] watch-item`).
        WATCH_ITEM: ${{ steps.settings.outputs.watch_item }}
        # `agentic-job run` writes it to a file of the agent's and
        # redacts it wherever the run logs or publishes.
        GH_TOKEN: ${{ inputs.github-token }}
        # Held by `run` alone, outside the sandbox: its proxy puts the key
        # in place of the run's token on the agent's requests.
        AGENTIC_JOB_INFERENCE_KEY: ${{ inputs.inference-api-key }}
        # Likewise the MCP server's credential: `run`'s proxy for the
        # server puts it in place of the run's token.
        AGENTIC_JOB_MCP_TOKEN: ${{ inputs.mcp-token }}
        # Taken over by `run` in place of a registration of its own.
        AGENTIC_JOB_INFERENCE_RUN_TOKEN: ${{ inputs.inference-run-token }}
        RUNNER_HOME: ${{ inputs.runner-home }}
      run: |
        echo '::group::agent (condensed)'
        state=0
        [ -z "$REVIEW_HEAD" ] || set -- --review-head "$REVIEW_HEAD"
        [ -z "$WATCH_ITEM" ] || set -- "$@" --watch-item "$WATCH_ITEM"
        # The policy job's binary, which prepare downloaded: the secure-host
        # image installs its own in /usr/local/bin over the one prepare put
        # there, and that is the pinned release's, not this commit's.
        binary=$JOB_DIR/agentic-job
        chmod 0755 "$binary"
        set -- "$@" --runner-home "$RUNNER_HOME"
        "$binary" run --policy "$JOB_DIR/policy.json" --task "$JOB_DIR/task.md" --meta "$JOB_DIR/meta.json" --out "$JOB_DIR/out" "$@" || state=$?
        echo '::endgroup::'
        echo "exit=$state" >> "$GITHUB_OUTPUT"
        [ ! -e "$JOB_DIR/out/run/summary.md" ] || cat "$JOB_DIR/out/run/summary.md" >> "$GITHUB_STEP_SUMMARY"
        # The cost is reported after each reply, so the last one can cross
        # the budget of a turn that then ends well: a warning, not a failure.
        over=
        [ ! -e "$JOB_DIR/out/run/summary.json" ] ||
          over=$(jq -r 'select(.result == "success" and (.aic | type) == "number" and (.aic_budget | type) == "number" and .aic > .aic_budget) | "\(.aic) of \(.aic_budget) AIC"' "$JOB_DIR/out/run/summary.json") || over=
        if [ -n "$over" ]; then
          echo "::warning::the agent ended its turn over budget: spent $over"
          echo "over-budget=$over" >> "$GITHUB_OUTPUT"
        fi
        # Nothing of such a run is uploaded, its summary included: the
        # place alone, which the log has already, says where to look.
        at=
        [ ! -e "$JOB_DIR/out/secret-at" ] || at=$(head -c 200 "$JOB_DIR/out/secret-at" | head -n 1)
        if [[ "$at" =~ ^(run|transcript|safe-outputs)/[A-Za-z0-9_.+@=,-]+,\ line\ [0-9]+$ ]]; then
          echo "Nothing of this run was uploaded: a secret or a private key is in $at." >> "$GITHUB_STEP_SUMMARY"
          echo "secret-at=$at" >> "$GITHUB_OUTPUT"
        fi
    # Read-only Actions metadata; never expose this credential to the agent.
    - name: Report job setup duration
      continue-on-error: true # telemetry must not prevent artifact hand-back
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        JOB_DIR: ${{ inputs.job-dir }}
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_NAME: ${{ runner.name }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { setupSeconds } = require(path.join(process.env.ACTION_PATH, '../workflow/job-timing.cjs'));
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
            ...context.repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100,
          });
          const current = jobs.filter(job => job.runner_name === process.env.RUNNER_NAME && job.status === 'in_progress');
          if (current.length !== 1) throw new Error('cannot identify current agent job');
          const file = path.join(process.env.JOB_DIR, 'out/run/summary.json');
          const summary = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
          if (summary.agent_first_step_at == null) {
            await core.summary.addRaw('Setup duration unavailable: agent never received its first task.\n').write();
          } else {
            const seconds = setupSeconds(current[0], summary.agent_first_step_at);
            await core.summary.addRaw(`Setup (job start to first agent task): ${seconds.toFixed(3)} seconds.\n`).write();
          }
    # Re-check visibility before uploading: a repository can become private
    # while the agent works. This credential stays with the runner user.
    # A policy the binary marked private admitted the calling repository,
    # private, as its target; that target may stay so, nothing else.
    - name: Check again that the repositories are public
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB_DIR: ${{ inputs.job-dir }}
        REPO: ${{ steps.settings.outputs.repo }}
        REPOS: ${{ steps.settings.outputs.agent_config_repo }}
      run: |
        name='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
        [[ "$REPO" =~ $name ]] || { echo '::error::run requires a public target repository name'; exit 1; }
        refuse() { echo "::error::$1 cannot be confirmed to be public; private runs are refused unless the target is the calling repository and the bounds set private = true, because run evidence can disclose source. See docs/private-repositories.md in the agentic-job source"; exit 1; }
        # The REST API with curl, not gh, which a runner need not have (RHEL
        # has it only in EPEL). The token goes on stdin, not on a command
        # line other users could read; -q leaves out any ~/.curlrc.
        visibility() {
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -q --fail --silent --show-error --max-time 60 -H @- \
              -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$1" |
            jq -r 'if .private == false and .visibility == "public" then "public"
              elif .private == true and .visibility == "private" then "private" else "unknown" end' || echo unknown
        }
        target=$(visibility "$REPO")
        private=$(jq -r --arg repo "$REPO" 'if .private == true and .repo == $repo then "true" else "false" end' "$JOB_DIR/policy.json")
        [ "$target" = public ] || { [ "$target/$private" = private/true ] && [ "$REPO" = "$GITHUB_REPOSITORY" ]; } || refuse "$REPO"
        set -f
        for repo in $REPOS; do
          [[ "$repo" =~ $name ]] || { echo "::error::not a repository name: $repo"; exit 1; }
          [ "$(visibility "$repo")" = public ] || refuse "$repo"
        done
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.settings.outputs.artifact_prefix }}agent-run
        path: ${{ inputs.job-dir }}/out/run/
        retention-days: 90
        if-no-files-found: ignore
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.settings.outputs.artifact_prefix }}agent-transcript
        path: ${{ inputs.job-dir }}/out/transcript.tar.zst
        retention-days: 30
        if-no-files-found: ignore
    - id: safe-outputs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.settings.outputs.artifact_prefix }}safe-outputs
        path: ${{ inputs.job-dir }}/out/safe-outputs/
        retention-days: 30
        if-no-files-found: ignore
    - name: The run's result
      shell: bash
      env:
        EXIT: ${{ steps.run.outputs.exit }}
        PARTIAL: ${{ steps.settings.outputs.apply_partial == 'true' && steps.safe-outputs.outputs.artifact-id != '' }}
      run: |
        case "$EXIT/$PARTIAL" in
          0/*) ;;
          3/true | 124/true) echo "::warning::the run was stopped at a limit (exit state $EXIT) and handed back what it had" ;;
          *) echo "::error::agentic-job run ended with exit state $EXIT"; exit 1 ;;
        esac
