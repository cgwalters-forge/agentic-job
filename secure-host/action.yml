# Secures the machine a job runs on, for whatever the job does next: a
# build, a test suite, an agent. docs/secure-host.md says what it does to
# the host, what a later step can count on and what it cannot, and what
# has to run before it.
#
# It is the last step of the job that has root. Everything that needs
# root (packages, services, joining a network) comes before it; from here on the
# job's steps are the runner's user's without sudo, and a step that runs
# code the job does not trust runs it as the sandbox user:
#
#   - uses: cgwalters-forge/agentic-job/secure-host@COMMIT
#   - run: make check
#   - shell: agentic-job sandbox exec --stdin {0} -- bash -eo pipefail -s
#     run: ./configure && make
#
# Every input reaches a step through its environment and is never pasted
# into a script, and the configuration is written by `agentic-job
# config`, which takes each as a value and nothing else.
name: Secure the CI host
description: >-
  Hardens the runner and takes root away from every later step of the job: a second unprivileged
  user with nothing of the job's, an egress proxy and network rules for it, a kernel policy that
  keeps every user but the owner from changing a world-writable file, and no sudo for the
  runner's own user, each proven by a probe before the step returns

inputs:
  config:
    description: >-
      A configuration file (TOML: the `[sandbox]`, `[egress]` and `[setup]` tables) for what the
      inputs below do not cover, such as the sockets the image may keep. Empty for the one that
      comes with the action, written for GitHub's hosted ubuntu-26.04. The inputs below go over it
    default: ""
  lock:
    description: >-
      Whether the runner's user loses root, so that no later step of the job has it. `false`
      keeps its sudo and hardens the host for the sandbox user only. Empty for what the
      configuration says, which is `true` unless it says otherwise
    default: ""
  egress:
    description: >-
      Whether the sandbox user reaches the network only through the egress proxy (reads anywhere
      but the threat feed, writes by rule). `false` leaves its network open but for the cloud
      metadata service and the tailnet. Empty for what the configuration says, `true` by default
    default: ""
  deny-runner-metadata:
    description: >-
      Whether the runner's user, and so every later step and action of the job, is refused the cloud
      metadata service as the sandbox user is: no instance identity or cloud role credentials for
      any step. Needs `lock`. Empty for what the configuration says, `false` by default
    default: ""
  egress-policy:
    description: The egress proxy's write rules, a file, in place of the ones that come with the binary
    default: ""
  stop-services:
    description: >-
      systemd units to stop, with spaces or newlines between them, in place of the configuration's
      list: the daemons that listen for every local user, a container daemon first of all
    default: ""
  sandbox-user:
    description: The name of the second unprivileged user, which the step creates (`runner-sandbox` by default)
    default: ""
  runner-user:
    description: The user the job's steps run as, whose root is taken and whose home is closed (the one that runs this step by default)
    default: ""
  script:
    description: A file, a script that setup runs as the sandbox user at its end, for a toolchain in that user's home
    default: ""
  check:
    description: >-
      Prove the result with `agentic-job sandbox check` before the step returns; `false` leaves that to the job.
      A passing check lets the next check in this job, the run action's, skip its probes, unless something
      entered the sandbox user or checked in between; give `false` when steps of the runner's user
      (repository code) run between this step and run
    default: "true"
  binary:
    description: >-
      An `agentic-job` already on this machine, to use in place of fetching or building one: for
      a job that got it from the job before. The world-write policy object, `world_write.bpf.o`,
      must be beside it
    default: ""
  build:
    description: >-
      Build the binary from the action's source, also where a release fits its commit and would
      be fetched by its checksum. A build needs rustup and takes about two minutes
    default: "false"

outputs:
  sandbox-user:
    description: The name of the sandbox user
    value: ${{ steps.user.outputs.name }}
  sandbox-home:
    description: Its home, where `agentic-job sandbox exec` starts a command
    value: ${{ steps.user.outputs.home }}
  session-endpoint:
    description: >-
      For a session run (`[session] listen`), the `wss://` address its operator connects to on the
      runner's tailnet name; empty otherwise
    value: ${{ steps.session.outputs.endpoint }}
  fetched:
    description: "`true` when the binary was a release's, taken by its checksum; `false` when it was built; empty with `binary`"
    value: ${{ steps.binary.outputs.fetched }}

runs:
  using: composite
  steps:
    # A release's, by its attested source-matching checksums, when
    # that release was built from this commit's source; a build of that
    # source otherwise (binary.sh). The bootstrap uses Node only for gh
    # preparation and bounded GitHub retries, before the binary exists.
    - name: Prepare GitHub CLI
      if: ${{ inputs.binary == '' }}
      shell: bash
      env:
        ACTION: ${{ github.action_path }}
      run: node "$ACTION/github.mjs"
    - name: Get the binary
      id: binary
      if: ${{ inputs.binary == '' }}
      shell: bash
      env:
        ACTION: ${{ github.action_path }}
        BUILD: ${{ inputs.build }}
        GH_TOKEN: ${{ github.token }}
      run: |
        [ "$BUILD" != true ] || set -- --build
        bash "$ACTION/binary.sh" get --out "$RUNNER_TEMP/secure-host/bin" "$@"
    # Before it is installed, and before apt, the policy or setup change
    # the host: ID and VERSION_ID of os-release, never ID_LIKE.
    - name: Check supported host
      shell: bash
      env:
        BINARY: ${{ inputs.binary || format('{0}/secure-host/bin/agentic-job', runner.temp) }}
      run: |
        "$BINARY" secure-host supported
    # Where every user can run it: the sandbox user's commands start
    # through it.
    - name: Install the binary
      shell: bash
      env:
        BINARY: ${{ inputs.binary || format('{0}/secure-host/bin/agentic-job', runner.temp) }}
      run: |
        [ "$BINARY" -ef /usr/local/bin/agentic-job ] || sudo install -m 0755 "$BINARY" /usr/local/bin/agentic-job
        agentic-job --version
    # Root's by its path: sudo's secure_path leaves out /usr/local/bin on RHEL.
    - name: Bound apt network waits and avoid the Azure mirror
      shell: bash
      run: sudo /usr/local/bin/agentic-job secure-host apt
    # An input that was left empty sets nothing, so the file stands.
    - name: Write the configuration
      shell: bash
      env:
        ACTION: ${{ github.action_path }}
        CONFIG: ${{ inputs.config }}
        LOCK: ${{ inputs.lock }}
        EGRESS: ${{ inputs.egress }}
        DENY_RUNNER_METADATA: ${{ inputs.deny-runner-metadata }}
        EGRESS_POLICY: ${{ inputs.egress-policy }}
        STOP_SERVICES: ${{ inputs.stop-services }}
        SANDBOX_USER: ${{ inputs.sandbox-user }}
        RUNNER_USER: ${{ inputs.runner-user }}
        SCRIPT: ${{ inputs.script }}
      run: |
        mkdir -p "$RUNNER_TEMP/secure-host"
        agentic-job config --host --from "${CONFIG:-$ACTION/hosted.toml}" \
          --boolean sandbox.lock-runner="$LOCK" --boolean sandbox.deny-runner-metadata="$DENY_RUNNER_METADATA" \
          --boolean egress.proxy="$EGRESS" --string egress.policy="$EGRESS_POLICY" \
          --list sandbox.stop-services="$STOP_SERVICES" --string sandbox.user="$SANDBOX_USER" \
          --string sandbox.runner-user="$RUNNER_USER" --string setup.script="$SCRIPT" \
          > "$RUNNER_TEMP/secure-host/config.toml"
        cat "$RUNNER_TEMP/secure-host/config.toml"
    # Where the configuration names an inference proxy: a TCP connection
    # to it as the runner's user, before setup, so that a runner off the
    # proxy's network fails here and says so rather than in a probe of
    # setup's rules. It sends no HTTP request, identity token or model
    # credential, and the scripted agent is not checked. A configuration
    # without the table, a deterministic job's, needs no Python 3.11 here.
    - name: Check inference proxy reachability
      shell: bash
      env:
        ACTION: ${{ github.action_path }}
      run: |
        grep -qx '\[inference\]' "$RUNNER_TEMP/secure-host/config.toml" || exit 0
        python3 "$ACTION/../workflow/inference-preflight.py" "$RUNNER_TEMP/secure-host/config.toml"
    # Before setup, which refuses a host without it: no user but a
    # world-writable file's or directory's owner may change it, on the root
    # filesystem, from here on. The object came with the binary, by the
    # release's checksums or built with it; bpftool is installed where the
    # image lacks it. Fails closed (docs/secure-host.md).
    - name: Load the world-write policy
      shell: bash
      env:
        BINARY: ${{ inputs.binary || format('{0}/secure-host/bin/agentic-job', runner.temp) }}
      run: sudo /usr/local/bin/agentic-job secure-host world-write "$(dirname "$BINARY")/world_write.bpf.o"
    # The last thing in the job that has root, unless `lock` is off.
    - name: Secure the host
      shell: bash
      run: agentic-job sandbox timed setup
    # A session run's (`[session] listen`): where its operator connects,
    # which setup served on the runner's tailnet name. Outputs and the
    # summary resolve when the job ends; setup's log line is live. Only
    # the operators the configuration names are let in there.
    - name: The session's endpoint
      id: session
      shell: bash
      run: |
        [ -e /etc/agentic-job/session-endpoint ] || exit 0
        read -r endpoint < /etc/agentic-job/session-endpoint
        [[ "$endpoint" =~ ^wss://[a-z0-9.-]+/$ ]] || { echo "::error::not a session endpoint: $endpoint"; exit 1; }
        echo "endpoint=$endpoint" | tee -a "$GITHUB_OUTPUT"
        printf 'Session: an operator attaches at `%s` (specs/session.md).\n' "$endpoint" >> "$GITHUB_STEP_SUMMARY"
    # Asked of the sandbox user itself, which also shows that the way in
    # to it works for the steps after this one. Before the probes: every
    # `sandbox exec` removes the record that `--record` leaves of a passing
    # check, which the run action takes in place of probing again.
    - name: The sandbox user
      id: user
      shell: bash
      run: |
        # Regular-file capture is exact; piped output has `::` broken up.
        agentic-job sandbox exec -- id -un > "$RUNNER_TEMP/secure-host/user.txt"
        read -r name < "$RUNNER_TEMP/secure-host/user.txt"
        printf '%s\n' "name=$name" "home=$(getent passwd "$name" | cut -d: -f6)" | tee -a "$GITHUB_OUTPUT"
    - name: Prove it
      if: ${{ inputs.check != 'false' }}
      shell: bash
      run: agentic-job sandbox timed probes
