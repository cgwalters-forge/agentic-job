# Forwards to cgwalters-forge/actions/secure-host, which runs the
# attested, digest-pinned secure-host image (tracker#674). A caller that
# names this path at a commit before the forward keeps the old action;
# docs/secure-host.md says what changes at a later one.
#
# The old action's other inputs have no counterpart there. A job that set
# one asked for something (root kept, another sandbox user, a script run
# as it, a binary of its own) that the new action would not do, so it
# fails here rather than running a host other than the one it asked for.
#
# Every input reaches a step through its environment and is never pasted
# into a script.
name: Secure the CI host
description: >-
  Forwards to cgwalters-forge/actions/secure-host, which runs the digest-pinned secure-host image:
  no later step of the job has root or reaches the cloud metadata service, and a world-writable
  file can be changed only by its owner

inputs:
  config:
    description: >-
      A host configuration file (TOML: the `[sandbox]`, `[egress]` and `[setup]` tables). Empty for
      this repository's hosted.toml, with the egress proxy on, rather than the new action's default
    default: ""
  check:
    description: Prove the result with `agentic-job sandbox check` before the step returns; `false` leaves that to the job
    default: "true"
  image-archive:
    description: >-
      An image archive (as `podman load` takes it) to run in place of the pinned image, for testing
      an unreleased image. It is not verified: only for a job that built it or trusts its source
    default: ""
  # Refused when set: see above.
  lock:
    description: Removed; set nothing
    default: ""
  egress:
    description: Removed; set nothing
    default: ""
  deny-runner-metadata:
    description: Removed; set nothing
    default: ""
  egress-policy:
    description: Removed; set nothing
    default: ""
  stop-services:
    description: Removed; set nothing
    default: ""
  sandbox-user:
    description: Removed; set nothing
    default: ""
  runner-user:
    description: Removed; set nothing
    default: ""
  script:
    description: Removed; set nothing
    default: ""
  binary:
    description: Removed; set nothing
    default: ""
  build:
    description: Removed; set nothing
    default: ""

runs:
  using: composite
  steps:
    - name: Refuse the old action's inputs
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        EGRESS: ${{ inputs.egress }}
        DENY_RUNNER_METADATA: ${{ inputs.deny-runner-metadata }}
        EGRESS_POLICY: ${{ inputs.egress-policy }}
        STOP_SERVICES: ${{ inputs.stop-services }}
        SANDBOX_USER: ${{ inputs.sandbox-user }}
        RUNNER_USER: ${{ inputs.runner-user }}
        SCRIPT: ${{ inputs.script }}
        BINARY: ${{ inputs.binary }}
        BUILD: ${{ inputs.build }}
      run: |
        set=()
        for name in LOCK EGRESS DENY_RUNNER_METADATA EGRESS_POLICY STOP_SERVICES SANDBOX_USER RUNNER_USER SCRIPT BINARY BUILD; do
          if [ -n "${!name}" ]; then name=${name,,}; set+=("${name//_/-}"); fi
        done
        if [ "${#set[@]}" != 0 ]; then
          echo "::error::secure-host now forwards to cgwalters-forge/actions/secure-host, which takes only config, check and image-archive, not ${set[*]}: drop them, or name cgwalters-forge/agentic-job/secure-host at an earlier commit; an agent job of your own names ./.agentic-job-source/secure-host/internal (docs/secure-host.md)"
          exit 1
        fi
    # Without a config, this repository's hosted one, as the old action
    # had: the new action's own default turns the egress proxy off, and
    # the v0.6.1 image still runs `sandbox exec`, so a caller that ran
    # untrusted code through it would silently lose the proxy's rules.
    - uses: cgwalters-forge/actions/secure-host@5906e6745c4e3e1c68b698dacf409a452c727d08 # main, with secure-host:v0.6.1
      with:
        config: ${{ inputs.config || format('{0}/hosted.toml', github.action_path) }}
        check: ${{ inputs.check }}
        image-archive: ${{ inputs.image-archive }}
    # With egress.write-policy, setup put the proxy's authority in the
    # system's trust store, which Node (every JavaScript action) and
    # Python's requests do not read: what they need instead is the lines
    # setup wrote to /etc/egress-proxy/runner.env, for every later step's
    # environment. They are written here as literals, not copied from the
    # file, so that nothing but these two names can reach GITHUB_ENV.
    # Without the file there is nothing to add.
    - name: Trust the egress proxy in later steps
      shell: bash
      run: |
        if [ -f /etc/egress-proxy/runner.env ]; then
          echo "NODE_EXTRA_CA_CERTS=/etc/egress-proxy/ca.pem" >> "$GITHUB_ENV"
          echo "REQUESTS_CA_BUNDLE=/etc/egress-proxy/ca-bundle.pem" >> "$GITHUB_ENV"
        fi
