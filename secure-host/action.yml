# Forwards to cgwalters-forge/actions/secure-host, which runs the
# attested, digest-pinned secure-host image (tracker#674). A caller that
# names this path at a commit before the forward keeps the old action;
# docs/secure-host.md says what changes at a later one.
#
# The old action's other inputs have no counterpart there. A job that set
# one asked for something (root kept, another runner user, a script run
# by setup, a binary of its own) that the new action would not do, so it
# fails here rather than running a host other than the one it asked for.
#
# Every input reaches a step through its environment and is never pasted
# into a script.
name: Secure the CI host
description: >-
  Forwards to cgwalters-forge/actions/secure-host, which runs the digest-pinned secure-host image:
  no later step of the job has root or reaches the cloud metadata service, and a world-writable
  file can be changed only by its owner

inputs:
  config:
    description: >-
      A host configuration file (TOML: the `[sandbox]`, `[egress]` and `[setup]` tables). Empty for
      this repository's hosted.toml, with the egress proxy on, rather than the new action's default
    default: ""
  check:
    description: Prove the result with `agentic-job sandbox check` before the step returns; `false` leaves that to the job
    default: "true"
  image-archive:
    description: >-
      An image archive (as `podman load` takes it) to run in place of the pinned image, for testing
      an unreleased image. It is not verified: only for a job that built it or trusts its source
    default: ""
  # Refused when set: see above.
  lock:
    description: Removed; set nothing
    default: ""
  egress:
    description: Removed; set nothing
    default: ""
  deny-runner-metadata:
    description: Removed; set nothing
    default: ""
  egress-policy:
    description: Removed; set nothing
    default: ""
  stop-services:
    description: Removed; set nothing
    default: ""
  sandbox-user:
    description: Removed; set nothing
    default: ""
  runner-user:
    description: Removed; set nothing
    default: ""
  script:
    description: Removed; set nothing
    default: ""
  binary:
    description: Removed; set nothing
    default: ""
  build:
    description: Removed; set nothing
    default: ""

runs:
  using: composite
  steps:
    - name: Refuse the old action's inputs
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        EGRESS: ${{ inputs.egress }}
        DENY_RUNNER_METADATA: ${{ inputs.deny-runner-metadata }}
        EGRESS_POLICY: ${{ inputs.egress-policy }}
        STOP_SERVICES: ${{ inputs.stop-services }}
        SANDBOX_USER: ${{ inputs.sandbox-user }}
        RUNNER_USER: ${{ inputs.runner-user }}
        SCRIPT: ${{ inputs.script }}
        BINARY: ${{ inputs.binary }}
        BUILD: ${{ inputs.build }}
      run: |
        set=()
        for name in LOCK EGRESS DENY_RUNNER_METADATA EGRESS_POLICY STOP_SERVICES SANDBOX_USER RUNNER_USER SCRIPT BINARY BUILD; do
          if [ -n "${!name}" ]; then name=${name,,}; set+=("${name//_/-}"); fi
        done
        if [ "${#set[@]}" != 0 ]; then
          echo "::error::secure-host now forwards to cgwalters-forge/actions/secure-host, which takes only config, check and image-archive, not ${set[*]}: drop them, or name cgwalters-forge/agentic-job/secure-host at an earlier commit (docs/secure-host.md)"
          exit 1
        fi
    # The new action sets egress.write-policy from its own `egress` input,
    # over the file's value, so a configuration that asks for the policy
    # would silently run without it (and a later step could POST the job's
    # token anywhere). This is not a TOML parser: `write-policy = true`
    # anywhere but on a comment line turns it on, a trailing comment or a
    # string included, which can only ask for more (a stricter host, never
    # a looser one). A key can spell write-policy without those characters
    # only through a quoted key's backslash escape (of its hyphen, say),
    # and a value `true` has no other spelling; a line that starts with `#`
    # sets a key only after a multi-line string that closes on it. So a
    # backslash outside a comment line, or any multi-line string, is
    # refused rather than read as off.
    - name: Read whether the configuration asks for the write policy
      id: egress
      shell: bash
      env:
        CONFIG: ${{ inputs.config || format('{0}/hosted.toml', github.action_path) }}
      run: |
        if grep -Eq "^[[:space:]]*([^#[:space:]].*)?\\\\|'''|\"\"\"" -- "$CONFIG"; then
          echo "::error::$CONFIG has a backslash outside a comment or a multi-line string, so the forwarder cannot tell whether it sets egress.write-policy: write the file without them"
          exit 1
        fi
        mode=off
        if grep -Eq "^[[:space:]]*([^#[:space:]].*)?write-policy[\"']?[[:space:]]*=[[:space:]]*true" -- "$CONFIG"; then mode=write-policy; fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
    # Without a config, this repository's hosted one, as the old action
    # had: the new action's own default turns the egress proxy off, and
    # the v0.6 image's binary still creates its second user, so a step
    # that runs untrusted code as it would lose the proxy's rules. With
    # `egress: write-policy` the new action also copies the proxy's
    # trust-store variables from /etc/egress-proxy/runner.env into
    # GITHUB_ENV, refusing any other name.
    - uses: cgwalters-forge/actions/secure-host@636b20b87bc94417999062ada22700ef4d6a8836 # main, with secure-host:v0.6.3
      with:
        config: ${{ inputs.config || format('{0}/hosted.toml', github.action_path) }}
        check: ${{ inputs.check }}
        egress: ${{ steps.egress.outputs.mode }}
        image-archive: ${{ inputs.image-archive }}
