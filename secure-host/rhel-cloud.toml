# Default for RHEL 10 and CentOS Stream 10 cloud hosts. Untrusted steps must
# not reach these local listeners; stop and mask their activation units too.
# Other images may need their own config: sandbox check still refuses every
# unexpected listener. There are deliberately no allow-sockets exceptions.
# [host], by its deprecated name: the image the forwarder pins reads
# only this one until agentic-job#2656 moves the pin.
[sandbox]
stop-services = [
    "docker.socket",
    "docker.service",
    "containerd.service",
    "cockpit.socket",
    "cockpit.service",
    "sssd-kcm.socket",
    "sssd-kcm.service",
    "gssproxy.service",
    "sshd.socket",
    "sshd.service",
    "sshd-unix-local.socket",
]
close-resolved = true

# As in hosted.toml, leave the egress proxy and its network rules on.
[setup]
packages = ["nftables"]
