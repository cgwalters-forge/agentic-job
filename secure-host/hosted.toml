# What the action sets up when its `config` input names no file: GitHub's
# hosted `ubuntu-26.04`. Another runner image listens on other sockets:
# `agentic-job sandbox check` fails on each one that is left and names
# it, and a job on such an image passes a file of its own.

[sandbox]
# Daemons of the image that listen for every local user. A job that
# needs one of them after this step cannot have it: the runner's user is
# in docker's group, which is root by another name.
stop-services = [
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "iscsid.socket",
    "iscsid.service",
]
# systemd-resolved, which the whole runner resolves names with, resolves
# them for any user, around the egress proxy: setup leaves it to root and
# the runner's user (docs/sandbox-check.md).
close-resolved = true

[sandbox.check]
allow-sockets = [
    # systemd-networkd, which the runner's network depends on: it
    # describes the links to any user and changes them only for root.
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

# The egress proxy and the network rules are on by default: no [egress].

[setup]
# The egress proxy is the binary's own, behind nftables rules.
packages = ["nftables"]
