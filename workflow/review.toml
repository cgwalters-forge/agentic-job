# Copy with review.yml, review-command.toml and review.md; set repos and
# bases for the caller. The automatic events: any role's pull request,
# forks included; review.yml's `if:` narrows them to the owner, members
# and collaborators, to protect the shared inference cap, and to bots whose
# user id the REVIEW_BOT_IDS variable lists. Such a bot must also be named
# in `bots`: these bounds check the actor, the `if:` the author.
# The agent reviews the head as data, without a credential.
hosts = ["github.com"]
repos = ["cgwalters-forge/agentic-job"]
bases = ["main"]
max_outputs = 11
max_patch_bytes = 1024
max_patch_files = 1

[github.outputs]
add_comment = { max = 1 }
noop = { max = 1 }
# Inline findings beside the verdict (docs/review.md), held to the pull request.
create_pull_request_review_comment = { max = 10 }

[github.trigger]
events = ["pull_request_target", "pull_request"]
roles = ["all"]
# A `[bot]` login is a GitHub App's; no user can take it.
bots = ["dependabot[bot]"]
forks = true
