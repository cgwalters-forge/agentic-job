# review.toml for `/review`: the same bounds, for a comment by someone who
# can write, on any pull request, forks included.
hosts = ["github.com"]
repos = ["cgwalters-forge/agentic-job"]
bases = ["main"]
max_outputs = 11
max_patch_bytes = 1024
max_patch_files = 1

[outputs]
add_comment = { max = 1 }
noop = { max = 1 }
# Inline findings beside the verdict (docs/review.md), held to the pull request.
create_pull_request_review_comment = { max = 10 }

[trigger]
events = ["issue_comment"]
roles = ["admin", "maintain", "write"]
bots = []
forks = true
commands = ["/review"]
