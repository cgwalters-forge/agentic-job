[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cgwalters-forge/agentic-job"
publish = false

# Shared by every crate, so a version is chosen once.
[workspace.dependencies]
agent-client-protocol = { version = "2.2", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The transcript is one compressed archive, written here so that a job
# needs no tar or zstd of its own. zstd is the C library, built with the
# compiler the static build already needs; tar without its support for
# extended attributes, which nothing here has.
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
# The run API of the inference proxy, and the CI system's identity token,
# which is fetched over TLS. Blocking, and far smaller than a client on
# hyper; rustls with ring builds for musl with a C compiler alone.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# The released binary is fetched by every run: keep it small.
[profile.release]
lto = "thin"
strip = true
