[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cgwalters-forge/agentic-job"
publish = false

# Shared by every crate, so a version is chosen once.
[workspace.dependencies]
agent-client-protocol = { version = "2.2", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
# The egress proxy (sandbox/proxy): an HTTP/1.1 proxy that ends TLS so its
# policy sees every request's method and path. hyper for HTTP, rustls with
# ring (as ureq already has it) for both sides of TLS, rcgen for the
# certificates it shows the sandbox user, and Mozilla's roots, as
# mitmproxy's certifi has them, for the servers it connects to.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
# The agents' pinned npm tarballs (sandbox/setup/agents.rs): gzip in
# Rust, without zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
regex = "1"
# Already rustls's: SHA-512 for npm's integrity of the agents' tarballs.
ring = "0.17"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The transcript is one compressed archive, written here so that a job
# needs no tar or zstd of its own. zstd is the C library, built with the
# compiler the static build already needs; tar without its support for
# extended attributes, which nothing here has.
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
# The session's bridge (specs/session.md): a WebSocket server behind
# `tailscale serve`, which terminates TLS, so only the handshake and
# framing, without TLS or a client's connector.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The run API of the inference proxy, and the CI system's identity token,
# which is fetched over TLS. Blocking, and far smaller than a client on
# hyper; rustls with ring builds for musl with a C compiler alone.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `workflows check` reads workflow files through its events, so that it
# builds the tree itself, bounded; no encoding detection, as GitHub reads
# workflows as UTF-8.
yaml-rust2 = { version = "0.13", default-features = false }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# The released binary is fetched by every run: keep it small.
[profile.release]
lto = "thin"
strip = true
