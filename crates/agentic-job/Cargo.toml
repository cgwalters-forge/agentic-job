[package]
name = "agentic-job"
description = "Run a coding agent as an unprivileged user on a hardened CI host, and check what it hands back"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
hyper.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
futures.workspace = true
regex.workspace = true
ring.workspace = true
rustix.workspace = true
safe-outputs = { path = "../safe-outputs", features = ["clap"] }
secure-host = { path = "../secure-host" }
serde.workspace = true
# Numbers read as JavaScript reads them, for apply's applied names.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
ureq.workspace = true
yaml-rust2.workspace = true
zstd.workspace = true

[dev-dependencies]
secure-host = { path = "../secure-host", features = ["test-support"] }
