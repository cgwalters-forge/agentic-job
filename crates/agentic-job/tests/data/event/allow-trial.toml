# The trial repository's own bounds, for the recorded-payload tests.
hosts = ["github.com"]
repos = ["cgwalters-bot/agentic-job-trial"]
bases = ["main"]
max_outputs = 5
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }

[trigger]
events = ["issue_comment", "pull_request", "workflow_dispatch"]
roles = ["admin", "maintain", "write"]
bots = []
forks = false
commands = ["/agent"]
