# What CI's `sandbox` job sets up on a hosted runner (ubuntu-26.04).

[sandbox]
# Daemons of the runner image that listen for every local user, and that
# nothing in this job uses: `sandbox check` fails on each one left.
stop-services = [
    # The runner's user is in docker's group.
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "iscsid.socket",
    "iscsid.service",
]

[sandbox.check]
allow-sockets = [
    # systemd-resolved, which the whole runner resolves names with, the
    # egress proxy included. It resolves for any user, so on this image
    # the sandbox user still has a way to send names out through it
    # (docs/sandbox-check.md). The runners agents run on do not have it.
    "/run/systemd/resolve/",
    # systemd-networkd, which the runner's network depends on: it
    # describes the links to any user and changes them only for root.
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

# The egress proxy and the network rules are on by default: no [egress].

[setup]
packages = ["jq"]
script = "crates/agentic-job/tests/data/sandbox/toolchain.sh"
