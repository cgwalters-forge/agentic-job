# The agents `setup.agents` may name, with every package each needs on
# Linux x86-64 with glibc, pinned by npm's SHA-512 integrity (agents.rs).
# Written by `just agents-lock`, one entry per agent; review an update as
# the code it is, since setup installs it as root.
#
# opencode-ai's own package is a launcher that its install script swaps
# for the platform's binary: pinned is that binary's package instead.
#   just agents-lock opencode-ai@1.18.35 opencode-linux-x64@1.18.35 \
#       opencode=node_modules/opencode-linux-x64/bin/opencode
#   just agents-lock @agentclientprotocol/claude-agent-acp@0.88.0 \
#       @agentclientprotocol/claude-agent-acp@0.88.0 \
#       claude-agent-acp=node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js


[[agent]]
spec = "opencode-ai@1.18.35"

[agent.bin]
opencode = "node_modules/opencode-linux-x64/bin/opencode"

