# The ACP agents a session can drive (see agents.rs): the command that
# starts each one's ACP server on stdio, and how it is told the model.
# No secrets here: behind a wrapper, `env` is passed on the command line
# (env K=V ...), which other users can see.
#
# What surrounds each command (where it is installed, its inference
# configuration and the environment it starts in) is step 6a's, which may
# change the commands with it.

# Claude Code, through its ACP adapter (@agentclientprotocol/claude-agent-acp).
# Opus unless the run names a model.
#
# No `notices`: the adapter queues a prompt sent during a turn as a turn of
# its own, and when Claude Code takes it up answers the running one with
# end_turn, which would end the run as done. Its `_session/steering`
# request is what would deliver one inside the turn.
#
# When Claude Code gives up on a model request (a 429 after its own
# retries), the adapter may say "API Error: ..." and answer end_turn.
[claude]
command = ["claude-agent-acp"]
model-env = "ANTHROPIC_MODEL"
provider-error = "API Error:"
env = { ANTHROPIC_MODEL = "opus" }

# opencode speaks ACP natively; its model is a session config option. A
# prompt sent during a turn reaches the model at its next step.
[opencode]
command = ["opencode", "acp"]
notices = true

# Vibe's ACP entrypoint enables project configuration unconditionally. Use
# its library entrypoint with only the user source: a repository must not
# redirect inference through .vibe/config.toml or project agent profiles.
# Python isolated mode also excludes the checkout from its import path.
# No notices until mid-turn prompt behavior is established.
[vibe]
command = ["/opt/agentic-job/vibe/bin/python3", "-I", "-c", '''
import sys
from vibe.core.paths import bootstrap_vibe_home
from vibe.core.config.harness_files import init_harness_files_manager
bootstrap_vibe_home()
init_harness_files_manager("user")
from vibe.acp.agent import run_acp_server
sys.stdout.reconfigure(line_buffering=True)
sys.stderr.reconfigure(line_buffering=True)
run_acp_server(legacy_harness=True)
''']

# A scripted agent with no model behind it (src/bin/fake-agent.rs), for
# runs without inference: it plays fake-agent-demo.json.
[fake]
command = ["fake-agent", "demo"]
notices = true
