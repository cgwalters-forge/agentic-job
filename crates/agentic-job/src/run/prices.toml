# API list prices of the models runs use, in USD per million tokens, as
# the providers published them on `date` (see prices.rs). Pinned here and
# never fetched at run time: a run's cost is then the same figure however
# often it is read, and a change of price is a reviewed change.
#
# Sources: https://platform.claude.com/docs/en/about-claude/pricing and
# https://developers.openai.com/api/docs/pricing, standard tier.
#
# Only the base tier of each model: the proxy counts a run's tokens, not
# each request's prompt size, so the long-prompt rates (Claude Haiku 5.5
# over 100,000 tokens, OpenAI's over 272,000) and cache-write premiums,
# which the proxy does not count, are left out. A figure is therefore a
# lower bound for runs that use them. A model not listed is unpriced, not
# free.
#
# Names are matched after the provider prefix (`praxis/`) and a date
# suffix (`-20251101`) are dropped and dots read as dashes, so
# `claude-sonnet-4.5` is `claude-sonnet-4-5`.

date = "2026-10-29"

[models]
"claude-fable-5-1" = { input = 10.0, cached-input = 0.25, output = 50.0 }
