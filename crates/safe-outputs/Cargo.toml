[package]
name = "safe-outputs"
description = "gh-aw's safe-output contract: the request vocabulary and collector, the policy and its bounds, and the check of a hand-back against them, bounded, without an agent run or a CI system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "safe-outputs"
path = "src/main.rs"
required-features = ["clap"]

[features]
default = ["clap"]
# `Kind`, and apply's `Forge`, `Kind` and `State`, as command-line
# values, for a caller that takes them as ones.
clap = ["dep:clap"]
# apply's mock forge and test repositories (`apply::testing`), for a
# caller's tests of its own adapters.
test-support = []

# Nothing of agentic-job or secure-host: callers read the policy, the
# hand-back and their credentials, and give this the text and settings.
[dependencies]
anyhow.workspace = true
# GitLab's git credential (apply::gitlab).
base64.workspace = true
# A replacement commit's Date header (check::replacement).
chrono.workspace = true
clap = { workspace = true, optional = true }
regex.workspace = true
# GitHub's publishing: the temporary IDs and the digests gh-aw's handlers
# make (apply::publish).
ring.workspace = true
rustix.workspace = true
serde.workspace = true
# The collector's results follow the configuration's and the request's
# key order, as gh-aw's do, and read numbers as JavaScript does: stated
# here, not left to whatever else the binary links (agent-client-protocol
# brings `preserve_order` to agentic-job).
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
# The checkout apply's push is made in (apply::git).
tempfile.workspace = true
# A bounds file's `[github.trigger]` table, carried unread where its caller
# gives no type of its own.
toml.workspace = true
unicode-normalization.workspace = true
# The Forgejo, GitLab and GitHub APIs (apply::forgejo, apply::gitlab,
# apply::github), with the token the caller gives.
ureq.workspace = true
