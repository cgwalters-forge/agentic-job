# Replace with exact public target repositories; no wildcard write destinations.
hosts = ["github.com"]
repos = ["cgwalters-forge/agentic-job"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
