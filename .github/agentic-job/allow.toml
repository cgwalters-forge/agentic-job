# This repository's bounds: what a run started from here may ask for.
# The policy job checks each run's request against it before anything
# else happens (`agentic-job policy --allow`). A caller keeps a file like
# this in its own repository and names it in the `allow` input.

# The hosts a clone URL may name, exactly. The workflow clones from
# github.com.
hosts = ["github.com"]
# Globs, ignoring case: `*` is anything but a slash, `**` anything.
repos = ["cgwalters-forge/agentic-job"]
bases = ["main"]

# The most outputs a run may hand back in all, and how large a change.
max_outputs = 5
max_patch_bytes = 1048576
max_patch_files = 50

# The output types a run may ask for, and the most of each, under this
# repository's forge section: [github] here, or [forgejo]/[gitlab] on
# another forge (#1393, docs/safe-outputs.md).
[github.outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 3 }
missing_data = { max = 3 }

# Default protected names include dependency manifests/lockfiles, AGENTS.md,
# CLAUDE.md, CONTRIBUTING.md, SECURITY.md and CODEOWNERS; README.md is not one.
# Opt out only for exact repositories (no globs); see docs/safe-outputs.md.
# [unprotected_files]
# repos = ["OWNER/REPO"]
# files = ["CONTRIBUTING.md"]
# dot_folders = [".github"] allows workflow edits; read the prerequisites in
# docs/safe-outputs.md first. This cannot allow other dot-folders, git
# internals, binaries, symlinks, submodules, new executables, renames or
# mode changes. Add scripts without the executable
# bit and invoke them with their interpreter instead.

# Which events may start a run from this repository, and who may start
# one (`agentic-job event`, docs/events.md). Without this table no event
# does. The roles are gh-aw's default, exactly: a reader or a triager
# may not; a bot may only when listed; a pull request from a fork may
# not; a comment has to start with `/agent`.
[github.trigger]
events = ["issue_comment", "pull_request", "pull_request_target", "schedule", "workflow_dispatch"]
roles = ["admin", "maintain", "write"]
bots = []
forks = false
commands = ["/agent"]
