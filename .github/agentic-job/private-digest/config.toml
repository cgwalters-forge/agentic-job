# The agent job's configuration for the private digest caller
# (workflow.yml beside this file), on GitHub's hosted `ubuntu-26.04`. The
# [sandbox] tables are hosted.toml's except for the pinned probe image.

[sandbox]
stop-services = [
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "iscsid.socket",
    "iscsid.service",
]
close-resolved = true

[sandbox.check]
# Keep container/subordinate-UID probes on. The allowlist admits this
# official UBI image's registry; see docs/private-repositories.md.
container-image = "registry.access.redhat.com/ubi10/ubi-minimal@sha256:ab67cd02caf8706e34a695a1432ebe965934f6128ec352a6c3f4048b43a4fb5e"
allow-sockets = [
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

# `run` refuses a private policy without the proxy, or with a proxy
# policy that is not a domain allowlist or keeps a write rule other than
# git fetch's. The path is in the calling repository, relative to its
# root: keep this directory where it is when copying it. The workflow makes
# it absolute for the host image, whose working directory is /.
[egress]
proxy = true
policy = ".github/agentic-job/private-digest/egress.toml"

# The egress proxy's nftables rules; not hosted.toml's podman, which a
# digest does not build with.
[setup]
packages = ["nftables"]
