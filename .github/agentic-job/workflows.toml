# The workflow files `agentic-job workflows check` does not hold to its
# rules, each with the reason (docs/workflows-check.md). An exempt file
# runs with none of the guarantees the check gives, so each entry is
# for a maintainer to land after reading its reason.
#
# This repository is the reusable workflow and secure-host's source, and
# its own CI. Its files call them by local path, to test this revision,
# where a caller names cgwalters-forge/agentic-job/...@COMMIT; or are the
# reusable workflow's own jobs; or build, release and test the binaries.
[exempt]
"feed.yml" = "Opt-in maintenance on trusted default-branch code only; downloads domain data without executing it, with a dedicated publishing token restricted to the final step."
"agentic-job.yml" = "The reusable workflow itself: its agent job is agent.yml's; register, the only job with id-token, runs the policy job's binary alone; and policy, check and apply run no untrusted step."
"agent.yml" = "Part of the reusable workflow: its agent job runs the secure-host forwarder from the policy-selected source checkout, then the agent as the runner's user, with read-only permissions, no id-token, and no secret but the run token, which is the agent's anyway, and a network step's, spent before secure-host."
"apply.yml" = "Part of the reusable workflow: the apply job, the only one with a write token, runs no untrusted step."
"check.yml" = "Part of the reusable workflow: reads the agent's outputs as data, with a read-only token."
"policy.yml" = "Part of the reusable workflow: decides admission and writes policy before any untrusted step."
"review.yml" = "This repository's review runs: the reusable workflow's jobs, with an agent job of its own for its one privileged step, joining the inference tailnet."
"dispatch.yml" = "Calls this revision's reusable workflow by local path; a copy in another repository pins it by commit."
"example.yml" = "Calls this revision's reusable workflow by local path; a caller pins it by commit."
"example-command.yml" = "Calls this revision's reusable workflow by local path; a caller pins it by commit."
"example-compose.yml" = "Composes this revision's policy, check and apply workflows by local path to test them."
"example-pull-request.yml" = "Calls this revision's reusable workflow by local path; a caller pins it by commit."
"example-schedule.yml" = "Calls this revision's reusable workflow by local path; a caller pins it by commit."
"example-secure-host.yml" = "Runs this revision's secure-host by local path, and probes runner-command injection with deprecated log commands."
"ci.yml" = "This repository's CI: tests this revision's source, secure-host and reusable workflow, naming them by local path, and the host hardening itself."
"build.yml" = "Builds this revision's binaries, for CI, release and pinning."
"pin.yml" = "Publishes the release pin for a pushed main revision."
"release.yml" = "Publishes a version of main by hand: tags its commit and releases its binaries."
"safe-outputs-probe.yml" = "Drives gh-aw's collector and handlers on a recorded artifact, by hand, with no agent and no untrusted step."
"specs.yml" = "Model-checks this repository's specifications with a read-only token."
"workflow-ingress.yml" = "Runs the base branch's analyzers on proposed workflow files as data."
"runner-egress.yml" = "Observes a hosted runner's own outbound destinations, so it must run without secure-host's egress rules; opt-in by repository variable, with a read-only token and only this revision's probe and tests."
"world-write.yml" = "Called from CI: tests the world-write BPF loader on its own, on a hosted runner, with a read-only token."
