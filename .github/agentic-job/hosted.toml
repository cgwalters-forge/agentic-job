# What the inputs of the workflow do not cover, for an agent that runs on
# GitHub's hosted `ubuntu-26.04`: the `config` input names this file. The
# workflow adds the agent, the inference proxy, the limits and the
# packages from its inputs. Another runner image listens on other
# sockets: `agentic-job sandbox check` fails on each one that is left and
# names it.

[sandbox]
# Daemons of the image that listen for every local user and that an agent
# run does not use.
stop-services = [
    # The runner's user is in docker's group.
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "iscsid.socket",
    "iscsid.service",
]
# systemd-resolved, which the whole runner resolves names with, resolves
# them for any user, around the egress proxy: setup leaves it to root and
# the runner's user (cgwalters-forge/actions's secure-host/docs/egress.md).
close-resolved = true

[sandbox.check]
allow-sockets = [
    # systemd-networkd, which the runner's network depends on: it
    # describes the links to any user and changes them only for root.
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

# The egress proxy and the network rules are on by default: no [egress].

[setup]
# The egress proxy is the binary's own, behind nftables rules; podman
# is what an agent builds containers with.
packages = ["nftables", "podman", "uidmap"]

# The toolchain of each target repository, added to the packages above
# for a run on it (`default` for any other). It is the caller's choice:
# nothing is read from the target's own, untrusted, contents
# (docs/dispatch.md#giving-runs-a-toolchain).
[setup.repo-packages]
# Ubuntu 26.04's Rust 1.93 (this repository needs 1.88), gcc, and
# rustfmt with cargo-fmt for `[commit] format` below.
# No egress rule is added: the proxy lets any GET through, and a
# `cargo build --locked` only reads, from
#   index.crates.io   the sparse index
#   static.crates.io  the crates, checked against Cargo.lock
#   github.com        git dependencies (git fetch is already allowed)
# Their build scripts and proc macros run as the sandbox user.
"cgwalters-forge/agentic-job" = ["cargo", "rustfmt"]

[commit]
# GitHub's own Actions bot, whose noreply address it attributes for any
# caller; a caller wanting another author sets it in its own config or
# pins it in a bounds file (docs/safe-outputs.md#the-bounds-and-the-policy).
author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
trailers = ["Generated-by: AI"]
# Format the agent's Rust before the patch is taken, so that a hand-back
# does not fail `cargo fmt --check` (docs/safe-outputs.md#what-the-agent-does).
# A target without rustfmt in its packages above gets a warning.
format = true
