# Bounds for the shipped dispatch caller. Copy and replace the exact repo.
hosts = ["github.com"]
repos = ["cgwalters-forge/agentic-job"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
# The fix profile is off. It pushes only to the branch of a pull request
# apply opened from its own fork (#430), so it needs SAFE_OUTPUTS_PAT in an
# apply environment. To enable it, with the branches it may push to:
# push_to_pull_request_branch = { max = 1, branches = ["dispatch/**"] }

# To deliberately permit protected documentation:
# [unprotected_files]
# repos = ["OWNER/REPO"]
# files = ["README.md"]
