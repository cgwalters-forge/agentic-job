# Bounds for the shipped dispatch caller. Copy and replace the exact repo.
hosts = ["github.com"]
repos = ["cgwalters-forge/agentic-job"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50
# Links kept in what a run posts, subdomains included, besides gh-aw's
# GitHub domains: a research report cites distribution and upstream
# sources. A link to any other host is posted as `text (host/redacted)`.
allowed_domains = [
  "almalinux.org",
  "alpinelinux.org",
  "archlinux.org",
  "centos.org",
  "crates.io",
  "debian.org",
  "docs.rs",
  "fedoraproject.org",
  "freedesktop.org",
  "gentoo.org",
  "gitlab.com",
  "gnome.org",
  "gnu.org",
  "kernel.org",
  "launchpad.net",
  "lwn.net",
  "nixos.org",
  "opencontainers.org",
  "opensuse.org",
  "podman.io",
  "python.org",
  "redhat.com",
  "rockylinux.org",
  "rust-lang.org",
  "sourceware.org",
  "systemd.io",
  "ubuntu.com",
]

[outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
# The fix profile is off. It pushes to an open pull request's branch where
# the applying user may push and apply allows (#553), so it needs
# SAFE_OUTPUTS_PAT in an apply environment. To enable it, with the
# branches it may push to:
# push_to_pull_request_branch = { max = 1, branches = ["dispatch/**"] }

# To deliberately permit protected documentation:
# [unprotected_files]
# repos = ["OWNER/REPO"]
# files = ["CONTRIBUTING.md"]
