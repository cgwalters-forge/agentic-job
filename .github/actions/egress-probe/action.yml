name: Egress write-policy probe
description: >-
  CI's stand-in for a third-party JavaScript action, run after secure-host with
  egress.write-policy: with no proxy in its environment it reads an arbitrary host,
  and the egress proxy refuses it a POST there (cgwalters-forge/actions's secure-host/docs/egress.md).
runs:
  using: node24
  main: main.mjs
