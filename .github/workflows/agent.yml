# The agent job of agentic-job.yml, in a file of its own so that the run
# token of the register job before it arrives as a secret: GitHub masks a
# secret of a called workflow in every log of its jobs, and nothing but a
# call's `secrets:` can make a value from another job one
# (docs/workflow.md#the-run-token). Called only by agentic-job.yml and
# review.yml, at their own commit.
name: agentic-job agent

on:
  workflow_call:
    inputs:
      policy:
        description: >-
          `toJSON(needs.policy.outputs)` of the policy.yml call in this run: the caller's commit,
          the source of the binary and the trusted upload IDs
        type: string
        required: true
      runner:
        description: The runner the agent runs on, as JSON
        type: string
        required: true
      github-reads:
        description: Give the agent job's own read-only GitHub token as GH_TOKEN
        type: boolean
        required: true
      secure-host-image-artifact-id:
        description: >-
          For testing an unreleased secure-host image: the ID of an artifact of this workflow run
          holding build.yml's secure-host.tar, which runs as root in place of the pinned, attested
          image, unverified. Empty for the pinned image
        type: string
        default: ""
      network:
        description: >-
          Run the caller's .github/agentic-job/network action, from the checkout of the policy job's
          commit, as root before secure-host: review.yml's step for reaching the inference proxy
        type: boolean
        default: false
      agent-user:
        description: >-
          `runner` runs the agent as the runner's user, as every step after secure-host is;
          `sandbox` as the second user secure-host makes, which then also runs `setup.script`
        type: string
        default: runner
    # By default the agent is the runner's user, as every step after
    # secure-host is, and can read whatever the job holds: so the job
    # holds nothing but the run token, which is the agent's to use anyway,
    # and the network step's key, spent before the agent starts. No
    # repository secret comes here, with either `agent-user`; an inference
    # key or MCP credential would need a second user (`run --runner-home`
    # refuses both), and the workflow passes neither on.
    secrets:
      # The register job's output: the broker's run token for
      # `github-oidc`, empty for every other mode. Only `run` gets it, and
      # gives the agent this token: narrow, capped and expiring.
      INFERENCE_RUN_TOKEN:
        required: false
      # With `network`: what the caller's network step left in the job
      # before this one (review.yml's register job), for a join that needs
      # no identity token, such as a single-use key; given to that step
      # alone, as its `secret` input. It has to be spent there: anything
      # still valid after secure-host is the agent's.
      NETWORK_SECRET:
        required: false
    outputs:
      exit:
        value: ${{ jobs.agent.outputs.exit }}
      failure-class:
        value: ${{ jobs.agent.outputs.failure-class }}
      over-budget:
        value: ${{ jobs.agent.outputs.over-budget }}
      secret-at:
        value: ${{ jobs.agent.outputs.secret-at }}
      safe-outputs-artifact-id:
        value: ${{ jobs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest:
        value: ${{ jobs.agent.outputs.safe-outputs-artifact-digest }}
      session-endpoint:
        value: ${{ jobs.agent.outputs.session-endpoint }}
      job:
        value: ${{ jobs.agent.outputs.job }}

jobs:
  agent:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 360
    # The job token the agent gets for GitHub reads (`gh`, the API): read
    # only, so that one it leaks cannot write. A caller must grant at least
    # these to the call, or GitHub refuses the whole workflow. No
    # `id-token`: the register job registered the run, and with it any
    # step here, or anything that became the runner's user, could mint
    # identity tokens for any audience.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      # One of the run action's fixed failure kinds, or empty: apply's
      # conclude puts it in the status comment, and a caller's
      # dispatcher decides on it (docs/workflow.md).
      failure-class: ${{ steps.run.outputs.failure-class }}
      over-budget: ${{ steps.run.outputs.over-budget }}
      secret-at: ${{ steps.run.outputs.secret-at }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
      # With `session`: where the operator attaches; also in the job's
      # summary from when the agent starts.
      session-endpoint: ${{ steps.run.outputs.session-endpoint }}
      # This job's ID, for review.yml's footer to link (#592).
      job: ${{ job.check_run_id }}
    # The same steps a caller-owned agent job has, with no steps of the
    # caller's between prepare and secure-host or after run.
    steps:
      # The calling repository at the policy job's commit, for the setup
      # script the configuration names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.policy).ref }}
          persist-credentials: false
      # The actions from the policy job's own repository and commit, the
      # binary's: without them the checkout would take the caller's.
      - name: The policy call's source repository and commit
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
        run: |
          echo "$SOURCE_REPOSITORY at $SOURCE_SHA"
          [[ "$SOURCE_REPOSITORY" == */* && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(inputs.policy).source-repository }}
          ref: ${{ fromJSON(inputs.policy).source-sha }}
          path: .agentic-job-source
          persist-credentials: false
      - uses: ./.agentic-job-source/prepare # zizmor: ignore[self-repository] Execute the policy-selected source checkout, not the caller repository.
        with:
          binary-artifact-id: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          policy-artifact-id: ${{ fromJSON(inputs.policy).policy-artifact-id }}
      # No caller code may run with open egress while private source is in
      # this checkout, including when the requested target is public.
      # Only the runner's user is refused what needs a second user.
      - name: Admit the runner-user configuration
        env:
          CALLER_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          AGENT_USER: ${{ inputs.agent-user }}
        run: python3 .agentic-job-source/workflow/runner-setup.py admit
      # With `network`: the deployment's step for reaching the inference
      # proxy (a VPN or tailnet join), as root before anything of the
      # agent's is on the machine. It is the caller's, from the policy
      # job's commit (review.yml's base, never a pull request's head);
      # absent, nothing runs.
      - name: The caller's network step
        if: ${{ inputs.network && hashFiles('.github/agentic-job/network/action.yml') != '' }}
        uses: ./.github/agentic-job/network # zizmor: ignore[self-repository] The caller's own action at the policy-decided commit.
        with:
          secret: ${{ secrets.NETWORK_SECRET }}
      # Where the configuration names an inference proxy: a TCP connection
      # to it as the runner's user, before setup, so that a runner off the
      # proxy's network fails here and says so rather than in a probe of
      # setup's rules. It sends no HTTP request, run token or model
      # credential; a configuration without a proxy and the scripted agent
      # are not checked.
      - name: Check inference proxy reachability
        run: agentic-job secure-host inference .agentic-job/config.toml
      # The policy job's configuration for the host, by its binary. The
      # image runs `setup.script` from the host's root as its second user:
      # the agent with `agent-user: sandbox`; for the runner's user this
      # job leaves it out and runs it itself, below.
      - name: The host's configuration
        env:
          AGENT_USER: ${{ inputs.agent-user }}
        run: |
          [ "$AGENT_USER" = sandbox ] || set -- --no-script
          agentic-job config --host "$@" --from .agentic-job/config.toml > "$RUNNER_TEMP/agentic-job-host.toml"
      - if: ${{ inputs.secure-host-image-artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.secure-host-image-artifact-id }}
          path: ${{ runner.temp }}/secure-host-image
      # cgwalters-forge/actions/secure-host, through the forwarder of the
      # policy job's commit, which pins it: its image takes root from this
      # job and proves it. Every step after it is this file's, as the
      # runner's user without root, and so is the agent (tracker#674)
      # unless `agent-user` is `sandbox`.
      - uses: ./.agentic-job-source/secure-host # zizmor: ignore[self-repository] Execute the policy-selected source checkout, not the caller repository.
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
          image-archive: ${{ inputs.secure-host-image-artifact-id != '' && format('{0}/secure-host-image/secure-host.tar', runner.temp) || '' }}
      # The configuration's `setup.script`, the caller's, for a toolchain,
      # when the agent is the runner's user: without root, in the agent's
      # home and with its variables. The image ran it for the sandbox user.
      - name: The setup script
        if: ${{ inputs.agent-user != 'sandbox' }}
        env:
          AGENT_HOME: ${{ runner.temp }}/agent-home
        run: |
          python3 .agentic-job-source/workflow/runner-setup.py setup
      # The agent as the runner's user, in its own home, or as the sandbox
      # user, in that user's; `run` uploads before reporting a limit.
      - id: run
        timeout-minutes: 340
        uses: ./.agentic-job-source/run # zizmor: ignore[self-repository] Execute the policy-selected source checkout, not the caller repository.
        with:
          agent-user: ${{ inputs.agent-user }}
          runner-home: ${{ inputs.agent-user != 'sandbox' && format('{0}/agent-home', runner.temp) || '' }}
          github-token: ${{ inputs.github-reads && github.token || '' }}
          inference-run-token: ${{ secrets.INFERENCE_RUN_TOKEN }}
