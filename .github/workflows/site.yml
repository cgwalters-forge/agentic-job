# The documentation site: a build and link check on every change and on
# main, after secure-host, with a read-only token and no secret.
#
# It does not publish. deploy-pages needs the OIDC request credential, and
# `agentic-job workflows check` refuses `id-token` in every job, with or
# without secure-host; a Pages deploy needs an exemption, which can only
# land once this file is on the base branch.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The toolchain first: no step may run between the checkout and
      # secure-host, with root and the checked-out tree.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgwalters-forge/actions/secure-host@5906e6745c4e3e1c68b698dacf409a452c727d08 # main, with secure-host:v0.6.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - run: just site-test
      - run: just site-build
      # `just site-check`, with the lychee ci.yml uses. The action's shell
      # evaluates args, so it expands $GITHUB_WORKSPACE (lychee wants an
      # absolute root), which the checker refuses as an expression here.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --index-files index.html,. --no-progress --root-dir "$GITHUB_WORKSPACE/site/dist" "site/dist/**/*.html"
          failIfEmpty: true
          fail: true
