# One agent run, as the pieces a caller can also put together itself,
# with steps of its own in the agent job (docs/workflow.md). This file is
# that composition for a caller with no steps of its own: it configures
# all of it through `with:` and never edits this repository.
#
#   policy  policy.yml: the request against the caller's bounds, before a
#           machine is spent on the agent; builds the binary
#   register  the run's registration at the inference proxy, with the
#           identity-token permission the agent's job does not get
#   agent   agent.yml: the agent, as the runner's user without root on the
#           caller's machine (or the sandbox user, with `agent-user`):
#           prepare, secure-host and run, the actions of this repository
#   check   check.yml: what the agent handed back, on a machine it never
#           touched
#   apply   apply.yml: the only job with a credential that can write
#
# The binary every job runs comes from this file's own repository at this
# file's own commit, so a caller that pins the workflow pins the binary:
# the policy job takes a release's by the checksum in
# an attested release manifest when that release was built from the source at
# this commit, and builds it from that source otherwise, or when the
# caller says so. The agent's machine is secured by the action of that
# directory, the same step any job can run first (docs/secure-host.md).
# Artifacts pass between the jobs by the id their upload returned: a name
# can be uploaded again by a later job, an id cannot.
#
# Every input reaches a step through its environment and is never pasted
# into a script, and the agent's configuration is written by `agentic-job
# config`, which takes each as a value and nothing else.
name: agentic-job

on:
  workflow_call:
    inputs:
      id:
        description: The caller's name for this run (an issue, a board item); in summary.json as `item`
        type: string
        required: true
      task:
        description: >-
          The task given to the agent. Public, like everything about a run. With `event`, the
          standing instruction the event's text follows, 64 KiB at most
        type: string
        default: ""
      proposals-artifact:
        description: Artifact from a caller job containing outputs.jsonl (and optional base.json and patch); skips the agent
        type: string
        default: ""
      review:
        description: Enforce an analysis-only pull request review with a pinned head and verdict comment
        type: boolean
        default: false
      review-task:
        description: Review task file in the trusted base checkout, never the review head
        type: string
        default: ""
      review-item:
        description: Positive pull request number for an operator-dispatched review (not an event run)
        type: string
        default: ""
      push-item:
        description: >-
          Positive pull request number in `repo` whose branch a branch run starts from and pushes one
          commit to (`push_to_pull_request_branch`, off unless the bounds allow it); replaces `base`.
          Apply pushes only where its user may, never to a default or protected branch, and to a
          branch of anything but its user's fork (`repo` itself or another's fork) only where that
          repository accepts it
        type: string
        default: ""
      repo:
        description: The repository the agent works on, OWNER/NAME on github.com; it must be public, or the calling repository where the bounds set `private = true` (docs/private-repositories.md)
        type: string
        required: true
      base:
        description: The branch of it the agent starts from
        type: string
        default: main
      kind:
        description: "`branch` for a run that may propose a change, `analysis` for one that may not"
        type: string
        default: branch
      outputs:
        description: The output types the run may hand back, comma separated, or `all` for what the bounds allow
        type: string
        default: create_pull_request,noop,missing_tool
      max-outputs:
        description: The most outputs the run may hand back in all, or `max` for the bounds' own ceiling
        type: string
        default: "3"
      allow:
        description: The caller's bounds file, a path in the calling repository (`agentic-job policy --allow`)
        type: string
        required: true
      config:
        description: >-
          A configuration file in the calling repository (TOML) for what the inputs below do not
          cover: the services to stop on the runner, the sockets it may keep, the egress rules,
          the commit's author. The inputs below go over it. A path under `.agentic-job-source/`
          is in this workflow's own source at the called commit, as for this repository's hosted.toml
        type: string
        default: ""
      agent:
        description: "The agent: `claude`, `opencode`, `vibe`, or `fake`, a scripted one that needs no inference"
        type: string
        default: fake
      fake-profile:
        description: Built-in scripted trial, implement, comment or review; only with agent fake and no setup
        type: string
        default: ""
      model:
        description: The model, as the agent names it (empty for the agent's own default)
        type: string
        default: ""
      context:
        description: 'Public reference repositories on an allowed host: JSON array of {"repo":"OWNER/REPO","ref":"optional branch, tag or SHA"}, at most 8'
        type: string
        default: '[]'
      agent-config-repo:
        description: A public repository, OWNER/NAME, holding the agent's configuration
        type: string
        default: ""
      agent-config-ref:
        description: The branch or tag of it (empty for its default branch)
        type: string
        default: ""
      agent-config-path:
        description: The directory of it the configuration is in (empty for its root)
        type: string
        default: ""
      agent-skills:
        description: Install the binary's skills and subagents for claude or opencode, for a task that names one (docs/skills.md)
        type: boolean
        default: false
      runner:
        description: The runner of the policy, check and apply jobs, as JSON (a label or a list of labels). It needs rustup, apt and Node
        type: string
        default: '"ubuntu-24.04"'
      agent-runner:
        description: The runner the agent runs on, as JSON. It is thrown away after the job, and needs systemd 257 and sudo for its user until `sandbox setup`, which takes it away
        type: string
        default: '"ubuntu-26.04"'
      build-binary:
        description: >-
          Build the binary from this workflow's source on every run, also where a release fits its
          commit and would be fetched by its checksum
        type: boolean
        default: false
      inference-url:
        description: >-
          The inference proxy, as http://ADDRESS:PORT, or with `api-key` the provider's API root; empty
          for an agent that needs none
        type: string
        default: ""
      inference-register:
        description: "How the run announces itself to the proxy named by `inference-url`: `github-oidc`, `plain`, `token-file` or `api-key`"
        type: string
        default: github-oidc
      inference-provider:
        description: >-
          For `api-key`, the API the key is for: `anthropic` (claude), `openai` (opencode), or
          `github` (either), which is GitHub's billing with a GitHub token as INFERENCE_API_KEY and
          needs no other inference input (docs/inference.md)
        type: string
        default: ""
      inference-audience:
        description: For `github-oidc`, the audience of the identity token
        type: string
        default: ""
      inference-token-file:
        description: For `token-file`, where on the agent's runner the token is
        type: string
        default: ""
      timeout:
        description: Minutes the agent may run
        type: string
        default: "75"
      max-requests:
        description: The most model requests, as the proxy counts them (0 for no such cap)
        type: string
        default: "150"
      max-tasks:
        description: The most subagent tasks the agent may start (0 for no such cap)
        type: string
        default: "4"
      budget:
        description: The most the run may spend, in AIC (hundredths of a dollar; 0 for no such cap)
        type: string
        default: "500"
      session:
        description: >-
          After the task's turn, wait for the operator's prompts over the tailnet (specs/session.md).
          Who may attach and from which page is the configuration's `[session]` table, not an input
        type: boolean
        default: false
      idle-minutes:
        description: With `session`, how long the session waits for the client's next prompt (empty for 10, at most 60)
        type: string
        default: ""
      packages:
        description: Packages the task needs, installed by the runner's package manager; names with spaces between them
        type: string
        default: ""
      npm:
        description: The agent's programs, each NAME@VERSION with an exact version, installed with npm in place of the built-in agent's pinned tarballs
        type: string
        default: ""
      setup:
        description: A script in the calling repository that runs as the sandbox user before the agent, for toolchains
        type: string
        default: ""
      egress-write-policy:
        description: >-
          Hold the agent job's every process after secure-host, the agent's included, to the egress
          proxy's write rules (egress.write-policy, docs/secure-host.md#the-egress-write-policy-for-an-agent-job):
          writes only where a rule allows and to the inference proxy on the tailnet. The agent keeps
          the runner's own Actions-service writes, so a private caller or target stays refused.
          False leaves it to the `config` file, where it is off by default
        type: boolean
        default: false
      output-repo:
        description: Where the outputs are applied, OWNER/NAME (empty for the calling repository). For a new pull request, the patch's base commit must already be in the output repository; comments need no checkout
        type: string
        default: ""
      item-repo:
        description: >-
          The repository `comment-target` and `issue` are numbers of, OWNER/NAME, when that is not
          the output repository (one with issues turned off): comments and the status comment go
          there, a pull request or a new issue still to the output repository. It must be public and
          within the bounds' `repos`. Empty for the output repository; not with `event`, `review-item` or `push-item`
        type: string
        default: ""
      apply-environment:
        description: >-
          An environment of the calling repository gating apply. Explicitly pass SAFE_OUTPUTS_PAT;
          an empty secret falls back to the job token. Empty skips environment
          gates; with no passed secret apply uses the calling repository's job token
        type: string
        default: ""
      apply-partial:
        description: Apply what a run stopped at a limit handed back, as a draft that says it is partial
        type: boolean
        default: false
      apply-staged:
        description: Show what apply would do in its summary and applied.json (`staged` true) without writing anything
        type: boolean
        default: false
      require-safe-outputs-pat:
        description: >-
          Refuse the run before the agent unless SAFE_OUTPUTS_PAT is nonempty, a user's with the repo
          scope that can read the output repository and does not own it; read in a job of its own in
          `apply-environment`, which then gates the run before the agent too
        type: boolean
        default: false
      expect-check-refusal:
        description: Expect a policy-check refusal instead of applying outputs; unexpected acceptance or operational failure still fails
        type: boolean
        default: false
      comment-target:
        description: >-
          The issue or pull request of the output repository (or `item-repo`) an `add_comment` goes to, or `*` for
          the one each comment names. Empty for the issue or pull request that started an
          event-triggered run, and `*` where no event did
        type: string
        default: ""
      issue:
        description: >-
          The issue or pull request of the output repository (or `item-repo`) the run was made for, by number:
          a pull request the run opens says `Refs` to it, and apply links it to what the run made
          when that is not a comment on it. Empty for none
        type: string
        default: ""
      event:
        description: >-
          Decide the run from the event that started the calling workflow (`agentic-job event`,
          docs/events.md): the `[trigger]` table of the bounds file says who may start one and from
          which events; the event's text joins `task` behind a fence; a pull request's base becomes
          the run's; comments go to the triggering item; and a refused event ends the run in the
          policy job, with its reason in the job summary and the other jobs skipped
        type: boolean
        default: false
      notify:
        description: >-
          How a run with an item or numeric comment-target reports its state, by jobs
          that run nothing from the agent's machine: `comment` (an eyes reaction on what started it,
          and a comment edited when the run ends), `reaction` (eyes, then rocket, +1 for a blocked run, or confused), or
          `none`. These write with the call's own token, which then needs `issues: write` or
          `pull-requests: write`
        type: string
        default: none
      status-comment:
        description: >-
          With `notify: comment`, the id of a comment the status goes in instead of the marked
          status comment: used only when it is the status credential's own, on the same item.
          Its opening hidden-comment lines are kept. Empty for the marked status comment
        type: string
        default: ""
      title-prefix:
        description: Put before the title of a pull request or an issue the run opens
        type: string
        default: ""
      branch-prefix:
        description: Put before the name of the branch a pull request is pushed as (`agent-run-RUNID`)
        type: string
        default: ""
      artifact-prefix:
        description: Put before the name of every artifact, for a caller that calls this more than once in a run
        type: string
        default: ""
      github-reads:
        description: >-
          Give the agent job's own read-only GitHub token as GH_TOKEN, for gh and the API.
          False gives it none
        type: boolean
        default: true
      agent-user:
        description: >-
          `runner`, the runner's own user, which secure-host deprivileges; or `sandbox`, the second
          user secure-host makes, which then also runs `setup`, for a uid between the agent and the
          job's own steps and for what needs one (a session, `[setup] tools`, probes before the
          agent). See docs/requirements.md#actors-and-trust
        type: string
        default: runner
      secure-host-image-artifact-id:
        description: >-
          For testing an unreleased secure-host image: the ID of an artifact of the calling run
          holding build.yml's secure-host.tar, which the agent job runs as root in place of the
          pinned, attested image, unverified. Empty for the pinned image
        type: string
        default: ""
    secrets:
      # Explicit optional credential for apply and status comments. Never use inherit.
      # Callers must pass this name even for an environment secret;
      # the environment's same-name value takes precedence (docs/workflow.md).
      SAFE_OUTPUTS_PAT:
        description: Optional credential for applying safe outputs; defaults to the job token when empty
        required: false
      # For `inference-register: api-key` and an `[mcp.NAME]` server: not
      # passed on. The agent is the runner's user now, with no second user
      # between it and `run`, so it could read either from `run`'s
      # environment; `run` refuses both until the host keeps the runner's
      # processes from reading each other. Kept so that callers that pass
      # them still parse.
      INFERENCE_API_KEY:
        description: Not passed on; `inference-register` api-key is refused for now
        required: false
      MCP_TOKEN:
        description: Not passed on; an `[mcp.NAME]` server is refused for now
        required: false
    outputs:
      session-endpoint:
        description: >-
          With `session`, the `wss://` address on the runner's tailnet name where the operator
          attached. Like every output it resolves when the agent job ends; while it runs, the
          address is in that job's log and is the runner's tailnet name (specs/session.md)
        value: ${{ jobs.agent.outputs.session-endpoint }}
      review-head:
        description: The exact review head resolved by the read-only policy job
        value: ${{ jobs.policy.outputs.review-head }}
      exit:
        description: "The exit state of `agentic-job run`: 0, 1 (failed), 3 (a limit, or a hand-back after an error), 4 (never started), 124 (the timeout)"
        value: ${{ jobs.agent.outputs.exit }}
      failure-class:
        description: >-
          What a run that did not end well ended on, as one of the run action's fixed failure
          kinds: `timeout`, `budget`, `stall`, `agent_exit`, or a model provider's failure the
          session could not get past, `inference_rate_limited`, `inference_overloaded`,
          `inference_unreachable` (a wait may clear these three: a dispatcher may requeue the run),
          `inference_quota` or `inference_unauthorized` (it will not: do not). Empty for a run that
          ended well
        value: ${{ jobs.agent.outputs.failure-class }}
      applied-artifact-id:
        description: The artifact holding applied.json, which names what the apply job made
        value: ${{ jobs.apply.outputs.applied-artifact-id }}
      check-refusal:
        description: The policy-check refusal reason, empty when outputs were accepted
        value: ${{ jobs.check.outputs.refusal }}
      pull-request:
        description: The number of the pull request the run opened, if it opened one
        value: ${{ jobs.apply.outputs.pull-request }}
      result-url:
        description: The URL of what apply made, the pull request or else the first comment or issue; empty for none
        value: ${{ jobs.apply.outputs.result-url }}
      blocked:
        description: "`true` when the run handed back only missing_data (and noop) and no change: blocked, not failed"
        value: ${{ jobs.apply.outputs.blocked }}
      trigger:
        description: "For an event-triggered run, what `agentic-job event` decided: `admitted` or `refused`"
        value: ${{ inputs.event && (jobs.policy.outputs.admitted == 'true' && 'admitted' || 'refused') || '' }}
      trigger-reason:
        description: Why, in the binary's words
        value: ${{ jobs.policy.outputs.reason }}
      base:
        description: The branch the run started from, as the policy job decided it (the input, or an event's pull request's base)
        value: ${{ jobs.policy.outputs.base }}

# No `permissions` here: a job that names none keeps what the caller
# granted the call. The policy call's activate and notify jobs and the
# apply call use that token; the policy job, the agent and check name
# their reads.

jobs:
  # A local call runs at this file's commit, which its jobs name as
  # `job.workflow_*`: the binary and the actions below are that commit's.
  policy:
    uses: ./.github/workflows/policy.yml # zizmor: ignore[self-repository,excessive-permissions] Call this revision; inherit caller permissions for activate/notify while policy.yml narrows its policy job to read-only.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    with:
      id: ${{ inputs.id }}
      task: ${{ inputs.task }}
      proposals-artifact: ${{ inputs.proposals-artifact }}
      review: ${{ inputs.review }}
      review-task: ${{ inputs.review-task }}
      review-item: ${{ inputs.review-item }}
      push-item: ${{ inputs.push-item }}
      repo: ${{ inputs.repo }}
      base: ${{ inputs.base }}
      kind: ${{ inputs.kind }}
      outputs: ${{ inputs.outputs }}
      max-outputs: ${{ inputs.max-outputs }}
      allow: ${{ inputs.allow }}
      config: ${{ inputs.config }}
      agent: ${{ inputs.agent }}
      fake-profile: ${{ inputs.fake-profile }}
      model: ${{ inputs.model }}
      context: ${{ inputs.context }}
      agent-config-repo: ${{ inputs.agent-config-repo }}
      agent-config-ref: ${{ inputs.agent-config-ref }}
      agent-config-path: ${{ inputs.agent-config-path }}
      agent-skills: ${{ inputs.agent-skills }}
      runner: ${{ inputs.runner }}
      build-binary: ${{ inputs.build-binary }}
      inference-url: ${{ inputs.inference-url }}
      inference-register: ${{ inputs.inference-register }}
      inference-provider: ${{ inputs.inference-provider }}
      inference-audience: ${{ inputs.inference-audience }}
      inference-token-file: ${{ inputs.inference-token-file }}
      timeout: ${{ inputs.timeout }}
      max-requests: ${{ inputs.max-requests }}
      max-tasks: ${{ inputs.max-tasks }}
      budget: ${{ inputs.budget }}
      session: ${{ inputs.session }}
      idle-minutes: ${{ inputs.idle-minutes }}
      packages: ${{ inputs.packages }}
      npm: ${{ inputs.npm }}
      setup: ${{ inputs.setup }}
      egress-write-policy: ${{ inputs.egress-write-policy }}
      output-repo: ${{ inputs.output-repo }}
      item-repo: ${{ inputs.item-repo }}
      apply-environment: ${{ inputs.apply-environment }}
      apply-partial: ${{ inputs.apply-partial }}
      apply-staged: ${{ inputs.apply-staged }}
      require-safe-outputs-pat: ${{ inputs.require-safe-outputs-pat }}
      expect-check-refusal: ${{ inputs.expect-check-refusal }}
      comment-target: ${{ inputs.comment-target }}
      issue: ${{ inputs.issue }}
      event: ${{ inputs.event }}
      notify: ${{ inputs.notify }}
      status-comment: ${{ inputs.status-comment }}
      title-prefix: ${{ inputs.title-prefix }}
      branch-prefix: ${{ inputs.branch-prefix }}
      artifact-prefix: ${{ inputs.artifact-prefix }}

  # The run's registration at the inference proxy under `github-oidc`,
  # out of the agent's job, which then holds no `id-token` (tracker#674):
  # there any step, or anything that became the runner's user, could mint
  # identity tokens for any audience, the clouds' that trust this
  # repository included. This job has that permission and nothing else,
  # checks out nothing and runs the policy job's binary alone, which asks
  # for a token of the configuration's audience and hands on only the run
  # token the proxy answers with: narrow, capped by the proxy, expiring,
  # and ended by `run`. Another mode, or none, writes nothing, and `run`
  # registers as before. On the agent's runner, which is on the proxy's
  # network as the agent has to be.
  register:
    needs: policy
    # Not for an event that was refused: the run ended in the policy job.
    if: ${{ inputs.proposals-artifact == '' && needs.policy.outputs.admitted == 'true' }}
    runs-on: ${{ fromJSON(inputs.agent-runner) }}
    timeout-minutes: 10
    permissions:
      id-token: write
    # A plain job output, the one way GitHub passes a value from a job:
    # it drops an output that is masked. It is read only by the agent's
    # call below as a secret, which masks it in every log of that job
    # (docs/workflow.md#the-run-token). Step debug logging would log it
    # here as it is set, so `register` then refuses.
    outputs:
      run-token: ${{ steps.register.outputs.run-token }}
    steps:
      # As check.yml's: the binary and configuration of a policy call of
      # another commit would register with that commit's code.
      - name: The policy call is this workflow's commit
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
          BINARY: ${{ needs.policy.outputs.binary-artifact-id }}
          POLICY: ${{ needs.policy.outputs.policy-artifact-id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_REPOSITORY" == "$REPOSITORY" && "$SOURCE_SHA" == "$SHA" ]] ||
            { echo "::error::policy.yml ran at $SOURCE_REPOSITORY@$SOURCE_SHA, this workflow at $REPOSITORY@$SHA: pin all pieces to one commit"; exit 1; }
          # Empty IDs would make download-artifact take every upload.
          [[ "$BINARY" =~ ^[1-9][0-9]*$ && "$POLICY" =~ ^[1-9][0-9]*$ ]] ||
            { echo '::error::register requires binary and policy upload IDs from policy'; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }},${{ needs.policy.outputs.policy-artifact-id }}
          path: .agentic-job
          merge-multiple: true
      - id: register
        name: Register the run at the inference proxy
        env:
          JOB_DIR: ${{ github.workspace }}/.agentic-job
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          "$JOB_DIR/agentic-job" register --config "$JOB_DIR/config.toml" --output "$GITHUB_OUTPUT"

  # The agent, as the runner's user without root on the caller's machine:
  # agent.yml, a call so that the run token is one of its secrets, and the
  # only one. The permissions are those of agent.yml's job: the reads of
  # the token the agent gets.
  agent:
    needs: [policy, register]
    if: ${{ inputs.proposals-artifact == '' && needs.policy.outputs.admitted == 'true' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/agent.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    secrets:
      INFERENCE_RUN_TOKEN: ${{ needs.register.outputs.run-token }}
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      runner: ${{ inputs.agent-runner }}
      github-reads: ${{ inputs.github-reads }}
      secure-host-image-artifact-id: ${{ inputs.secure-host-image-artifact-id }}
      agent-user: ${{ inputs.agent-user }}

  check:
    needs: [policy, agent]
    # Also for a run that failed and still handed something back.
    if: ${{ !cancelled() && needs.policy.result == 'success' && (inputs.proposals-artifact != '' || needs.agent.outputs.safe-outputs-artifact-id != '') }}
    permissions:
      contents: read
      # For check to read the proposals upload's digest.
      actions: read
      # Only check.yml's separate detector job uses OIDC, not the checker.
      id-token: write
    # No secrets cross this read-only boundary; trusted IDs come directly
    # from policy, and only the proposals' ID and digest from the agent job.
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  # Also after a cancelled or failed run, for its conclusion; its jobs
  # decide from the results whether anything is applied.
  apply:
    needs: [policy, agent, check] # zizmor: ignore[excessive-permissions] Safe outputs and conclusion status require the caller-selected write permissions.
    if: ${{ always() && needs.policy.result == 'success' }}
    uses: ./.github/workflows/apply.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}
