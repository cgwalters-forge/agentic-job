# Publishes source-addressed builds, without changing main or opening a PR.
name: prebuilt

on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "crates/**", "egress/**", "skills/**", "workflow/review.md", "secure-host/binary.sh", ".github/workflows/build.yml", ".github/workflows/pin.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  source:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        run: |
          source=$(bash secure-host/binary.sh digest)
          echo "tag=build-$source" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] Build this revision's source with its reusable workflow.
    with:
      cache: false
      release: ${{ needs.source.outputs.tag }}

  # Only publishing gets a contents-write token; it executes no binaries.
  publish:
    needs: [source, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentic-job
          path: dist
      # Sign the manifest from this run's uncached build, without executing it.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/release.json
      - name: Stage the verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.jsonl
      # Exercise the caller's tokenless verification policy before publishing.
      - name: Verify the attested manifest without a token
        run: >-
          GH_TOKEN='' GITHUB_TOKEN='' gh attestation verify dist/release.json
          --bundle dist/provenance.jsonl --repo cgwalters-forge/agentic-job
          --cert-identity https://github.com/cgwalters-forge/agentic-job/.github/workflows/pin.yml@refs/heads/main
          --source-ref refs/heads/main --deny-self-hosted-runners
      # Repeated builds of the same source leave the first release intact.
      - name: Publish if absent
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft"; then
            [ "$(cat "$RUNNER_TEMP/draft")" = true ] || exit 0
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title "$TAG" --notes "Built from $GITHUB_SHA; checksums are in the attested manifest." dist/*
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
