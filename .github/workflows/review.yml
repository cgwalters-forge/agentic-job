# A review of every pull request, by a real agent, and its verdict as the
# commit status `review` on the reviewed head (docs/review.md).
#
# pull_request_target runs this file, its bounds, task and actions from
# the base branch, never the pull request's: the agent reads the head as
# data, fetched by commit inside the sandbox, with no credential. That is
# what makes forks safe to admit; each review spends bounded inference
# (max-requests, budget and timeout below), so only some authors start one
# automatically (the policy job's `if:`).
#
# The deployment has one privileged step of its own: reaching the
# inference proxy. A caller that needs a step for that (a VPN or tailnet
# join) puts it in .github/agentic-job/network, a local action in its own
# repository; the register job and the agent job (agent.yml) run it, from
# the base checkout, before anything else of theirs. Without one, nothing
# runs, and the runner (AGENT_RUNNER) must already reach INFERENCE_URL.
# The identity token's `job_workflow_ref` names this file, so whatever
# admits the run has to admit it (docs/review.md#configuration,
# docs/inference.md). A provider's API key (INFERENCE_REGISTER `api-key`)
# is refused for now, as in agentic-job.yml: the agent is the runner's
# user, which would hold the key.
#
# Another repository calls this file at a pinned commit from the same
# events, with its own copies of the bounds and the task.
#
# A scheduler that paces reviews (agent-board's pass) dispatches one with
# `pr`, `head` and `pool` instead (docs/review.md#dispatched-reviews): the
# pool picks the agent and model from the repository variable REVIEW_POOLS
# alone, the policy job reviews the pull request only while `head` is its
# head, and the run is named for the pass to find it. Dispatching takes
# `actions: write`, a token trusted to spend a review on any open pull
# request.
name: review
run-name: ${{ github.event_name == 'workflow_dispatch' && format('review {0}#{1} {2} ({3})', github.repository, inputs.pr, inputs.head, inputs.pool) || '' }}
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Base-branch policy and actions only; the PR head is data read inside the credential-free sandbox.
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request to review, a positive number
        type: string
        required: true
      head:
        description: The full commit SHA the pull request's head must still be
        type: string
        required: true
      pool:
        description: The inference pool, a name REVIEW_POOLS maps to an agent and a model
        type: string
        required: true
  workflow_call:
    # The dispatch inputs, for a caller that is itself dispatched; empty
    # for its pull_request_target and issue_comment events.
    inputs:
      pr:
        type: string
        default: ''
      head:
        type: string
        default: ''
      pool:
        type: string
        default: ''
    # Forward only this declared credential, never inherit.
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
      # Not passed on, as in agentic-job.yml: `api-key` is refused for
      # now. Declared so that a caller that passes it is not refused.
      INFERENCE_API_KEY:
        required: false
permissions: {}
jobs:
  # A dispatch's pool, mapped to its agent, model and runner configuration
  # by the repository variable REVIEW_POOLS alone, a JSON object the
  # repository owns, `{"POOL": {"agent": "...", "model": "...", "config":
  # "optional path"}}`. The dispatcher names a pool and nothing else: no
  # model or endpoint of theirs reaches the run, and a pool the variable
  # does not map stops it here rather than fall back to AGENT_MODEL, which
  # would spend a pool the scheduler did not pace.
  pool:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      agent: ${{ steps.pool.outputs.agent }}
      model: ${{ steps.pool.outputs.model }}
      config: ${{ steps.pool.outputs.config }}
      config-repo: ${{ steps.pool.outputs.config-repo }}
      config-path: ${{ steps.pool.outputs.config-path }}
    steps:
      - name: Map the pool to its agent and model
        id: pool
        env:
          POOLS: ${{ vars.REVIEW_POOLS }}
          POOL: ${{ inputs.pool }}
          CONFIG_REPO: ${{ vars.AGENT_CONFIG_REPO }}
          CONFIG_PATH: ${{ vars.AGENT_CONFIG_PATH }}
        # One word a value, so that none can add an output; only opencode
        # and Vibe get the configuration repository, as below.
        run: |
          jq -er --arg pool "$POOL" --arg repo "$CONFIG_REPO" --arg path "$CONFIG_PATH" '.[$pool] | objects
            | select([.agent, .model, (.config // "-")] | all(type == "string" and length > 0 and (test("\\s") | not)))
            | (if .agent == "opencode" or .agent == "vibe" then [$repo, $path] else ["", ""] end) as [$r, $p]
            | "agent=\(.agent)\nmodel=\(.model)\nconfig=\(.config // "")\nconfig-repo=\($r)\nconfig-path=\($p)"' \
            <<< "${POOLS:-null}" >> "$GITHUB_OUTPUT" ||
            { echo '::error::The requested pool is not one REVIEW_POOLS maps to an agent and a model'; exit 1; }

  policy:
    needs: pool
    # The event policy checks actors, commands and the pull request.
    # Drafts wait for ready_for_review. Automatic reviews are only for
    # the owner, organization members and collaborators: anyone else,
    # someone with a merged commit included, could open pull requests, or
    # close and reopen one, to drain the broker's shared cap and stall
    # every other run. GitHub sets author_association; the author cannot.
    # Their pull requests are reviewed on a `/review` from someone with
    # write access (docs/review.md). Bots are none of these; one whose
    # numeric user id the repository variable REVIEW_BOT_IDS lists (a JSON
    # array, unset by default) is reviewed too, so that Dependabot's daily
    # updates need no `/review`. The id, not the login, because GitHub
    # never reassigns it; a user's id there admits nobody, being no Bot.
    # Its bounds must also list the bot's login (review.toml `bots`). Not
    # an array, the value would be searched as text, matching part ids.
    # A dispatch, by a token with `actions: write`, has no event to admit: the
    # policy job checks its inputs and binds the pull request instead.
    # The pool job runs for a dispatch alone; skipped, it does not stop
    # an event's review.
    if: >-
      !cancelled() && needs.pool.result != 'failure' && (
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          (github.event.pull_request.user.type == 'Bot' && startsWith(vars.REVIEW_BOT_IDS, '[') &&
            contains(fromJSON(vars.REVIEW_BOT_IDS || '[]'), github.event.pull_request.user.id)))) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')) ||
      (github.event_name == 'workflow_dispatch' && needs.pool.result == 'success'))
    uses: ./.github/workflows/policy.yml # zizmor: ignore[self-repository] Call the base revision's reusable workflow.
    # The policy job reads (actions too, to list runs for `dedupe`);
    # activate and notify have nothing to do.
    permissions:
      actions: read
      contents: read
    with:
      id: review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      repo: ${{ github.repository }}
      event: ${{ github.event_name != 'workflow_dispatch' }}
      # A dispatch's pull request and head, which `agentic-job review
      # dispatch-target` checks before the policy job reads the pull
      # request and `resolve-dispatch` binds it to: open, not a draft, on
      # the configured base and still at `head`. An empty `pr` is `0`,
      # refused there rather than taken for an event review.
      review-item: ${{ github.event_name == 'workflow_dispatch' && (inputs.pr || '0') || '' }}
      review-head: ${{ github.event_name == 'workflow_dispatch' && inputs.head || '' }}
      comment-target: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || '' }}
      review: true
      review-task: workflow/review.md
      task: ''
      kind: analysis
      # The verdict comment or a noop, and up to ten inline findings beside
      # a verdict, which check holds to the triggering pull request: submit
      # puts them in its review, apply in its comment (docs/review.md).
      outputs: add_comment,noop,create_pull_request_review_comment
      max-outputs: '11'
      notify: none
      # Any role, forks included, for the automatic events (the `if:` above
      # narrows them to owner, members, collaborators and listed bots); `/review` from
      # someone who can write.
      allow: ${{ github.event_name == 'issue_comment' && 'workflow/review-command.toml' || 'workflow/review.toml' }}
      # The runner's configuration, as dispatch.yml picks it: the caller's
      # file named by AGENT_CONFIG, else this repository's hosted.toml at
      # the pinned commit, from the policy job's checkout of this source.
      # A dispatched pool's `config` goes first.
      config: ${{ github.event_name == 'workflow_dispatch' && needs.pool.outputs.config || vars.AGENT_CONFIG || '.agentic-job-source/.github/agentic-job/hosted.toml' }}
      # No fallback: without the variables the run fails in policy, where
      # a scripted agent would post a verdict nobody made. A dispatch takes
      # its pool's agent and model, never the variables': empty, the policy
      # job refuses it.
      agent: ${{ github.event_name == 'workflow_dispatch' && needs.pool.outputs.agent || github.event_name != 'workflow_dispatch' && vars.AGENT || '' }}
      model: ${{ github.event_name == 'workflow_dispatch' && needs.pool.outputs.model || github.event_name != 'workflow_dispatch' && vars.AGENT_MODEL || '' }}
      # Only opencode and Vibe read a configuration repository, as in
      # dispatch.yml: passed to Claude, it would demand Claude's file there.
      # The pool job decides that for its agent.
      agent-config-repo: ${{ github.event_name == 'workflow_dispatch' && needs.pool.outputs.config-repo || github.event_name != 'workflow_dispatch' && (vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_REPO || '' }}
      agent-config-path: ${{ github.event_name == 'workflow_dispatch' && needs.pool.outputs.config-path || github.event_name != 'workflow_dispatch' && (vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_PATH || '' }}
      inference-url: ${{ vars.INFERENCE_URL }}
      # A broker's `github-oidc` unless the repository says otherwise
      # (`api-key` is refused by the agent job for now). Repository
      # variables only: no event or comment chooses them.
      inference-register: ${{ vars.INFERENCE_REGISTER || 'github-oidc' }}
      inference-provider: ${{ vars.INFERENCE_PROVIDER }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE }}
      # What one review may spend, stated here rather than inherited: model
      # requests, US dollars (under the broker's `plain`
      # registration only a convention) and the agent's minutes. Nothing
      # caps it per author or across pull requests; a push supersedes the
      # last review of that pull request, which has spent what it spent.
      max-requests: '150'
      budget-usd: '5'
      timeout: '75'

  # A refusal spends no inference, but must not silently leave the PR waiting.
  # Reuse the bounded, author-checked status comment, never PR-owned code.
  refusal:
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.policy.outputs.admitted == 'false' && needs.policy.outputs.binary-artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: agentic-job-status-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      # The policy job's binary of the pinned source, by ID from this
      # file's own jobs: the `if:` above keeps an empty ID from
      # downloading every upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Report the policy refusal in the single status comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
          # The reason as one inert line (`agentic-job review admit`).
          TEXT: ${{ needs.policy.outputs.refusal }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" status

  # With the variable REVIEW_CARRY_APPROVAL, a push whose new head is the
  # approved previous head rebased onto the base branch, or rustfmt's
  # output of it, carries that approval instead of running the agent: a
  # rebase or format-only push used to cost a full review (#2163). The
  # previous head must have the status `review` success by the job
  # token's bot; the comparison is exact (`agentic-job review carry`,
  # docs/review.md#carried-approvals). git and rustfmt read the heads as
  # data in a scratch directory; nothing of theirs runs. Anything else,
  # or a failure here, runs the review. A `/review` always runs one. A
  # push the record job below would only record tries this first, with or
  # without the variable: carried, it needs no dispatched review either.
  carry:
    needs: policy
    if: >-
      ${{ (vars.REVIEW_CARRY_APPROVAL == 'true' ||
          (github.event_name == 'pull_request_target' && startsWith(vars.REVIEW_RECORD_ONLY, '[') &&
            contains(fromJSON(vars.REVIEW_RECORD_ONLY || '[]'), github.event.pull_request.user.id) &&
            github.event.pull_request.head.repo.full_name != github.repository)) &&
          github.event_name == 'pull_request_target' &&
          github.event.action == 'synchronize' && needs.policy.outputs.admitted == 'true' &&
          needs.policy.outputs.binary-artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The repository to fetch the heads and base from, and the previous
    # head's statuses.
    permissions:
      contents: read
      statuses: read
    outputs:
      from: ${{ steps.carry.outputs.from }}
      why: ${{ steps.carry.outputs.why }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Compare the new head with the approved one
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review carry --output "$GITHUB_OUTPUT"

  # With the repository variable REVIEW_RECORD_ONLY, a JSON array of user
  # ids (unset by default), a pull request event for one of those authors'
  # pull requests from a fork, admitted as before and not carried, only
  # records that its head needs a review: the status `review` pending, no
  # agent, no inference, no verdict. Its review is the scheduler's
  # dispatch of this file, paced by pool, so that a push no longer starts
  # one out of the scheduler's sight (#2163). The status is set where the
  # head has none yet, so a reopened, approved head keeps its approval
  # (unless a review's status lands between its read and its write).
  # Not in the agent job's concurrency group: it would cancel a dispatched
  # review of this very head that started first. A dispatch for a newer
  # head stops the older one instead. Other authors, a pull request from
  # the repository's own branches and `/review` keep their reviews here.
  record:
    needs: [policy, carry]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request_target' && startsWith(vars.REVIEW_RECORD_ONLY, '[') &&
          contains(fromJSON(vars.REVIEW_RECORD_ONLY || '[]'), github.event.pull_request.user.id) &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          needs.policy.outputs.admitted == 'true' && needs.policy.outputs.review-head != '' &&
          needs.policy.outputs.binary-artifact-id != '' && needs.carry.outputs.from == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Record that the head needs a review
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          RECORD: 'true'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review status

  # As agentic-job.yml's register job: the run's registration at the
  # inference proxy under `github-oidc`, out of the agent's job, which
  # then holds no `id-token`. The agent is the runner's user there, and
  # with that permission could mint identity tokens for any audience.
  # This job also runs the caller's network step, from the base commit,
  # since it has to reach the proxy too. Not for a carried approval, nor
  # for a head the record job leaves to a dispatched review.
  register:
    needs: [policy, carry]
    if: >-
      ${{ !cancelled() && needs.policy.outputs.admitted == 'true' && needs.carry.outputs.from == '' &&
          !(github.event_name == 'pull_request_target' && startsWith(vars.REVIEW_RECORD_ONLY, '[') &&
            contains(fromJSON(vars.REVIEW_RECORD_ONLY || '[]'), github.event.pull_request.user.id) &&
            github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ fromJSON(vars.AGENT_RUNNER || '"ubuntu-26.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Read only by the agent's call below, each as a secret, which masks it
    # in every log of that job (docs/workflow.md#the-run-token). The network
    # step's `secret`, empty for a step without one, is what the agent
    # job's network step joins with, having no identity token.
    outputs:
      run-token: ${{ steps.register.outputs.run-token }}
      network-secret: ${{ steps.network.outputs.secret }}
    steps:
      # The policy call is by local path, so of this file's commit; unlike
      # agentic-job.yml's register job, there is no other pin to compare.
      - name: The policy call's upload IDs
        env:
          BINARY: ${{ needs.policy.outputs.binary-artifact-id }}
          POLICY: ${{ needs.policy.outputs.policy-artifact-id }}
        run: |
          # Empty IDs would make download-artifact take every upload.
          [[ "$BINARY" =~ ^[1-9][0-9]*$ && "$POLICY" =~ ^[1-9][0-9]*$ ]] ||
            { echo '::error::register requires binary and policy upload IDs from policy'; exit 1; }
      # The base commit the policy job decided, never the head, and only
      # for the network step: a pull request cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false
      - name: The caller's network step
        id: network
        if: ${{ hashFiles('.github/agentic-job/network/action.yml') != '' }}
        uses: ./.github/agentic-job/network # zizmor: ignore[self-repository] The caller's own action at the policy-decided base commit, not the head.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }},${{ needs.policy.outputs.policy-artifact-id }}
          path: ${{ runner.temp }}/agentic-job
          merge-multiple: true
      - id: register
        name: Register the run at the inference proxy
        env:
          JOB_DIR: ${{ runner.temp }}/agentic-job
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          "$JOB_DIR/agentic-job" register --config "$JOB_DIR/config.toml" --output "$GITHUB_OUTPUT"

  # agentic-job.yml's agent job, agent.yml, with the caller's network
  # step, if any, before secure-host, given what the register job's left
  # it, as a secret. The permissions are the reads of the token the agent
  # gets.
  agent:
    needs: [policy, register]
    # A status function, as without one a skipped carry job above register
    # would skip this one too.
    if: ${{ !cancelled() && needs.register.result == 'success' && needs.policy.outputs.admitted == 'true' }}
    # Only admitted runs enter the group, one a pull request whether an
    # event or a dispatch started them. Only automatic PR events and
    # dispatches, which name a head, supersede a review; a comment must not
    # cancel one.
    concurrency:
      group: review-pull-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/agent.yml # zizmor: ignore[self-repository] Call the base revision's reusable workflow.
    secrets:
      INFERENCE_RUN_TOKEN: ${{ needs.register.outputs.run-token }}
      NETWORK_SECRET: ${{ needs.register.outputs.network-secret }}
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      runner: ${{ vars.AGENT_RUNNER || '"ubuntu-26.04"' }}
      github-reads: true
      network: true
      # With the variable REVIEW_HISTORY, the agent is given this pull
      # request's earlier reviews by this job, as untrusted data, to settle
      # their findings before raising new ones (docs/review.md#review-history).
      review-history: ${{ vars.REVIEW_HISTORY == 'true' && format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || '' }}

  check:
    needs: [policy, agent]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] Call the base revision's reusable workflow.
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  # With the variable AGENT_REAL_REVIEWS, the verdict as the pull request's
  # review, by the Actions identity rather than the PR-opening PAT, in place
  # of apply's comment, so it is posted once (#583). Its body is check's
  # accepted output from check's upload in this run, never text read back
  # from the forge, and `agentic-job review submit` checks it again against
  # the verdict check set. An APPROVE is submitted whatever files change, the review's
  # own included (#540). Inline findings whose lines are in the head's diff
  # are the review's comments, the rest are in its body. When nothing is
  # submitted, apply posts the comment, with every inline finding in it.
  # A 422 refusal submits nothing and posts that comment itself, with why
  # GitHub refused, so the pull request is not left without an explanation.
  # A carried approval is submitted with the binary's own body, saying
  # which head's approval it carries and why; no agent ran.
  submit:
    needs: [policy, carry, agent, check]
    if: >-
      ${{ !cancelled() && vars.AGENT_REAL_REVIEWS == 'true' && needs.policy.outputs.review-head != '' &&
          needs.policy.outputs.binary-artifact-id != '' && (needs.carry.outputs.from != '' ||
          (needs.check.result == 'success' && needs.check.outputs.artifact-id != '' &&
          contains(fromJSON('["APPROVE", "CHANGES"]'), needs.check.outputs.verdict))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The pull request, its files (to place inline comments), comments and
    # reviews are read with `pull-requests`; the artifacts are this run's.
    permissions:
      pull-requests: write
    outputs:
      review-url: ${{ steps.submit.outputs.review-url }}
    steps:
      # The policy job's binary of the pinned source, as check runs it,
      # never the head's. By ID from this file's own jobs: the `if:` above
      # keeps an empty ID from downloading every upload, the agent's
      # unchecked ones included.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.carry.outputs.from == '' }}
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: ${{ runner.temp }}/checked
      - name: Submit the checked verdict as the review
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          AGENT_EXIT: ${{ needs.agent.outputs.exit }}
          AGENT_JOB: ${{ needs.agent.outputs.job }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
          CARRIED_FROM: ${{ needs.carry.outputs.from }}
          CARRIED_WHY: ${{ needs.carry.outputs.why }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          accepted=(--accepted "$RUNNER_TEMP/checked/agent_output.json")
          [ -z "$CARRIED_FROM" ] || accepted=()
          "$RUNNER_TEMP/bin/agentic-job" review submit "${accepted[@]}" --output "$GITHUB_OUTPUT"

  # The one comment on the pull request, unless the verdict was submitted as
  # the review: the only job given a secret, the optional SAFE_OUTPUTS_PAT,
  # else the job token. `actions: read` lets it confirm the checked outputs
  # are check's. Not on cancellation: one landing after a submission but
  # before its output was set would post the verdict twice. A carried
  # approval has no comment: the status, or the submitted review, says why.
  apply:
    needs: [policy, carry, agent, check, submit]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.carry.outputs.from == '' && needs.submit.outputs.review-url == '' }}
    uses: ./.github/workflows/apply.yml # zizmor: ignore[self-repository] Call the base revision's reusable workflow.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}

  # The verdict as a commit status on the pull request's head: success only
  # for a checked APPROVE that was posted, as the review or the comment,
  # failure for CHANGES, a noop or a run that did not get that far. It reads
  # no agent text: `agentic-job review status`, the policy job's binary of
  # the pinned source, takes the verdict check.yml set (one of two words)
  # and the head policy admitted. A run that was cancelled, or superseded in the
  # agent job, leaves the status as it was; on a head no run finished, a
  # required `review` stays expected. A merge group's commit never gets
  # one, so `review` cannot be required while a merge queue is on
  # (docs/review.md).
  #
  # A status belongs to the commit, not the pull request, and the pull
  # request's title and body reach the agent. So anyone could open a
  # second pull request with someone else's head and talk its review into
  # APPROVE. The status is set only when the triggering pull request is the
  # one open pull request at that head. A carried approval is success,
  # once submitted where real reviews are on, and says which head's it was.
  # Not where the record job ran instead: no review ran to report on.
  status:
    needs: [policy, carry, record, agent, check, submit, apply]
    # Not without the binary's ID either, which would download every upload.
    if: ${{ !cancelled() && needs.policy.outputs.review-head != '' && needs.policy.outputs.binary-artifact-id != '' && needs.agent.result != 'cancelled' && needs.record.result == 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: ${{ runner.temp }}/bin
      - name: Report the verdict as the status `review`
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          APPLY_RESULT: ${{ needs.apply.result }}
          RESULT_URL: ${{ needs.apply.outputs.result-url }}
          REVIEW_URL: ${{ needs.submit.outputs.review-url }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
          CARRIED_FROM: ${{ needs.carry.outputs.from }}
          CARRIED_WHY: ${{ needs.carry.outputs.why }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/agentic-job"
          "$RUNNER_TEMP/bin/agentic-job" review status
