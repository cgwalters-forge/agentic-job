# The one job named ci is what the main branch ruleset requires. It only
# follows the always-running aggregate, so a new check is listed in
# required-checks.needs, with no change to the ruleset.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job-level filtering keeps the required ci check present on docs-only runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # look up the merge group's run of a pushed commit
    # Queue detection and path classification run inline with read-only access.
    # With a queue, PRs need no write-capable E2E jobs. Without one, a fork
    # still cannot run those jobs and must not silently bypass the only gate.
    # pull_request and merge_group both run the proposed workflow; a merge
    # group's holds this repository's write-capable job token.
    #
    # GitHub runs at most 20 jobs at once for the account, so each job this
    # workflow need not run shortens every other run's wait. Three gates,
    # each 'true' or 'false': `full` is false only on a push of a commit a
    # merge group already passed; `host` also defers the privileged host
    # jobs from pull requests to the queue, as `e2e` does the end-to-end ones.
    outputs:
      analysis-base: ${{ steps.merge-base.outputs.branch }}
      full: ${{ steps.queued.outputs.passed != 'true' }}
      host: ${{ steps.queued.outputs.passed != 'true' && (github.event_name != 'pull_request' || steps.queue.outputs.enabled != 'true') }}
      e2e: ${{ (github.event_name == 'pull_request' && (steps.queue.outputs.enabled == 'true' || github.event.pull_request.head.repo.full_name != github.repository) || steps.queued.outputs.passed == 'true') && 'false' || steps.paths.outputs.e2e }}
      fork-e2e: ${{ github.event_name == 'pull_request' && steps.queue.outputs.enabled != 'true' && github.event.pull_request.head.repo.full_name != github.repository && steps.paths.outputs.e2e != 'false' }}
      review: ${{ steps.review.outputs.installed }}
    steps:
      - id: merge-base
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.payload.merge_group.head_ref;
            if (!ref.startsWith('refs/heads/')) throw new Error('merge group head is not a branch');
            core.setOutput('branch', ref.slice('refs/heads/'.length));
      # The queue fast-forwards main to the merge group's head, so a push of
      # a queued pull request is a commit this workflow has already passed
      # on, every job included. Only a successful merge_group run of this
      # very commit, built on the commit main was at before the push, counts:
      # its branch, gh-readonly-queue/<base>/pr-<n>-<sha>, ends in that sha.
      # Otherwise the group's path check did not see the whole push, as when
      # one push lands several groups. Any other push, a bypass among them,
      # runs it all. One bounded, read-only query; an API failure fails the gate.
      - id: queued
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const before = context.payload.before;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha,
              event: 'merge_group', status: 'success', per_page: 10,
            });
            core.setOutput('passed', /^[0-9a-f]{40}$/.test(before) && data.workflow_runs.some(run => run.head_sha === context.sha
              && run.event === 'merge_group' && run.conclusion === 'success'
              && run.head_branch.startsWith('gh-readonly-queue/') && run.head_branch.endsWith(`-${before}`)));
      # Effective branch rules include repository and organization rulesets.
      # API failures fail this job; never guess that the queue will test later.
      - id: queue
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rules = await github.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
              ...context.repo, branch: context.payload.pull_request.base.ref,
            });
            core.setOutput('enabled', rules.some(rule => rule.type === 'merge_queue'));
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
        shell: bash
        run: |
          e2e=true
          range="$BASE..$HEAD"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="$BASE...$HEAD"; fi
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]] && git diff --no-ext-diff --no-renames --name-only -z "$range" -- > "$RUNNER_TEMP/changed-paths"; then
            while IFS= read -r -d '' name; do
              if [[ "$name" != README.md && ! "$name" =~ ^docs/([^/$'\r\n']+/)*[^/$'\r\n']+\.md$ ]]; then e2e=true; break; fi
              e2e=false
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
      # Bootstrap only: the first PR adding the review caller has no
      # base-branch task/bounds yet. Read the base commit's files; never
      # substitute its head's to make that run pass. A merge group or push
      # would only show a policy refusal, as e2e-event does with its bounds;
      # tests/event.rs holds review.toml's refusal of those events.
      - id: review
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE^{commit}"
          installed=true
          for file in workflow/review.md workflow/review.toml .github/agentic-job/e2e/review.sh; do
            test "$(git cat-file -t "$BASE:$file" 2> /dev/null)" = blob || installed=false
          done
          echo "installed=$installed" >> "$GITHUB_OUTPUT"

  # Checks of a minute or less share one runner: Markdown, release pin
  # selection, the egress proxy's policy and safe-output validation.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # Before anything else is checked out or written in the workspace:
      # gh-aw's workflows are Markdown, and the digest is of the checkout.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      # Relative links and anchors only: external sites make CI flaky.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "**/*.md"
          failIfEmpty: false
          fail: true
      # Source-addressed release selection and fail-closed verification tests.
      - run: node --test secure-host/binary.test.mjs secure-host/refresh-feed.test.mjs
      # The digest of a checkout is the digest of the same commit as a
      # runner fetches it for an action, an archive without git.
      - name: The checkout and action archive have the same source digest
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/head"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/head"
          archive=$(bash secure-host/binary.sh digest --root "$RUNNER_TEMP/head")
          checkout=$(bash secure-host/binary.sh digest)
          test "$archive" = "$checkout"
      # The egress proxy's policy, with the tests that came with it.
      - run: python3 -m unittest discover -s egress -v
      # As `sandbox setup` installs it: every file by a hash of
      # egress/requirements.txt, and wheels only. Then with the hashes
      # changed, which pip must refuse for that reason and no other.
      - name: The pinned proxy is fetched by hash, and a changed hash is refused
        env:
          PIP: "pip download --quiet --disable-pip-version-check --require-hashes --only-binary :all:"
        run: |
          $PIP --dest "$RUNNER_TEMP/wheels" -r egress/requirements.txt
          sed 's/--hash=sha256:..../--hash=sha256:0000/' egress/requirements.txt > "$RUNNER_TEMP/changed.txt"
          if $PIP --dest "$RUNNER_TEMP/changed" -r "$RUNNER_TEMP/changed.txt" 2> "$RUNNER_TEMP/refusal"; then exit 1; fi
          grep -F 'DO NOT MATCH THE HASHES' "$RUNNER_TEMP/refusal"
      # The proxy as those wheels install it, offline and by the same
      # hashes, with the addon in it: on loopback only, with no network.
      - name: The addon refuses what the allowlist does not name, in a live proxy
        run: |
          python3 -m venv "$RUNNER_TEMP/proxy"
          "$RUNNER_TEMP/proxy/bin/pip" install --quiet --disable-pip-version-check --no-index --require-hashes \
            --only-binary :all: --find-links "$RUNNER_TEMP/wheels" -r egress/requirements.txt
          "$RUNNER_TEMP/proxy/bin/python" -m unittest discover -s egress -p test_live.py -v
      # The forge's shared workflow check, once the WORKFLOW_LINT repository
      # variable names it (Justfile). Before gh-aw's workflows are checked
      # out below, where zizmor would find them. Read-only token, no secret.
      # Its Justfile needs just 1.23 or later, newer than this image's apt
      # package: the version and installer its own action pins, checksummed.
      - name: Install just for the shared workflow check
        if: ${{ vars.WORKFLOW_LINT != '' }}
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - name: Shared workflow check
        if: ${{ vars.WORKFLOW_LINT != '' }}
        env:
          WORKFLOW_LINT: ${{ vars.WORKFLOW_LINT }}
        run: just workflow-lint "$WORKFLOW_LINT"
      # validation.json is generated from gh-aw's compiled workflows, the
      # handlers' limits from their code, and the egress proxy's ecosystem
      # identifiers from its domain data, so a change of the pin has to
      # regenerate them. The commit is the one safe-outputs-probe.yml takes
      # gh-aw's setup action at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: 462ed682857c4ab64d40f2c85e3738fa27834839
          path: gh-aw
          sparse-checkout: |
            .github/workflows
            actions/setup/js
            pkg/workflow/data
          persist-credentials: false
      - run: node safe-outputs/validation.mjs gh-aw --check
      - run: python3 -B egress/ecosystems.py gh-aw --check

  # The runner image's stable toolchain: nothing to download, and the
  # workspace's rust-version says what the code needs.
  rust:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node --test workflow/activation.test.cjs
      - run: node --test workflow/status.test.cjs
      - run: node --test workflow/setup-timing.test.mjs
      - run: node --test workflow/job-timing.test.cjs
      # The same digest-checked analyzers as workflow-ingress.yml, so a PR
      # that changes the checker is tested before merge. Read-only token.
      - name: Install verified static analyzers
        working-directory: ${{ runner.temp }}
        run: |
          curl -fL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          curl -fL --retry 3 https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz -o zizmor.tar.gz
          printf '%s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' 'e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  zizmor.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xzf zizmor.tar.gz zizmor
      # Ingress fixtures are local Git repositories, inspected but never run.
      - run: python3 -m unittest discover -s workflow -p 'test_*.py' -v
        env:
          ZIZMOR: ${{ runner.temp }}/zizmor
          ACTIONLINT: ${{ runner.temp }}/actionlint
      - run: node --test workflow/refusal.test.cjs
      - run: node --test workflow/review.test.cjs
      - run: node --test workflow/real-review.test.cjs
      - run: node --test workflow/push.test.cjs
      - run: node --test workflow/apply-token.test.cjs
      - run: node --test workflow/proposals.test.cjs
      - run: node --test workflow/agent-actions.test.cjs
      # Read-only contract tests; no forge token or agent-produced code.
      - run: node --test workflow/dispatch.test.cjs
      - run: node --test workflow/ci.test.cjs
      # Credentialless cross-repository fix: the pinned real handler writes
      # only local git fixtures, with mock forge reads. No new permissions.
      # apply's tests run gh-aw's pinned sanitizer from the same checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: 462ed682857c4ab64d40f2c85e3738fa27834839
          path: gh-aw
          sparse-checkout: actions/setup/js
          persist-credentials: false
      - run: node --test workflow/fix-handler.test.cjs workflow/apply.test.cjs
        env:
          GH_AW_JS: ${{ github.workspace }}/gh-aw/actions/setup/js

  # Real pinned Vibe, generated configuration and ACP session against a
  # loopback broker. Read-only job token; no model key or privileged setup.
  vibe:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned Vibe
        run: |
          python3 -m venv "$RUNNER_TEMP/vibe"
          "$RUNNER_TEMP/vibe/bin/pip" install --disable-pip-version-check mistral-vibe==2.26.1
      - run: cargo test --locked --test vibe -- --nocapture
        env:
          AGENTIC_JOB_TEST_VIBE_PYTHON: ${{ runner.temp }}/vibe/bin/python3

  # Real pinned Claude Code ACP adapter, driven by the session against a
  # loopback stub of the Messages API: it must offer Read, Edit and Write
  # in the session's working directory. Read-only job token; no model key,
  # no managed settings and no privileged setup.
  claude-acp:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - run: just claude-acp-test

  # The session with its agent as another user, entered with run0 as a
  # real run enters the sandbox: that nothing of that user's is left
  # running takes a second user and root, which the tests of the rust job
  # do without. run0 with --pipe needs systemd 257, newer than
  # ubuntu-24.04's.
  session-sandbox:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      AGENTIC_JOB_TEST_SANDBOX_USER: agentic-job-test
      AGENTIC_JOB_TEST_FAKE_AGENT: /usr/local/bin/fake-agent
      # gh-aw's collector, which the test of `run` puts between a run's
      # hand-back and `check`, as a workflow does.
      GH_AW_JS: ${{ github.workspace }}/gh-aw/actions/setup/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit safe-outputs-probe.yml takes gh-aw's setup action at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: 462ed682857c4ab64d40f2c85e3738fa27834839
          path: gh-aw
          sparse-checkout: actions/setup/js
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --bin fake-agent
      # The runner's home is closed to other users: the agent's program
      # goes where the sandbox user can run it.
      - name: Add the sandbox user and install the fake agent for it
        run: |
          sudo useradd --create-home "$AGENTIC_JOB_TEST_SANDBOX_USER"
          sudo install -m 0755 target/debug/fake-agent "$AGENTIC_JOB_TEST_FAKE_AGENT"
      # All of them, not the one by name: a filter that matches nothing
      # passes. They include a scripted client that talks to the agent
      # over a loopback WebSocket (specs/session.md).
      - run: cargo test --locked --test session
      # `run` itself, with the fake agent as that user: the clone, the
      # run's registration at a mock proxy, the session, the end of the
      # run, the hand-back, and what is left to upload; and from there
      # through gh-aw's collector into `check`.
      - run: cargo test --locked --test run
      # The probes of where the run token is, each failing when what it
      # names is broken.
      - run: cargo test --locked --test probe
      # Shown, not checked: why a file made under `umask 077` as this
      # user came out 0664 on this runner (#20). `run` sets its modes
      # outright either way; this tells a umask that did not hold (a
      # file that was there already keeps its mode, a default ACL
      # replaces the umask) from one that did.
      - name: Show how the sandbox user's new files get their mode
        if: ${{ !cancelled() }}
        run: |
          sudo -n run0 --pipe --user="$AGENTIC_JOB_TEST_SANDBOX_USER" -- sh -c '
            echo "umask of the session: $(umask)"
            umask 077 && rm -f ~/umask-probe && : >~/umask-probe && stat -c "new file under umask 077: %a" ~/umask-probe && rm -f ~/umask-probe
            stat -c "%a %U %n" ~ ~/.config ~/.config/* 2>&1
            findmnt -no FSTYPE,OPTIONS -T ~
            if command -v getfacl >/dev/null; then getfacl -p ~ ~/.config; else echo "no getfacl"; fi
          ' || true

  # The old tree's check and the new one, on the same requests and
  # hand-backs: crates/agentic-job/tests/corpus. The old tree is fetched at
  # the commit docs/plan.md names as the parity target, and gh-aw's
  # collector at the commit the old tree vendored it from; neither is
  # copied here.
  corpus:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      OLD_TREE: ${{ github.workspace }}/old-tree
      GH_AW: ${{ github.workspace }}/gh-aw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/cgwalters-devspace-sandbox
          ref: df1e867bb551ed8e36bd535f6d304a0861f54913
          path: old-tree
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: c227508baacbbe271be6c5a4f303936840b3c813
          path: gh-aw
          sparse-checkout: actions/setup/js
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - run: node --test crates/agentic-job/tests/corpus/corpus.test.mjs
        env:
          AGENTIC_JOB: target/debug/agentic-job
          GH_AW_JS: ${{ env.GH_AW }}/actions/setup/js
      - run: just test-safe-output-handlers
        env:
          AGENTIC_JOB: target/debug/agentic-job
          GH_AW_JS: ${{ env.GH_AW }}/actions/setup/js
      # The network rules, and the egress proxy's files, against the old
      # tree's.
      - run: node --test crates/agentic-job/tests/corpus/nft.test.mjs
        env:
          AGENTIC_JOB: target/debug/agentic-job
      # The old tree's handback.mjs and `run`'s hand-back, on the same
      # checkouts: the same files, but for the commit's message.
      - run: cargo test --locked --test handback

  # What a release would publish, so a dependency that breaks the static
  # build is found on its pull request and not at the next tag.
  static:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] Test this revision's reusable workflow, not a remote revision.

  # The sandbox for real, on a machine that is thrown away: `sandbox
  # setup` with the egress proxy and the network rules, every probe of
  # `sandbox check`, and then each probe again with its protection
  # removed, which must make that probe and no other fail.
  # ubuntu-26.04 has run0 (systemd 256 or later); ubuntu-24.04 does not.
  #
  # Every removal runs every probe, most of a minute each time, and one
  # machine took 27 minutes over them all. So the removals are shared out
  # over several machines, each of which sets the sandbox up for itself:
  # what one removes must not be there for another's probes to find.
  sandbox:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        filesystem-view: [true]
        rust-proxy: [true]
        include:
          # One fresh host without the view, the default, proves the layers
          # the view masks (the world-write policy among them) on their own.
          # Its egress probes run against mitmproxy (egress.rust-proxy =
          # false), the others' against the default Rust proxy, until
          # mitmproxy is removed (#919).
          - shard: baseline
            filesystem-view: false
            rust-proxy: false
    env:
      CONFIG: crates/agentic-job/tests/data/sandbox/ci.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --bins --tests
      # What the probes try must be there to be refused.
      - run: sudo target/debug/agentic-job secure-host apt
      - run: sudo apt-get -o Acquire::Retries=3 update -q
        timeout-minutes: 5
      - run: sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends at cron pkexec podman uidmap python3-venv nftables cargo socat clang
        timeout-minutes: 5
      # Before the world-write policy is loaded: setup refuses that too.
      - name: Setup refuses a machine that is not fresh
        run: cargo test --locked --test sandbox_fresh -- --ignored --nocapture
      # As secure-host does before setup, with the object the release build
      # compiles (binary.sh).
      - name: Load the world-write policy
        run: |
          bash secure-host/binary.sh object --out "$RUNNER_TEMP/world-write"
          sudo target/debug/agentic-job secure-host world-write "$RUNNER_TEMP/world-write/world_write.bpf.o"
      # For whoever has to say why a local-sockets probe failed, and what
      # the runner's user is before setup takes its root away.
      - name: What listens on this runner, and what its user is
        run: |
          systemctl list-sockets --no-pager --full
          sudo ss -xlnpH
          sudo ss -tlnpH
          id; sudo -n -l; sudo ls -la /etc/sudoers.d; cat /proc/self/cgroup; cat /sys/kernel/security/lsm; echo
          # pgrep cannot match on the cgroup column.
          # shellcheck disable=SC2009
          ps -eo pid,user,comm,cgroup --no-headers | grep -F "$(cut -d: -f3 /proc/self/cgroup)" || true
      # Setup takes root away from the runner's user, which the test below
      # runs as, and the test puts each protection back as root: a shell
      # behind a socket only this user's group may connect to, started as
      # a service of its own before setup. It is this test's and nothing
      # a job should have (docs/sandbox-check.md says what it stands for).
      - name: Start the root service the test puts protections back through
        run: |
          sudo systemd-run --unit=agentic-job-test-root --quiet \
            socat "UNIX-LISTEN:/run/agentic-job-test-root.sock,fork,unlink-early,mode=0660,user=root,group=$(id -gn)" EXEC:/bin/sh,stderr
          for _ in 1 2 3 4 5; do test -S /run/agentic-job-test-root.sock && break; sleep 1; done
          test "$(printf 'id -u; exit\n' | socat -t 5 - UNIX-CONNECT:/run/agentic-job-test-root.sock)" = 0
      # Setup only warns when the threat feed cannot be fetched, and a pin
      # that names a commit no longer served would have every run warn:
      # here the feed has to load.
      - name: Setup timing (filesystem view = ${{ matrix.filesystem-view }}, Rust proxy = ${{ matrix.rust-proxy }})
        shell: bash
        env:
          FILESYSTEM_VIEW: ${{ matrix.filesystem-view }}
          RUST_PROXY: ${{ matrix.rust-proxy }}
        run: |
          target/debug/agentic-job config --host --from "$CONFIG" --boolean "sandbox.filesystem-view=$FILESYSTEM_VIEW" --boolean "egress.rust-proxy=$RUST_PROXY" > "$RUNNER_TEMP/sandbox-ci.toml"
          sudo target/debug/agentic-job sandbox setup --config "$RUNNER_TEMP/sandbox-ci.toml" 2>&1 | tee "$RUNNER_TEMP/sandbox-setup.log"
          grep -F 'Threat feed:' "$RUNNER_TEMP/sandbox-setup.log"
          if [ "$RUST_PROXY" = true ]; then grep -F 'Egress proxy (Rust)' "$RUNNER_TEMP/sandbox-setup.log"; else grep -F 'Egress proxy (mitmproxy)' "$RUNNER_TEMP/sandbox-setup.log"; fi
          node workflow/setup-timing.mjs "$RUNNER_TEMP/sandbox-setup.log" "$FILESYSTEM_VIEW"
      # From here on this job's user has no sudo: root is the test's
      # service, or the helper.
      - name: "The runner's user has no root after setup"
        run: |
          if sudo -n true; then echo "::error::the runner's user still has sudo"; exit 1; fi
          sudo -n -l
      - name: The setup script ran as the sandbox user
        run: test "$(printf 'cat /home/runner-sandbox/toolchain-installed-by; exit\n' | socat -t 5 - UNIX-CONNECT:/run/agentic-job-test-root.sock)" = runner-sandbox
      - run: target/debug/agentic-job sandbox check
      # Stand-ins for the variables of a job that may ask for an identity
      # token: the probes look for their values where they must not be.
      - name: Each probe fails when its protection is removed
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: https://oidc.invalid/stand-in
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: stand-in-request-token-0123456789abcdef
          # Four view shards; baseline runs the layered cases without the view.
          AGENTIC_JOB_TEST_SHARD: ${{ matrix.shard == 'baseline' && '0/1' || format('{0}/4', matrix.shard) }}
        run: cargo test --locked --test sandbox_host -- --ignored --nocapture

  # The step that secures a host, in a job that runs no agent: the
  # example a caller copies, which builds and tests after the lock, as
  # the runner's user and as the sandbox user, and proves both.
  secure-host:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    uses: ./.github/workflows/example-secure-host.yml # zizmor: ignore[self-repository] Test this revision's reusable workflow, not a remote revision.

  # The same step with its switches the other way: root kept, no egress
  # proxy, another name for the sandbox user. What the lock takes is
  # still there, and the sandbox user is closed in all the same.
  secure-host-options:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: host
        uses: ./secure-host # zizmor: ignore[self-repository] Exercise the checked-out action under test.
        with:
          lock: false
          egress: false
          sandbox-user: builder
      - name: The switches did what they say
        env:
          SANDBOX_USER: ${{ steps.host.outputs.sandbox-user }}
          SANDBOX_HOME: ${{ steps.host.outputs.sandbox-home }}
        run: |
          sudo -n true
          test "$SANDBOX_USER" = builder
          agentic-job sandbox exec -- pwd > "$RUNNER_TEMP/sandbox-pwd.txt"
          read -r actual < "$RUNNER_TEMP/sandbox-pwd.txt"
          test "$actual" = "$SANDBOX_HOME"
          # Expanded by the sandbox's shell, not this one.
          # shellcheck disable=SC2016
          agentic-job sandbox exec -- sh -c 'echo "${HTTPS_PROXY:-none}"' > "$RUNNER_TEMP/sandbox-proxy.txt"
          read -r actual < "$RUNNER_TEMP/sandbox-proxy.txt"
          test "$actual" = none
          if systemctl is-active --quiet docker.service; then echo "::error::docker was not stopped"; exit 1; fi

  # The action as another repository names it, which a pull request
  # cannot do for its own commit: after a push to main, from main. The
  # runner fetches it as an archive without git, and the binary it gets
  # is a release's when one is pinned for this source.
  secure-host-published:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: host
        uses: cgwalters-forge/agentic-job/secure-host@main # zizmor: ignore[unpinned-uses] Deliberately test the public main-branch action in this fresh-runner integration job.
      - name: A pinned release of this source was fetched, and nothing was built
        env:
          FETCHED: ${{ steps.host.outputs.fetched }}
        run: |
          echo "fetched: $FETCHED"
          test "$FETCHED" = true || echo "::notice::the prebuilt release is not published yet; the action built from source"
          if sudo -n true; then echo "::error::the runner's user still has sudo"; exit 1; fi

  # The reusable workflow, called as another repository would call it,
  # with the scripted agent: all four jobs, on four machines. The agent
  # clones this repository's main branch and asks for a comment, and the
  # apply job applies it here with the job's own token. `e2e-verify` then
  # looks at what was made.
  #
  # None asks for a pull request: apply opens one only from a fork of the
  # account its SAFE_OUTPUTS_PAT belongs to, policy refuses it to the job
  # token, and CI holds no PAT. apply.test.cjs runs the fork, the handlers'
  # configuration and the guard against a stand-in for the forge.
  #
  # Nothing is opened in the tracker for a run. The comments go to issue
  # 64, which exists for them and stays closed (`with:` takes no `env`,
  # so its number is written out three times below), and `e2e-verify`
  # deletes them again.
  #
  # Never forward a deployment PAT to proposed workflow code. These callers
  # exercise apply's job-token fallback under their declared permissions.
  # Same noop producer/call as docs/workflow.md; no checkout or producer token.
  proposals:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: mkdir proposals && printf '%s\n' '{"type":"noop","message":"No proposals today."}' > proposals/outputs.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board-proposals
          path: proposals/outputs.jsonl
          if-no-files-found: error

  e2e-proposals:
    needs: [changes, proposals]
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write # apply may post the allowed comments
      pull-requests: read # the agent job's GitHub reads
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write # GitHub validates the skipped agent job's permission too
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: board
      repo: ${{ github.repository }}
      allow: .github/agentic-job/allow.toml
      outputs: add_comment,noop
      max-outputs: '2'
      proposals-artifact: board-proposals
      artifact-prefix: proposals-

  e2e-full:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write # add_comment
      pull-requests: write # the status comment and reaction on the pull request e2e-event is for
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write # the agent job asks for it, for a proxy this run has none of
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-full-${{ github.run_id }}
      task: Comment on the issue.
      repo: ${{ github.repository }}
      outputs: add_comment,noop
      allow: .github/agentic-job/allow.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/full.sh
      timeout: "5"
      max-requests: "0"
      budget: "100"
      comment-target: "64"
      artifact-prefix: full-

  # The same, with an agent that starts more subagent tasks than it may:
  # the session has it hand back and stops it, `run` ends with the exit
  # state of a limit, and its comment is applied saying it is partial.
  e2e-limit:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write # add_comment
      pull-requests: write # the status comment and reaction on the pull request e2e-event is for
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write # the agent job asks for it, for a proxy this run has none of
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-limit-${{ github.run_id }}
      task: Start a comment and then too many subagent tasks.
      repo: ${{ github.repository }}
      outputs: add_comment,noop
      allow: .github/agentic-job/allow.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/limit.sh
      comment-target: "64"
      timeout: "10"
      max-requests: "0"
      max-tasks: "2"
      budget: "100"
      apply-partial: true
      artifact-prefix: limit-
      # So that both ways to the binary run here once a release is pinned.
      build-binary: true

  # The event-triggered path, through the workflow itself and on the
  # event that started this run. On a pull request the policy job admits
  # it (its author holds the write role and its head is this
  # repository's), the run starts from the pull request's base, the
  # agent's comment goes to the pull request, and a status comment there
  # says the run started and how it ended. On a merge group or push the
  # bounds list no such event: the run ends in the policy job, a success
  # with the other jobs skipped. e2e-verify checks both.
  e2e-event:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write # add_comment
      pull-requests: write # the status comment and reaction on the pull request e2e-event is for
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write # the agent job asks for it, for a proxy this run has none of
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-event-${{ github.run_id }}
      notify: comment
      event: true
      # A base the bounds would refuse, so that e2e-verify's check of the
      # run's base proves the event's pull request chose it. On a push the
      # event is refused before the bounds see a base.
      base: ${{ github.event_name == 'pull_request' && 'not-a-branch' || 'main' }}
      task: Comment on the pull request this run was started by.
      repo: ${{ github.repository }}
      outputs: add_comment,noop
      allow: .github/agentic-job/allow.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/event.sh
      timeout: "5"
      max-requests: "0"
      budget: "100"
      artifact-prefix: event-

  # An analysis of the topic branch comments on the named scratch issue and
  # updates a section of its body; the bounds admit body updates only, but
  # to any issue of this repository (workflow/analysis.toml).
  # No contents write permission: apply must not checkout/fetch/push a base.
  e2e-analysis:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read # the agent job's GitHub reads
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-analysis-${{ github.run_id }}
      # Test this checkout, not a published release that may lack fake-agent.
      build-binary: true
      repo: ${{ github.repository }}
      base: ${{ github.head_ref || needs.changes.outputs.analysis-base || 'main' }}
      kind: analysis
      task: Analyze the checked out topic branch, comment on the named scratch issue and update its body.
      outputs: add_comment,update_issue
      max-outputs: '2'
      comment-target: '64'
      notify: none
      allow: workflow/analysis.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/analysis.sh
      timeout: '5'
      max-requests: '0'
      budget: '100'
      artifact-prefix: analysis-

  # Same read-only analysis, but hostile output names another item. Check
  # must be refused before the job holding the issue-write token applies anything.
  e2e-analysis-refused:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read # the agent job's GitHub reads
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-analysis-refused-${{ github.run_id }}
      build-binary: true
      expect-check-refusal: true
      repo: ${{ github.repository }}
      base: ${{ github.head_ref || needs.changes.outputs.analysis-base || 'main' }}
      kind: analysis
      task: "Try to comment outside the caller's fixed destination."
      outputs: add_comment
      max-outputs: '1'
      comment-target: '64'
      notify: none
      allow: workflow/analysis.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/misdirected.sh
      timeout: '5'
      max-requests: '0'
      budget: '100'
      artifact-prefix: analysis-refused-

  # A write-capable fixture job, never the agent's token. Each run owns its
  # branch and PR; cleanup must not close another merge-group run's fixture.
  # Like e2e-verify it checks nothing out: a merge group's proposed code
  # must not run beside a token that can write refs.
  e2e-scratch:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # create only this run's scratch branch
      pull-requests: write # create this run's scratch PR
    outputs:
      pr: ${{ steps.scratch.outputs.pr }}
      branch: ${{ steps.scratch.outputs.branch }}
      login: ${{ steps.scratch.outputs.login }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: e2e-scratch/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - id: scratch
        name: Open the scratch pull request of this run
        run: |
          set -o pipefail
          root="repos/$GH_REPO"
          base=$(gh api "$root" --jq .default_branch)
          # The login is the default branch's people bounds, never caller
          # input or a proposed file: both outputs allow the same one account.
          allowed=$(gh api "$root/contents/.github/agentic-job/people.toml?ref=$base" --jq .content | base64 -d |
            grep -oP 'allowed\s*=\s*\["\K[\w-]+(?="\])')
          test "$(wc -l <<< "$allowed")" = 2
          login=$(sort -u <<< "$allowed")
          [[ $login =~ ^[A-Za-z0-9-]+$ ]]
          # The agent reads its branch and login from this file on its base.
          parent=$(gh api "$root/git/ref/heads/$base" --jq .object.sha)
          tree=$(gh api "$root/git/commits/$parent" --jq .tree.sha)
          fixture=$(jq -nc --arg repo "$GH_REPO" --arg branch "$BRANCH" --arg login "$login" '{$repo, $branch, $login}')
          tree=$(jq -n --arg base "$tree" --arg content "$fixture" \
            '{base_tree: $base, tree: [{path: "e2e-people.json", mode: "100644", type: "blob", content: $content}]}' |
            gh api "$root/git/trees" --input - --jq .sha)
          head=$(jq -n --arg message "CI scratch fixture $BRANCH" --arg tree "$tree" --arg parent "$parent" \
            '{$message, $tree, parents: [$parent]}' | gh api "$root/git/commits" --input - --jq .sha)
          gh api "$root/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$head" > /dev/null
          # Never sweep old scratch PRs: another merge-group run may still be
          # using one. A ready PR, so that it can take a review request; if it
          # cannot be opened, roll back only the branch just created.
          if ! pr=$(gh api "$root/pulls" -f "title=CI scratch fixture $BRANCH" -f "head=$BRANCH" -f "base=$base" \
            -f 'body=Run-owned fixture; closed by the run that opened it.' --jq .number); then
            gh api -X DELETE "$root/git/refs/heads/$BRANCH"
            exit 1
          fi
          printf 'pr=%s\nbranch=%s\nlogin=%s\n' "$pr" "$BRANCH" "$login" >> "$GITHUB_OUTPUT"

  # Both people outputs target the run-owned PR, not the shared scratch issue.
  e2e-people:
    needs: [changes, e2e-scratch]
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write # assign_to_user
      pull-requests: write # add_reviewer
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write # the agent job asks for it, for a proxy this run has none of
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-people-${{ github.run_id }}
      build-binary: true
      repo: ${{ github.repository }}
      base: ${{ needs.e2e-scratch.outputs.branch }}
      kind: analysis
      task: Assign the listed user and request their review on the scratch pull request of this run.
      outputs: add_reviewer,assign_to_user
      max-outputs: '2'
      notify: none
      allow: .github/agentic-job/people.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/people.sh
      timeout: '5'
      max-requests: '0'
      budget: '100'
      artifact-prefix: people-

  # A check run on the head of the pull request this run is for (or the
  # merge group's), the scratch place for one. The bounds pin its name,
  # which no required check has; the agent asks for `neutral`, as check
  # refuses `success`. Apply posts it with the job token: a user's token
  # cannot create check runs. A push has no pull request to post on.
  e2e-check-run:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' && github.event_name != 'push' }}
    permissions:
      contents: read
      issues: read # the agent job's GitHub reads
      pull-requests: read # the agent job's GitHub reads
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      checks: write # create_check_run
      id-token: write
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-check-run-${{ github.run_id }}
      build-binary: true
      repo: ${{ github.repository }}
      base: ${{ github.head_ref || needs.changes.outputs.analysis-base }}
      kind: analysis
      task: Post a neutral check run on the head of the pull request this run is for.
      outputs: create_check_run
      max-outputs: '1'
      notify: none
      allow: .github/agentic-job/check-run.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/check-run.sh
      timeout: '5'
      max-requests: '0'
      budget: '100'
      artifact-prefix: check-run-

  # Exercise the shipped caller, not a separately maintained imitation.
  # Not implement: it opens a pull request only with an apply environment's
  # PAT, which CI does not hold. Not triage: it takes the same path as
  # research, with other profile text.
  e2e-dispatch:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["research","review"]' || '["research"]') }}
    permissions:
      contents: read # what dispatch.yml asks for: no profile pushes with the job token
      issues: write
      pull-requests: write
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write
    uses: ./.github/workflows/dispatch.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      task: Exercise the shipped scripted dispatch caller; no model is needed.
      scripted: true
      repo: ${{ github.repository }}
      item: ${{ matrix.profile == 'review' && format('{0}', github.event.pull_request.number) || '64' }}
      kind: ${{ matrix.profile }}

  # The composed example: a caller-owned agent job with a privileged step
  # before secure-host and a later one without sudo. e2e-dispatch's
  # verifier counts this job's comment too.
  e2e-compose:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read # the agent job's GitHub reads
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write
    uses: ./.github/workflows/example-compose.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      task: Exercise the composed example caller; no model is needed.
      scripted: true
      item: '64'

  # Pull requests only (see the review step of changes).
  e2e-review:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' && needs.changes.outputs.review == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      issues: read # the agent job's GitHub reads
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-review-${{ github.run_id }}
      repo: ${{ github.repository }}
      event: true
      review: true
      review-task: workflow/review.md
      task: ''
      kind: analysis
      outputs: add_comment,noop
      max-outputs: '1'
      notify: none
      allow: workflow/review.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/review.sh
      timeout: '5'
      max-requests: '0'
      budget: '100'
      artifact-prefix: review-

  # Scratch items for e2e-items: a sub-issue to link under the scratch
  # issue, a draft pull request to close, and a comment on the scratch
  # issue to hide, from a branch of this run whose one commit names the
  # sub-issue and the comment and is e2e-items' base.
  # Pull requests and issues the job token opens start no workflow.
  # e2e-verify closes and removes the first three, and deletes the comment
  # with this run's others on the scratch issue. Not e2e-scratch's pull
  # request: e2e-people needs that one open while e2e-items closes this.
  e2e-items-scratch:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # the scratch branch
      issues: write # the scratch sub-issue
      pull-requests: write # the scratch pull request
    outputs:
      branch: ${{ steps.open.outputs.branch }}
      pull-request: ${{ steps.open.outputs.pull-request }}
      sub-issue: ${{ steps.open.outputs.sub-issue }}
      comment: ${{ steps.open.outputs.comment }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: e2e-items/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Open the scratch sub-issue and pull request
        id: open
        run: |
          set -o pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          sub=$(gh api "repos/$GH_REPO/issues" -f title="Scratch sub-issue of end-to-end run $GITHUB_RUN_ID" -f body='Linked and closed by the run that opened it.' --jq .number)
          echo "sub-issue=$sub" >> "$GITHUB_OUTPUT"
          comment=$(gh api "repos/$GH_REPO/issues/64/comments" -f body="Scratch comment of end-to-end run actions/runs/$GITHUB_RUN_ID, hidden by it." --jq .node_id)
          echo "comment=$comment" >> "$GITHUB_OUTPUT"
          main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          base=$(gh api "repos/$GH_REPO/git/commits/$main" --jq .tree.sha)
          # The forge opens no pull request without a change, so add a file;
          # the data API writes it without a checkout.
          tree=$(jq -n --arg base "$base" --arg content "Scratch file of end-to-end run $GITHUB_RUN_ID." \
            '{base_tree: $base, tree: [{path: "e2e-scratch.txt", mode: "100644", type: "blob", content: $content}]}' |
            gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)
          commit=$(gh api "repos/$GH_REPO/git/commits" -f message="$(printf 'e2e scratch: link #%s under #64\n\nhide %s' "$sub" "$comment")" -f tree="$tree" -f "parents[]=$main" --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" > /dev/null
          pr=$(gh api "repos/$GH_REPO/pulls" -f title="Scratch pull request of end-to-end run $GITHUB_RUN_ID" -f head="$BRANCH" -f base=main -F draft=true -f body='Closed by the run that opened it.' --jq .number)
          echo "pull-request=$pr" >> "$GITHUB_OUTPUT"

  # close_pull_request, link_sub_issue and hide_comment with the job token,
  # on the items e2e-items-scratch opened; the agent finds them from its
  # base. The scratch issue is the run's item, which a hidden comment is on.
  e2e-items:
    needs: [changes, e2e-items-scratch]
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
      issues: write # link_sub_issue, hide_comment
      pull-requests: write # close_pull_request, and its comment
      actions: read # the agent job's GitHub reads, and apply's look-up of check's upload
      id-token: write # the agent job asks for it, for a proxy this run has none of
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Exercise the reusable workflow under test.
    with:
      id: e2e-items-${{ github.run_id }}
      build-binary: true
      repo: ${{ github.repository }}
      base: ${{ needs.e2e-items-scratch.outputs.branch }}
      kind: analysis
      task: Close the scratch pull request, link the scratch sub-issue and hide the scratch comment.
      outputs: close_pull_request,link_sub_issue,hide_comment
      max-outputs: '3'
      comment-target: '64'
      allow: .github/agentic-job/items.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/e2e/items.sh
      timeout: '5'
      max-requests: '0'
      budget: '100'
      artifact-prefix: items-

  # Proposed verifier code may read dispatch results, and the full run's
  # apply guard the forge, but never gets cleanup's write token. Cleanup
  # waits for this job even when verification fails.
  e2e-dispatch-verify:
    if: ${{ always() && needs.changes.outputs.e2e == 'true' }}
    needs: [changes, e2e-dispatch, e2e-compose, e2e-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read # read hosted job durations; no write or cleanup authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the shipped dispatch profiles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.e2e-dispatch.result }}
          COMPOSE_RESULT: ${{ needs.e2e-compose.result }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ needs.e2e-dispatch.outputs.review-head }}
        run: node workflow/dispatch-verify.cjs
      - name: Bound the hosted end-to-end agent job
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # A read: retry a transient 5xx rather than fail ci on it.
          retries: 3
          script: |
            const { checkJobDuration } = require('./workflow/job-timing.cjs');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, filter: 'all', per_page: 100,
            });
            const full = jobs.filter(job => job.name === 'e2e-full / agent')
              .sort((a, b) => b.run_attempt - a.run_attempt);
            if (!full.length) throw new Error('missing hosted end-to-end agent job');
            const seconds = checkJobDuration(full[0], 900);
            await core.summary.addRaw(`Hosted end-to-end agent job: ${seconds}s (bound 900s).\n`).write();
      # A re-run of the full run's apply job, as far as the forge is
      # concerned: its guard, from the workflow under test, given the
      # outputs check accepted, leaves out the comment the first attempt
      # posted, and the comment is there once. The handlers that would post again are not run here; that
      # they post only what the guard keeps is apply.test.cjs's to show.
      # Where apply has gh-aw's scripts: the guard names the branch with them.
      - uses: github/gh-aw/actions/setup@462ed682857c4ab64d40f2c85e3738fa27834839 # v0.91.12-7
        if: ${{ always() && needs.e2e-full.result == 'success' }}
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.e2e-full.result == 'success' }}
        with:
          artifact-ids: ${{ needs.e2e-full.outputs.applied-artifact-id }}
          path: ${{ runner.temp }}/full
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.e2e-full.result == 'success' }}
        with:
          name: full-checked-outputs
          path: ${{ runner.temp }}/rerun
      - name: "Run the full run's apply guard again"
        if: ${{ always() && needs.e2e-full.result == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TMP: ${{ runner.temp }}/rerun
          REPORT: ${{ runner.temp }}/rerun/report.json
          # e2e-full passes no SAFE_OUTPUTS_PAT: its apply posted with the job token.
          TOKEN_IS_PAT: 'false'
          OUTPUT_REPO: ${{ github.repository }}
          ITEM_REPO: ${{ github.repository }}
          COMMENT_TARGET: "64"
          # e2e-full's, which its name is digested with.
          ARTIFACT_PREFIX: full-
        with:
          script: |
            const workflow = require('node:fs').readFileSync('.github/workflows/apply.yml', 'utf8');
            const section = workflow.split('- name: Leave out what an earlier attempt applied\n')[1].split(/\n      - /)[0];
            const guard = section.split('script: |\n')[1].split('\n')
              .filter(line => line.startsWith(' '.repeat(12))).map(line => line.slice(12)).join('\n');
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
            await new AsyncFunction('require', 'process', 'core', 'github', guard)(require, process, core, github);
      - name: The re-run left out what was applied, and the comment is there once
        if: ${{ always() && needs.e2e-full.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          jq -e '.already_applied == []' "$RUNNER_TEMP/full/applied.json"
          jq -e 'map(.type) == ["add_comment"]' "$RUNNER_TEMP/rerun/skipped.json"
          jq -e '[.items[] | select(.type == "add_comment")] == []' "$RUNNER_TEMP/rerun/agent_output.json"
          name=$(jq -r '.[] | select(.type == "add_comment").name' "$RUNNER_TEMP/rerun/skipped.json")
          gh api --paginate "repos/$GH_REPO/issues/64/comments" | jq -se --arg marker "<!-- $name -->" '[ .[][] | select(.body | contains($marker)) ] | length == 1'

  e2e-verify:
    if: ${{ always() && needs.changes.outputs.e2e == 'true' }}
    needs: [changes, e2e-scratch, e2e-full, e2e-limit, e2e-event, e2e-analysis, e2e-analysis-refused, e2e-people, e2e-items-scratch, e2e-items, e2e-check-run, e2e-review, e2e-dispatch, e2e-compose, e2e-dispatch-verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # delete only this run's scratch branches
      issues: write # delete this run's comments, and unlink and close its scratch sub-issue
      pull-requests: write # delete this run's comments and close its scratch PRs
      actions: read # download this run's applied artifacts
      checks: read # the e2e check run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PEOPLE_PR: ${{ needs.e2e-scratch.outputs.pr }}
      PEOPLE_BRANCH: ${{ needs.e2e-scratch.outputs.branch }}
      PEOPLE_LOGIN: ${{ needs.e2e-scratch.outputs.login }}
      ISSUE: "64"
      # What gh-aw's handlers end each comment of this run with.
      RUN: actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.e2e-full.outputs.applied-artifact-id }}
          path: ${{ runner.temp }}/full
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.e2e-limit.outputs.applied-artifact-id }}
          path: ${{ runner.temp }}/limit
      - name: Both runs ended well, the second at a limit
        env:
          RESULTS: ${{ needs.e2e-full.result }} ${{ needs.e2e-limit.result }}
          EXITS: ${{ needs.e2e-full.outputs.exit }} ${{ needs.e2e-limit.outputs.exit }}
        run: test "$RESULTS / $EXITS" = "success success / 0 3"
      # On a pull request the event is admitted, the run starts from the
      # pull request's base branch and goes to the end; on a merge group or
      # push the bounds list no such event, and the run ends in the policy
      # job with its reason, a success with the rest skipped.
      - name: The event-triggered run was admitted on a pull request, and refused otherwise
        env:
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.e2e-event.result }}
          TRIGGER: ${{ needs.e2e-event.outputs.trigger }}
          REASON: ${{ needs.e2e-event.outputs.trigger-reason }}
          EXIT: ${{ needs.e2e-event.outputs.exit }}
          BASE: ${{ needs.e2e-event.outputs.base }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "$EVENT: $RESULT, $TRIGGER ($REASON), exit state ${EXIT:-none}, base ${BASE:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$EVENT" in
            pull_request) test "$RESULT/$TRIGGER/$EXIT/$BASE" = "success/admitted/0/$BASE_REF" ;;
            *) test "$RESULT/$TRIGGER/$EXIT" = success/refused/ && grep -F "do not let a $EVENT event" <<< "$REASON" ;;
          esac
      # The agent's comment went to the pull request this run is for,
      # under the status comment the notify job posted and the conclude
      # job edited, and the eyes reaction is on the pull request.
      - name: The review path was admitted on a pull request, without using head policy files
        env:
          INSTALLED: ${{ needs.changes.outputs.review }}
          RESULT: ${{ needs.e2e-review.result }}
          TRIGGER: ${{ needs.e2e-review.outputs.trigger }}
          EXIT: ${{ needs.e2e-review.outputs.exit }}
        run: |
          if [ "$INSTALLED" != true ]; then test "$RESULT" = skipped; echo 'Review E2E runs on pull requests whose base has its files.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          test "$RESULT/$TRIGGER/$EXIT" = success/admitted/0
      - name: Exactly one scripted verdict was posted on the triggering pull request
        if: ${{ needs.changes.outputs.review == 'true' }}
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/$GH_REPO/issues/$PR/comments" --jq '.[] | .body' > "$RUNNER_TEMP/review-comments"
          grep -F 'VERDICT: APPROVE' "$RUNNER_TEMP/review-comments"
          gh api --paginate "repos/$GH_REPO/issues/$PR/comments" | jq -se --arg run "$RUN" --arg sha "$HEAD_SHA" '[ .[][] | select((.body | startswith("VERDICT: APPROVE\nREASON: Scripted review")) and (.body | contains($run)) and (.body | contains("Reviewed SHA: " + $sha + "\n"))) ] | length == 1'
      - name: The event-triggered run commented on the pull request, and said how it ended
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GH_REPO/issues/$PR/comments" --jq ".[] | select(.body | contains(\"$RUN\")).body" | tee "$RUNNER_TEMP/pr-comments"
          grep -F 'A comment from the scripted agent of an event-triggered run.' "$RUNNER_TEMP/pr-comments"
          grep -F '✅ [ci](' "$RUNNER_TEMP/pr-comments" | grep -F 'ended well'
          gh api "repos/$GH_REPO/issues/$PR/reactions" --jq '[.[] | select(.content == "eyes" and .user.login == "github-actions[bot]")] | length' | grep -vqx 0
      # The configuration has the handlers of the outputs asked for and no
      # others: none that could push.
      - name: The handlers are those of the outputs asked for
        run: |
          jq -e '.partial == false and .fork == null and .pull_request == null and (.handlers | keys) == ["add_comment", "noop"] and (.handlers.add_comment | keys) == ["max", "target", "target-repo"]' "$RUNNER_TEMP/full/applied.json"
      # The comments of this run among those of the runs beside it.
      - name: The topic-branch analysis posted one comment on the named issue
        env:
          RESULT: ${{ needs.e2e-analysis.result }}
          REFUSED: ${{ needs.e2e-analysis-refused.result }}
          REFUSED_EXIT: ${{ needs.e2e-analysis-refused.outputs.exit }}
          REFUSAL: ${{ needs.e2e-analysis-refused.outputs.check-refusal }}
          REFUSED_APPLIED: ${{ needs.e2e-analysis-refused.outputs.applied-artifact-id }}
        run: |
          test "$RESULT" = success
          test "$REFUSED" = success
          grep -F "an add\_comment with item\_number outside the caller's fixed item" <<< "$REFUSAL"
          test "$REFUSED_EXIT" = 0
          test -z "$REFUSED_APPLIED"
          gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments" | jq -se --arg run "$RUN" '[ .[][] | select(.user.login == "github-actions[bot]" and (.body | contains($run)) and (.body | contains("A comment from the scripted agent of an event-triggered run."))) ] | length == 1'
      # Its apply succeeded only if the update did. Another run's analysis
      # may have replaced the section since, so the run is not looked for.
      - name: "The topic-branch analysis updated the scratch issue's body"
        run: gh api "repos/$GH_REPO/issues/$ISSUE" --jq .body | grep -F 'A body section from the scripted agent of a topic-branch analysis.'
      - name: The refused comment was not posted on either item
        run: |
          for item in "$ISSUE" 65; do
            gh api --paginate "repos/$GH_REPO/issues/$item/comments" | jq -se --arg run "$RUN" 'any(.[][]; ((.body | contains($run)) and (.body | contains("This misdirected analysis must be refused.")))) | not'
          done
      - name: The listed user was assigned and asked to review the scratch pull request of this run
        env:
          RESULT: ${{ needs.e2e-people.result }}
          PEOPLE: ${{ needs.e2e-people.outputs.applied-artifact-id }}
          # One line: ingress's ignore check refuses quotes spanning lines.
          FILTER: .head.ref == $branch and .head.repo.full_name == $repo and .state == "open" and any(.assignees[]; .login == $login) and any(.requested_reviewers[]; .login == $login)
        run: |
          test "$RESULT" = success
          test -n "$PEOPLE"
          [[ $PEOPLE_PR =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/pulls/$PEOPLE_PR" |
            jq -e --arg repo "$GH_REPO" --arg branch "$PEOPLE_BRANCH" --arg login "$PEOPLE_LOGIN" "$FILTER"
      - name: The comments are on the scratch issue, and the run stopped at a limit says so
        env:
          NOTE: "**Partial work.** The run was stopped at a request, task or spending limit"
        run: |
          gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments" --jq ".[] | select(.body | contains(\"$RUN\")).body" > "$RUNNER_TEMP/comments"
          grep -F 'A comment from the scripted agent of an end-to-end run.' "$RUNNER_TEMP/comments"
          grep -F -A2 "$NOTE" "$RUNNER_TEMP/comments" | grep -F 'A comment from the scripted agent of a run that is stopped.'
      - name: The run stopped at a limit was applied as partial
        run: jq -e '.partial and (.handlers | keys) == ["add_comment", "noop"]' "$RUNNER_TEMP/limit/applied.json"
      # Check runs cannot be deleted; one of this attempt's, by the pinned
      # name, is neutral on the pull request's head.
      - name: The check run is neutral on the head of the pull request
        if: ${{ github.event_name != 'push' }}
        env:
          RESULT: ${{ needs.e2e-check-run.result }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_BRANCH: ${{ needs.changes.outputs.analysis-base }}
          NAME: agentic-job e2e check run
        run: |
          set -o pipefail
          test "$RESULT" = success
          pr=${PR:-$(sed -n 's#^gh-readonly-queue/.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$#\1#p' <<< "$QUEUE_BRANCH")}
          head=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)
          started=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at)
          gh api -X GET "repos/$GH_REPO/commits/$head/check-runs" -f check_name="$NAME" |
            jq -e --arg started "$started" '[.check_runs[] | select(.conclusion == "neutral" and .completed_at >= $started)] | length == 1'
      # gh-aw's handlers end what they open with a link to the run.
      - name: The runs opened no issue
        run: |
          gh api "repos/$GH_REPO/issues?state=all&sort=created&direction=desc&per_page=50" \
            --jq "[.[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and ((.body // \"\") | contains(\"$RUN\"))).html_url]" | tee /dev/stderr | jq -e '. == []'
      - name: The scratch pull request was closed with its comment, the sub-issue linked and the comment hidden
        env:
          RESULT: ${{ needs.e2e-items.result }}
          PR: ${{ needs.e2e-items-scratch.outputs.pull-request }}
          SUB: ${{ needs.e2e-items-scratch.outputs.sub-issue }}
          COMMENT: ${{ needs.e2e-items-scratch.outputs.comment }}
        run: |
          set -o pipefail
          test "$RESULT" = success
          test "$(gh api "repos/$GH_REPO/pulls/$PR" --jq .state)" = closed
          gh api --paginate "repos/$GH_REPO/issues/$PR/comments" | jq -se --arg run "$RUN" '[ .[][] | select(.user.login == "github-actions[bot]" and (.body | contains($run)) and (.body | startswith("Closed by the scripted agent of an end-to-end run."))) ] | length == 1'
          gh api graphql -F number="$SUB" -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { issue(number: $number) { parent { number } } } }' --jq .data.repository.issue.parent.number | grep -qx "$ISSUE"
          gh api graphql -f id="$COMMENT" -f query='query($id: ID!) { node(id: $id) { ... on IssueComment { isMinimized minimizedReason } } }' |
            jq -e '.data.node.isMinimized == true and (.data.node.minimizedReason | ascii_downcase) == "outdated"'
      # Whatever happened before: these ask the forge what this run left
      # and need no artifact, and each is tried whatever became of the one
      # before it. A comment that cannot be deleted fails the job, so that
      # none is left behind without a red run to say so.
      # From the scratch issue, and from the pull request this run is for:
      # gh-aw's handlers also comment where a run was started from.
      - name: Delete the comments
        if: ${{ always() }}
        env:
          STARTED_FROM: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          for issue in "$ISSUE" ${STARTED_FROM:+"$STARTED_FROM"}; do
            gh api --paginate "repos/$GH_REPO/issues/$issue/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$RUN\"))).id" |
              xargs -r -I{} gh api -X DELETE "repos/$GH_REPO/issues/comments/{}"
          done
      # Whatever became of e2e-items: each part is tried, and one that
      # fails fails the job. A link left under the scratch issue would count
      # toward the forge's limit on its sub-issues.
      - name: Remove the scratch items
        if: ${{ always() && needs.e2e-items-scratch.result != 'skipped' }}
        env:
          BRANCH: ${{ needs.e2e-items-scratch.outputs.branch }}
          PR: ${{ needs.e2e-items-scratch.outputs.pull-request }}
          SUB: ${{ needs.e2e-items-scratch.outputs.sub-issue }}
        run: |
          failed=0
          # Each listing succeeds empty when the item is gone, so only one
          # that succeeds without it confirms absence; a failed one fails.
          if [ -n "$SUB" ]; then
            if subs=$(gh api "repos/$GH_REPO/issues/$ISSUE/sub_issues?per_page=100" --paginate --jq '.[].number'); then
              if grep -qx "$SUB" <<< "$subs"; then
                id=$(gh api "repos/$GH_REPO/issues/$SUB" --jq .id) &&
                  gh api -X DELETE "repos/$GH_REPO/issues/$ISSUE/sub_issue" -F sub_issue_id="$id" > /dev/null || failed=1
              fi
            else
              failed=1
            fi
            gh api -X PATCH "repos/$GH_REPO/issues/$SUB" -f state=closed > /dev/null || failed=1
          fi
          if [ -n "$PR" ]; then
            gh api -X PATCH "repos/$GH_REPO/pulls/$PR" -f state=closed > /dev/null || failed=1
          fi
          if [ -n "$BRANCH" ]; then
            if refs=$(gh api "repos/$GH_REPO/git/matching-refs/heads/$BRANCH" --jq '.[].ref'); then
              if grep -qxF "refs/heads/$BRANCH" <<< "$refs"; then
                gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" || failed=1
              fi
            else
              failed=1
            fi
          fi
          exit "$failed"
      - name: Close only the scratch pull request of this run and delete its branch
        if: ${{ always() }}
        run: |
          # No number means e2e-scratch opened none: never look for a replacement.
          test -n "$PEOPLE_PR" || exit 0
          [[ $PEOPLE_PR =~ ^[1-9][0-9]*$ && $PEOPLE_BRANCH =~ ^e2e-scratch/$GITHUB_RUN_ID-[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/pulls/$PEOPLE_PR" |
            jq -e --arg repo "$GH_REPO" --arg branch "$PEOPLE_BRANCH" '.head.ref == $branch and .head.repo.full_name == $repo' > /dev/null
          gh api -X PATCH "repos/$GH_REPO/pulls/$PEOPLE_PR" -f state=closed > /dev/null
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$PEOPLE_BRANCH"
      # GitHub coalesces a bot's eyes reaction across runs. Leave it in place:
      # removing it here could invalidate a concurrent run's assertion.

  # The ruleset requires ci, not standalone workflow results. Keep the
  # privileged enforcement proof in that dependency chain, including queues.
  world-write:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install recipe runner
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - run: just world-write-test
      - name: Publish bounded enforcement and object evidence
        run: just world-write-evidence "$RUNNER_TEMP/world-write"

  # The policy as a caller's job gets it: loaded by the secure-host
  # action from this checkout's object, then tested after the action has
  # exited, as the sandbox user. setup refuses a host without the four
  # links, and the refused write below fails the job if the policy is
  # switched off; there is no step that passes without it.
  world-write-runtime:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secure the host
        uses: ./secure-host # zizmor: ignore[self-repository] Exercise the checked-out action and its object.
        with:
          build: true
      # setup's probe file: root's, mode 0666, on the root filesystem, so
      # ordinary permissions allow the append. Without the view (off by
      # default) nothing else refuses it: dash's own "Permission denied" for
      # that path is the policy's EACCES.
      - name: The sandbox user is refused a write to a world-writable file of root
        run: |
          probe=/etc/agentic-job/world-write-probe/file
          test "$(stat -c '%u %a %d' "$probe")" = "0 666 $(stat -c %d /)"
          # Expanded by the sandbox's shell, not this one.
          # shellcheck disable=SC2016
          if agentic-job sandbox exec -- sh -c ': >> "$1"' sh "$probe" 2> "$RUNNER_TEMP/refused.txt"; then
            echo "::error::the sandbox user appended to $probe"; exit 1
          fi
          sed 's/::/: :/g' "$RUNNER_TEMP/refused.txt"
          grep -qF "cannot create $probe: Permission denied" "$RUNNER_TEMP/refused.txt"
      # The same kind of file, owned by the writer, still takes the write.
      - name: The sandbox user writes its own world-writable file (control)
        shell: agentic-job sandbox exec --stdin {0} -- bash -eo pipefail -s
        run: |
          install -m 0666 /dev/null owned
          test "$(stat -c '%a %d' owned)" = "666 $(stat -c %d /)"
          echo control >> owned
          grep -qx control owned

  # After secure-host, a `run:` step and a JavaScript action's main and
  # post steps try sudo, docker, a root-owned world-writable file and the
  # cloud metadata service, and each must fail. Read-only token, no
  # id-token, no secrets; probes run as the runner's user, root only
  # before setup. The action is the checkout's own, so the runner gives
  # it the runtime token and runs its post step as it would a downloaded one's.
  confined:
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    name: Confined run step and JavaScript action main and post steps
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/actions/confine-probe/probe.test.mjs
      # Run secure-host's entry points from the checkout, not as a local
      # action. Build both artifacts from this checkout, never a release;
      # the build installs its compilers.
      - run: bash secure-host/binary.sh get --build --out "$RUNNER_TEMP/secure-host/bin"
      - run: '"$RUNNER_TEMP/secure-host/bin/agentic-job" secure-host supported'
      - name: "Install the checkout's binary"
        run: sudo install -m 0755 "$RUNNER_TEMP/secure-host/bin/agentic-job" /usr/local/bin/agentic-job
      - run: sudo /usr/local/bin/agentic-job secure-host apt
      - name: Install bpftool
        run: sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)"
        timeout-minutes: 5
      # Root's and world-writable, where setup's walk does not look (a
      # shared temporary directory): the access-time policy is all that
      # refuses a write to it after the action.
      - name: Leave a world-writable root file
        run: sudo install -m 0666 -o root -g root /dev/null /var/tmp/agentic-job-confine-root-file
      - name: Before the lock each route works (control)
        run: node .github/actions/confine-probe/probe.mjs control before
      - name: Write the confinement configuration
        run: |
          agentic-job config --host --from secure-host/hosted.toml \
            --boolean sandbox.deny-runner-metadata=true > "$RUNNER_TEMP/secure-host/config.toml"
      - name: "Load the checkout's world-write object"
        run: sudo /usr/local/bin/agentic-job secure-host world-write "$RUNNER_TEMP/secure-host/bin/world_write.bpf.o"
      - name: Secure the host
        run: sudo /usr/local/bin/agentic-job sandbox setup --config "$RUNNER_TEMP/secure-host/config.toml"
      - run: agentic-job sandbox exec -- id -un
      - run: agentic-job sandbox check --record
      - name: A run step is confined
        run: node .github/actions/confine-probe/probe.mjs confined run-step
      # Its post step runs after the upload below, and fails the job if a
      # route is open; its record is in that step's log. The ingress check
      # (docs/workflow-ingress.md) accepts this ignore only while every line
      # of this file closes its quotes, so a plain scalar with an apostrophe
      # is quoted, and a jq program stays on one line.
      - name: The JavaScript action main and post steps are confined
        uses: ./.github/actions/confine-probe # zizmor: ignore[self-repository] The probe under test is this revision's.
      # The records of the probes that failed as well.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: confined-job
          path: ${{ runner.temp }}/confine/
          retention-days: 1
          if-no-files-found: error

  required-checks:
    if: ${{ always() }}
    needs: [changes, lint, rust, vibe, claude-acp, corpus, session-sandbox, static, sandbox, secure-host, secure-host-options, world-write, world-write-runtime, confined, proposals, e2e-proposals, e2e-scratch, e2e-full, e2e-limit, e2e-event, e2e-analysis, e2e-analysis-refused, e2e-people, e2e-items-scratch, e2e-items, e2e-check-run, e2e-review, e2e-dispatch, e2e-compose, e2e-dispatch-verify, e2e-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "A fork's pull request cannot run the end-to-end jobs"
        if: ${{ needs.changes.outputs.fork-e2e == 'true' }}
        run: |
          echo '::error::Without a merge queue this fork pull request cannot run the required write-capable end-to-end jobs. Enable the queue or test from a branch of this repository.'
      # A job may be skipped only when the gate it is under says "false".
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
          HOST: ${{ needs.changes.outputs.host }}
          E2E: ${{ needs.changes.outputs.e2e }}
          REVIEW: ${{ needs.changes.outputs.review }}
          FORK_E2E: ${{ needs.changes.outputs.fork-e2e }}
          EVENT: ${{ github.event_name }}
          # Not a shell string spanning lines: vet admits a new local
          # workflow call's ignore only where every line closes its quotes.
          FILTER: >-
            $fork_e2e == "false" and all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and (
            ($full == "false" and .key != "changes") or
            ($host == "false" and (.key | IN("session-sandbox", "sandbox", "secure-host", "secure-host-options", "world-write", "world-write-runtime", "confined"))) or
            ($e2e == "false" and (.key | IN("proposals", "e2e-proposals", "e2e-scratch", "e2e-full", "e2e-limit", "e2e-event", "e2e-analysis", "e2e-analysis-refused", "e2e-people", "e2e-items-scratch", "e2e-items", "e2e-check-run", "e2e-review", "e2e-dispatch", "e2e-compose", "e2e-dispatch-verify", "e2e-verify"))) or
            (.key == "e2e-check-run" and $event == "push") or
            (.key == "e2e-review" and $review != "true"))))
        run: >-
          jq -e --arg full "$FULL" --arg host "$HOST" --arg e2e "$E2E" --arg review "$REVIEW" --arg fork_e2e "$FORK_E2E" --arg event "$EVENT"
          "$FILTER" <<<"$NEEDS"

  # Only this sentinel is required in the ruleset. Always report a failure
  # if the aggregate did not succeed (a skipped required check can pass).
  ci:
    if: ${{ always() }}
    needs: required-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.required-checks.result }}
        run: test "$RESULT" = success
