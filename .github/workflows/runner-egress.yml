name: runner outbound observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runner-egress.yml'
      - 'workflow/runner-egress/**'

permissions:
  contents: read

jobs:
  observe:
    if: vars.RUNNER_EGRESS_TRACE == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # No checkout action post: the observer must own the final post step.
      # Anonymous fetch is intentional; this probe supports public repositories.
      - name: Fetch probe source without registering a post step
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$SOURCE_URL"
          git fetch --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      # Registered first, so its post runs after later actions' post steps.
      # Runner completion traffic after this final JavaScript post is NOT observed.
      - uses: ./workflow/runner-egress # zizmor: ignore[self-repository] Exercise the probe from the explicitly fetched revision without a checkout post step.
        env:
          TRACE_UPLOAD_SCRIPT: ${{ github.workspace }}/../../_actions/actions/upload-artifact/cf430e030ddbb5b0abf93d22962f4752f3646cd9/dist/upload/index.js
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - run: just runner-egress-test
      - run: just runner-egress-fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-egress-fixture
          path: ${{ runner.temp }}/runner-egress-fixture.txt
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-egress-fixture
          path: ${{ runner.temp }}/runner-egress-download
      # A run-unique key cannot restore an earlier run's untrusted data. Save
      # then restore the same entry so both network paths execute on every run.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runner-egress-fixture.txt
          key: runner-egress-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runner-egress-fixture.txt
          key: runner-egress-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - uses: ./workflow/runner-egress/exercise # zizmor: ignore[self-repository] Local JavaScript main/post coverage.
