# Builds the static binaries and their checksums, as the artifact `agentic-job`.
# Called by ci (to keep the build working) and by release (to publish it).
name: build

on:
  workflow_call:
    inputs:
      cache:
        description: Restore the build cache; a release builds without it
        type: boolean
        default: true
      release:
        description: The tag the build is published as, recorded in its manifest
        type: string
        default: TAG
    outputs:
      secure-host-image-artifact-id:
        description: The ID of the `secure-host-image` artifact, for a job of the same run that runs it
        value: ${{ jobs.build.outputs.secure-host-image-artifact-id }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      secure-host-image-artifact-id: ${{ steps.image.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # musl-gcc, for the C that dependencies bring with them. There is no
      # agentic-job yet to tune apt (secure-host apt): its network waits
      # are bounded here, for this command.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y --no-install-recommends musl-tools clang
        timeout-minutes: 5
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ inputs.cache }}
        with:
          key: ${{ env.TARGET }}
      - run: cargo build --release --locked --target "$TARGET" -p agentic-job
      - name: Check the world-write policy's predicate
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror crates/agentic-job/bpf/world_write_policy_test.c -o "$RUNNER_TEMP/world-write-test"
          "$RUNNER_TEMP/world-write-test"
      # The scripted agent too: a run with `agent: fake` needs it. The
      # world-write policy object goes with them, its checksum in the manifest.
      - name: Stage the binaries and their checksums
        run: |
          mkdir dist
          bash secure-host/binary.sh object --out dist
          cd dist
          for name in agentic-job fake-agent; do
            cp "../target/$TARGET/release/$name" "$name-$TARGET"
            sha256sum "$name-$TARGET" > "$name-$TARGET.sha256"
          done
      # The manifest binds the source digest to the binary checksums.
      - name: The manifest of this build
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          bash secure-host/binary.sh pin --dist dist --release "$RELEASE" --repository "$GITHUB_REPOSITORY" > dist/release.json
      # A runner the binary is fetched onto may have another libc, or none.
      - name: The binary is static and runs
        run: |
          file "dist/agentic-job-$TARGET" | tee /dev/stderr | grep -q 'static'
          "dist/agentic-job-$TARGET" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentic-job
          path: dist/
          if-no-files-found: error
      # The same binary and object as an image, saved as an archive: ci
      # runs it from that archive, and release pushes it as it is.
      - name: The secure-host image
        run: |
          podman build --file secure-host/Containerfile --tag localhost/secure-host:build dist
          mkdir image
          podman save --format oci-archive --output image/secure-host.tar localhost/secure-host:build
      - id: image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-host-image
          path: image/
          if-no-files-found: error
