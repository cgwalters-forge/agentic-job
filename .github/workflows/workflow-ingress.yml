# Only base-revision code runs here; proposed files are Git blobs, not actions.
# The main ruleset requires the vet check, so it reports on every PR and merge
# group, checking the whole proposed workflow set against base exemptions.
name: workflow-ingress

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Read-only, base-branch checker; PR blobs are data only.
    types: [opened, synchronize, reopened, edited]
  # The queue merges a group, not the PR head vetted above: vet it again.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-24.04
    # A cold release build of the base-owned checker needs compilation time.
    timeout-minutes: 30
    # Any fork can trigger this without approval: a new push supersedes the
    # previous head's run.
    concurrency:
      # Each merge group has its own ref and must report; never cancel one.
      group: workflow-ingress-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is the base branch tip for pull_request_target but the
          # queued, unvetted merge commit for merge_group: use the group's base.
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build base-owned workflow checker
        run: cargo build --locked --release -p agentic-job
      - name: Install verified static analyzers
        working-directory: ${{ runner.temp }}
        run: |
          curl -fL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          curl -fL --retry 3 https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz -o zizmor.tar.gz
          printf '%s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' 'e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  zizmor.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xzf zizmor.tar.gz zizmor
      - name: Fetch proposed Git objects without checking them out
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR: ${{ github.event.pull_request.number }}
          ZIZMOR: ${{ runner.temp }}/zizmor
          ACTIONLINT: ${{ runner.temp }}/actionlint
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            # The group head descends from its base, so the checker's
            # merge-base diff is exactly the queued change.
            git fetch --no-tags origin "$BASE" "$HEAD"
          else
            [[ "$PR" =~ ^[0-9]+$ ]]
            git fetch --no-tags origin "$BASE" "refs/pull/$PR/head"
          fi
          git cat-file -e "$HEAD^{commit}"
          python3 workflow/ingress.py . "$BASE" "$HEAD" --workflows-binary target/release/agentic-job --exemptions .github/agentic-job/workflows.toml
