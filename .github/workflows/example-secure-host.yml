# A job that runs no agent, as another repository would write one: it
# secures its host first and then builds and tests as any job does.
# cgwalters-forge/actions/secure-host's docs/setup.md says what the step
# does and what a job has to know.
#
# The order is the whole of it. Everything that needs root comes before
# the step, which is the last thing in the job to have it. After it every
# step is the runner's user's, without sudo, the cloud metadata service or
# a container daemon, and a world-writable file can be changed only by its
# owner.
#
# CI calls this file on every pull request and push, so what it shows is
# what runs.
name: example-secure-host

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image-artifact:
        description: >-
          For testing an unreleased secure-host image: the name of an artifact of this workflow run
          holding build.yml's secure-host.tar, which runs as root in place of the pinned, attested
          image, unverified. Empty for the pinned image
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # systemd 257 or later: ubuntu-24.04 is too old.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restored here, and saved by its post step when the job ends, long
      # after the lock: a cache is the runner's user's own files.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: ${{ inputs.image-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/image
      # The forwarder to cgwalters-forge/actions/secure-host. A job of
      # another repository names that action by the commit it has read:
      #   uses: cgwalters-forge/actions/secure-host@COMMIT
      - name: Secure the host
        uses: ./secure-host # zizmor: ignore[self-repository] Exercise the checked-out forwarder under test.
        with:
          image-archive: ${{ inputs.image-artifact != '' && format('{0}/image/secure-host.tar', runner.temp) || '' }}
      - name: No step has root from here on
        run: |
          if sudo -n true; then echo "::error::the runner's user still has sudo"; exit 1; fi
          if docker info > /dev/null 2>&1; then echo "::error::the container daemon still answers"; exit 1; fi
      # An ordinary step: the runner's user, its toolchain, its checkout.
      - name: Build and test
        run: cargo test --locked --lib
      - name: Test the egress policy
        run: |
          # The network is open for reads.
          curl --fail --silent --show-error --output /dev/null https://github.com/
          python3 -m unittest discover -s egress 2>&1 | tee "$RUNNER_TEMP/report.txt"
          # unittest ends on `OK`, or `OK (skipped=N)`: test_live.py skips
          # here, where mitmproxy is not installed; the lint job runs it.
          if ! grep -Eqx 'OK( \(skipped=[0-9]+\))?' "$RUNNER_TEMP/report.txt"; then
            echo "::error::the egress tests did not end with OK"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-host-report
          path: ${{ runner.temp }}/report.txt
          retention-days: 1
          if-no-files-found: error
      # The action ran this already; again at the end, after everything
      # the job did, the host is still what it proved.
      - name: The host is still secure
        run: agentic-job sandbox check
