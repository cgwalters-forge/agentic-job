# A job that runs no agent, as another repository would write one: it
# secures its host first and then builds and tests as any job does.
# docs/secure-host.md says what the step does and what a job has to know.
#
# The order is the whole of it. Everything that needs root comes before
# the step, which is the last thing in the job to have it. After it the
# job's steps are the runner's user's without sudo, and what the job does
# not trust runs as the sandbox user, which has none of the job's files,
# tokens or environment.
#
# CI calls this file on every pull request and push, so what it shows is
# what runs.
name: example-secure-host

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # systemd 257 or later, for run0: ubuntu-24.04 is too old.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restored here, and saved by its post step when the job ends, long
      # after the lock: a cache is the runner's user's own files.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Another repository names the action by the commit it has read:
      #   uses: cgwalters-forge/agentic-job/secure-host@COMMIT
      - name: Secure the host
        id: host
        uses: ./secure-host
      - name: No step has root from here on
        run: |
          if sudo -n true; then echo "::error::the runner's user still has sudo"; exit 1; fi
          if docker info > /dev/null 2>&1; then echo "::error::the container daemon still answers"; exit 1; fi
      # An ordinary step: the runner's user, its toolchain, its checkout.
      - name: Build and test
        run: cargo test --locked --lib
      # What the job does not trust gets a copy of the source and nothing
      # else: the sandbox user cannot read the checkout where it is.
      - name: Hand the source to the sandbox user
        run: git archive --prefix=src/ HEAD egress | agentic-job sandbox exec -- tar -x
      - name: Test as the sandbox user
        shell: agentic-job sandbox exec --stdin {0} -- bash -eo pipefail -s
        env:
          RUNNER_HOME: /home/runner
        run: |
          test "$(id -un)" != runner
          # Nothing of the job came along: no variable of the step's, no
          # file of the runner's, no root.
          test -z "${RUNNER_HOME:-}${GITHUB_WORKSPACE:-}${ACTIONS_RUNTIME_TOKEN:-}"
          if ls /home/runner > /dev/null 2>&1; then echo "the runner's home is open"; exit 1; fi
          if sudo -n true 2> /dev/null; then echo "the sandbox user has sudo"; exit 1; fi
          # Out through the egress proxy, and nowhere else.
          curl --fail --silent --show-error --output /dev/null https://github.com/
          cd src
          python3 -m unittest discover -s egress 2>&1 | tee ../report.txt
      # Back out as bytes on a pipe. What the sandbox user wrote is data.
      - name: Take the report back
        env:
          SANDBOX_USER: ${{ steps.host.outputs.sandbox-user }}
          SANDBOX_HOME: ${{ steps.host.outputs.sandbox-home }}
        run: |
          agentic-job sandbox exec -- cat report.txt > "$RUNNER_TEMP/report.txt"
          grep -x OK "$RUNNER_TEMP/report.txt"
          echo "tested as $SANDBOX_USER in $SANDBOX_HOME" | tee -a "$GITHUB_STEP_SUMMARY"
      # A command's exit state is the step's.
      - name: A failure in the sandbox fails the step
        run: |
          state=0; agentic-job sandbox exec -- sh -c 'exit 7' || state=$?
          test "$state" = 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-host-report
          path: ${{ runner.temp }}/report.txt
          retention-days: 1
          if-no-files-found: error
      # The action ran this already; again at the end, after everything
      # the job did, the host is still what it proved.
      - name: The host is still secure
        run: agentic-job sandbox check
