# A caller that writes the agent job itself, from the pieces of
# agentic-job.yml (docs/workflow.md), to run steps of its own on the
# agent's machine: privileged ones before secure-host, others after run.
# Use it only for such steps: everything else agentic-job.yml takes as
# inputs, and calling that is simpler.
#
# The agent is the runner's user, as every step after secure-host is, so
# the agent job holds no `id-token` and cannot register a run at a broker
# itself. A real agent behind a broker registers in a job of its own, as
# agentic-job.yml's `register` does, and gets the run token as a secret
# of a reusable workflow's call (docs/workflow.md#the-run-token); that
# job's `job_workflow_ref` names this file, which the broker then has to
# admit (docs/inference.md#which-workflows-a-broker-admits).
#
# It runs the scripted agent, which needs no inference and no secret,
# for an analysis that comments once on the issue it names. CI's
# `e2e-compose` runs it, with its two example steps.
name: example-compose
run-name: compose ${{ inputs.item }}

on:
  workflow_call:
    # Forward only this declared credential, never inherit.
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
    inputs:
      scripted:
        description: CI's call, grouped by its run so that CI runs do not cancel each other's
        type: boolean
        default: false
      task:
        type: string
        required: true
      item:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      task:
        description: The task (public, like everything about a run)
        type: string
        required: true
      item:
        description: The issue of this repository the run comments on
        type: string
        required: true

permissions: {}

# One run at a time for each issue. CI calls this with a fixed issue,
# so its call is grouped by its run as well: GitHub cancels the older of
# two pending runs in a group, and one CI run must not fail another's.
concurrency:
  group: compose-${{ inputs.item }}${{ inputs.scripted && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  # The task as an artifact, not a job output: the runner drops an output
  # its secret masker changes, so a task that quotes credential-shaped
  # text would reach policy empty.
  task:
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - env:
          TASK: ${{ inputs.task }}
        run: mkdir task && printf '%s\n' "$TASK" > task/task.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-task
          path: task/task.md
          if-no-files-found: error

  # Another repository names each piece by the commit it has read, the
  # same for all three, which also pins the binary and the agent job's
  # actions (the policy call's source-repository and source-sha):
  #   uses: cgwalters-forge/agentic-job/.github/workflows/NAME.yml@COMMIT
  policy:
    needs: task
    uses: ./.github/workflows/policy.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    # Policy reads; activate and notify act on no event here.
    permissions:
      actions: read
      contents: read
    with:
      id: ${{ github.repository }}#${{ inputs.item }}
      repo: ${{ github.repository }}
      task-artifact: compose-task
      kind: analysis
      outputs: add_comment,noop
      max-outputs: "1"
      comment-target: ${{ inputs.item }}
      notify: none
      allow: .github/agentic-job/allow.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      fake-profile: comment
      # Nothing counts model requests without an inference proxy, and a
      # cap that nothing counts is refused. For claude or opencode, the
      # proxy and how the run proves itself, without fake-profile:
      #   agent: claude
      #   inference-url: ${{ vars.INFERENCE_URL }}
      #   inference-audience: ${{ vars.INFERENCE_AUDIENCE }}
      #   max-requests: "150"
      # Not a provider's API key: the admit step below refuses it for now
      # (docs/inference.md#a-provider-api-key).
      max-requests: "0"
      artifact-prefix: compose-

  agent:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Read only, and yours to keep so: the agent may get this job's token
    # for GitHub reads, and `run` cannot see what it was granted. No
    # `id-token`: the agent, the runner's user, could mint identity tokens
    # for any audience with it.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      over-budget: ${{ steps.run.outputs.over-budget }}
      cost: ${{ steps.run.outputs.cost }}
      secret-at: ${{ steps.run.outputs.secret-at }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false
      - name: The policy call's source repository and commit
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
        run: |
          echo "$SOURCE_REPOSITORY at $SOURCE_SHA"
          [[ "$SOURCE_REPOSITORY" == */* && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          persist-credentials: false
      - uses: ./.agentic-job-source/prepare # zizmor: ignore[self-repository] Execute the policy-selected source checkout, not the caller repository.
        with:
          binary-artifact-id: ${{ needs.policy.outputs.binary-artifact-id }}
          policy-artifact-id: ${{ needs.policy.outputs.policy-artifact-id }}
      # ---- Your privileged steps go here: joining the proxy's network, ----
      # packages, services. They run as the runner's user with sudo, before
      # anything of the agent's is on the machine; they must not write
      # .agentic-job, .agentic-job-source or /usr/local/bin/agentic-job, and
      # must leave no credential where secure-host does not close it
      # (specs/run-contract-spec.md, section 3.4). This example writes a
      # file only root can.
      - name: A caller's privileged step (example)
        run: sudo install -m 0600 -o root -g root /dev/null /var/lib/compose-caller-step
      # ---- End of your privileged steps. ----
      # As agent.yml does, after your privileged steps: refuses what the
      # runner's user cannot hold for the agent (an API key, an MCP
      # credential, a session) and a private repository.
      - name: Admit the runner-user configuration
        env:
          CALLER_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          AGENT_USER: runner
        run: python3 .agentic-job-source/workflow/runner-setup.py admit
      # A TCP connection to the inference proxy, if any, so that a runner
      # off its network fails here rather than in a probe of setup's rules.
      # It sends nothing, and skips the scripted agent.
      - name: Check inference proxy reachability
        run: agentic-job secure-host inference .agentic-job/config.toml
      # The policy job's configuration for the host, but for
      # `setup.script`, which the step after secure-host runs.
      - name: The host's configuration
        run: agentic-job config --host --no-script --from .agentic-job/config.toml > "$RUNNER_TEMP/agentic-job-host.toml"
      # cgwalters-forge/actions/secure-host, through the forwarder of the
      # policy job's commit, which pins it: the last step with root.
      - uses: ./.agentic-job-source/secure-host # zizmor: ignore[self-repository] Execute the policy-selected source checkout, not the caller repository.
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
      - name: The setup script
        env:
          AGENT_HOME: ${{ runner.temp }}/agent-home
        run: python3 .agentic-job-source/workflow/runner-setup.py setup
      - id: run
        timeout-minutes: 340
        uses: ./.agentic-job-source/run # zizmor: ignore[self-repository] Execute the policy-selected source checkout, not the caller repository.
        with:
          runner-home: ${{ runner.temp }}/agent-home
          # The job's own read-only token expires when the job ends.
          github-token: ${{ github.token }}
      # ---- Your later steps go here. They run as the runner's user, the ----
      # agent's, with no sudo, after the agent's outputs are uploaded;
      # nothing of the agent's machine is trusted by check or apply. Treat
      # what the agent left as hostile data too: never execute it (no build,
      # script, hook or test from the checkout) and never hand it to a step
      # that holds a credential, since anything the agent left running can
      # reach that step (specs/run-contract-spec.md, RC-017). This example
      # shows the step before had root and this one has none.
      - name: A caller's later step (example)
        run: |
          test "$(stat -c '%U %a' /var/lib/compose-caller-step)" = 'root 600'
          if sudo -n true 2> /dev/null; then echo '::error::a step after run has sudo'; exit 1; fi

  check:
    needs: [policy, agent]
    # Also for a run that failed and still handed something back.
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  apply:
    needs: [policy, agent, check]
    if: ${{ always() && needs.policy.result == 'success' }}
    uses: ./.github/workflows/apply.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    # The explicit name is forwarded even when its value is available
    # only in apply's environment.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    # A comment on an issue of this repository is all it writes; it
    # executes no agent-produced code.
    # `actions: read` lets it confirm the checked outputs are check's.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}
