# Publishes the static binaries with their SHA-256 checksums as a GitHub
# release. Runs for a pushed tag, or by hand with the tag to create at the
# chosen commit. The tag must be `v` and the workspace's version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created at this commit if missing), e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      cache: false

  # The only job with a write token, and it builds nothing: it publishes
  # the files the build job made.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentic-job
      # Comparing the whole tag also keeps it to the shape of a version.
      - name: The checksums match and the version is the tag's
        run: |
          sha256sum --check "agentic-job-$TARGET.sha256" "fake-agent-$TARGET.sha256"
          chmod +x "agentic-job-$TARGET"
          test "$("./agentic-job-$TARGET" --version)" = "agentic-job ${TAG#v}"
          test "v${TAG#v}" = "$TAG"
      # `gh release create` ignores --target for a tag that exists, and
      # would publish this commit's binary under another commit's tag.
      - name: A tag given by hand does not exist yet
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG"
          --jq 'map(select(.ref == "refs/tags/'"$TAG"'")) | length'
          | grep -qx 0
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA" --generate-notes
          "agentic-job-$TARGET" "agentic-job-$TARGET.sha256"
          "fake-agent-$TARGET" "fake-agent-$TARGET.sha256"
