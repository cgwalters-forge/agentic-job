# Publishes a version for callers to pin: tags main's commit `vVERSION`
# and releases the static binaries with their SHA-256 checksums, with
# notes from the pull requests merged since the previous version, then
# pushes and attests the secure-host image that holds them.
# Run by hand on main once the workspace's version has been raised.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, MAJOR.MINOR.PATCH (the workspace's, newer than the last tag)
        required: true
        type: string

permissions:
  contents: read

# One release at a time, so two runs cannot both pass the newer-than check.
concurrency:
  group: ${{ github.workflow }}

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      previous: ${{ steps.check.outputs.previous }}
      tags: ${{ steps.check.outputs.tags }}
    steps:
      # Against a mistake: a tag on another branch would be a version
      # nobody reviewed, offered to every caller as an upgrade. A branch
      # can drop this step; only a `v*` tag ruleset limits who could.
      - name: The run is on main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags to compare with
      # As build.yml installs its packages.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y --no-install-recommends just
      # Also keeps the version to a shape safe to use in the steps below.
      - id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          previous=$(just release-check "$VERSION")
          tags=$(git tag --list 'v*')
          {
            echo "tag=v$VERSION"
            echo "previous=$previous"
            echo "tags=$(printf '%s' "$tags" | LC_ALL=C sort | sha256sum)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] Build this revision's source with its reusable workflow.
    with:
      cache: false
      release: ${{ needs.version.outputs.tag }}

  # Signs the manifest, so that a caller pinning the tag takes the binaries
  # by checksums this workflow on main made for the tag's commit, not by
  # whatever a release editor uploads. Its own job: the publish job runs the
  # binary, which must not see the OIDC request credential.
  attest:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentic-job
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/release.json
      - name: Stage the verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir provenance
          cp "$BUNDLE" provenance/provenance.jsonl
      # Exercise the caller's tokenless verification policy before publishing.
      - name: Verify the attested manifest without a token
        run: >-
          GH_TOKEN='' GITHUB_TOKEN='' gh attestation verify dist/release.json
          --bundle provenance/provenance.jsonl --repo "$GITHUB_REPOSITORY"
          --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  # The only job with a write token, and it builds nothing: it publishes
  # the files the build job made.
  publish:
    needs: [version, build, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentic-job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
      - name: The checksums match and the version is the tag's
        run: |
          sha256sum --check "agentic-job-$TARGET.sha256" "fake-agent-$TARGET.sha256"
          chmod +x "agentic-job-$TARGET"
          test "$("./agentic-job-$TARGET" --version)" = "agentic-job ${TAG#v}"
      # A tag pushed during the build may be newer than this version.
      # Only the gh steps get the token: the step above runs the binary.
      - name: The tags are those the version was checked against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')
          test "$(printf '%s' "$tags" | LC_ALL=C sort | sha256sum)" = "$TAGS"
      # Creating the tag fails if it exists, where `gh release create`
      # would take an existing tag, ignore --target and publish this
      # commit's binary under another commit's tag. Should publishing
      # then fail, the tag is left for a maintainer to delete.
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
      # Notes start at the previous version, not at whichever release is
      # newest: the source-addressed `build-…` ones are releases too.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=()
          [ -z "$PREVIOUS" ] || start=(--notes-start-tag "$PREVIOUS")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TAG" --generate-notes "${start[@]}" \
            "agentic-job-$TARGET" "agentic-job-$TARGET.sha256" \
            "fake-agent-$TARGET" "fake-agent-$TARGET.sha256" release.json provenance.jsonl world_write.bpf.o
          # Immutability locks assets at publication, not while still a draft.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The secure-host image, pushed from the archive the build job saved
  # and attested by its digest, so that a caller pinning that digest can
  # verify the image was built from main's commit by this workflow. Only
  # after the release is published: a failed release pushes nothing. It
  # runs nothing of the build's; the package and identity-token
  # permissions copy and sign bytes.
  image:
    needs: [version, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/secure-host
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secure-host-image
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v skopeo > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update -q
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y --no-install-recommends skopeo
          fi
          # Docker's file, the only one the attest action's registry push
          # reads; the job token stays there until the job ends.
          mkdir -p ~/.docker
          printf '%s' "$GH_TOKEN" | skopeo login --authfile ~/.docker/config.json --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          # As with the git tag: a version names one image, not replaced on
          # a rerun. Best effort: an inspect that fails for another reason
          # (a registry error) counts as no tag.
          if skopeo inspect --authfile ~/.docker/config.json --raw "docker://$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG exists already"; exit 1
          fi
          skopeo copy --authfile ~/.docker/config.json --digestfile "$RUNNER_TEMP/digest" oci-archive:secure-host.tar "docker://$IMAGE:$TAG"
          # skopeo writes the digest with no trailing newline, so `read`
          # would return 1 at end of file and end the step under `-e`.
          digest=$(< "$RUNNER_TEMP/digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # As a caller pinning the digest would, by the same identity as the
      # manifest's; with the token, since a new package starts private.
      - name: Verify the image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >-
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
