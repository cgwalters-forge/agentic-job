# The last piece of an agent run: what check accepted, applied by the
# only job with a credential that can write, and how the run ended told
# to whoever started it. It runs nothing that came from the agent's
# machine but the checked outputs.
#
#   apply     gh-aw's pinned handlers on check.yml's accepted outputs, and
#             agentic-job's own for the types the bounds route to them;
#             uses SAFE_OUTPUTS_PAT; conclude prefers it for status comments
#   conclude  edits the opted-in status comment, including check's
#             refusal to the policy's comment target
#
# With `apply-staged`, apply writes nothing: each step that holds
# SAFE_OUTPUTS_PAT or could write with the job token is skipped, and the
# checked outputs are shown in the job's summary and applied.json
# instead, for trying a new caller before it may write.
#
# Its inputs are the caller's `needs` of the other pieces, as JSON: the
# settings come from policy.yml's outputs, so that what is applied is
# what that call decided. The agent's exit state decides only whether
# a partial run is applied; check decided whether anything may be.
name: agentic-job apply

on:
  workflow_call:
    inputs:
      role-bindings:
        description: Caller-only JSON binding status, review, fork_push and publication to numeric actor_id and optional app_id; empty keeps legacy token selection
        type: string
        default: ""
      policy:
        description: "`toJSON(needs.policy.outputs)` of the policy.yml call"
        type: string
        required: true
      agent:
        description: "`toJSON(needs.agent)` of the agent job (its result and its `exit` output); `{}` for proposals from a non-agent job"
        type: string
        default: "{}"
      check:
        description: "`toJSON(needs.check)` of the check.yml call (its result and outputs)"
        type: string
        required: true
    secrets:
      STATUS_TOKEN:
        description: Status role credential; never falls back in role mode
        required: false
      REVIEW_TOKEN:
        description: Review and result comment role credential
        required: false
      PUSH_TOKEN:
        description: Fork creation and git push credential, separate from upstream publication
        required: false
      PUBLICATION_TOKEN:
        description: Upstream pull request and metadata publication credential
        required: false
      # Explicit optional credential for apply and status comments. Never use inherit.
      # Callers must pass this name even for an environment secret;
      # the environment's same-name value takes precedence (docs/workflow.md).
      SAFE_OUTPUTS_PAT:
        description: Optional credential for applying safe outputs; defaults to the job token when empty
        required: false
    outputs:
      applied-artifact-id:
        description: The artifact holding applied.json, which names what the apply job made
        value: ${{ jobs.apply.outputs.artifact-id }}
      pull-request:
        description: The number of the pull request the run opened, if it opened one
        value: ${{ jobs.apply.outputs.pull-request }}
      result-url:
        description: The URL of what apply made, the pull request or else the first comment or issue; empty for none
        value: ${{ jobs.apply.outputs.result-url }}
      blocked:
        description: "`true` when the run handed back only missing_data (and noop) and no change: blocked, not failed"
        value: ${{ jobs.apply.outputs.blocked }}

# No `permissions` here: a job that names none keeps what the caller
# granted the call, which apply writes with and conclude comments with.

# With `pipefail`, which the default shell of a step does without: a check
# whose output is piped must still fail its step.
defaults:
  run:
    shell: bash

env:
  # github/gh-aw's fixed place for a run's files (its constants.cjs).
  GH_AW_TMP: /tmp/gh-aw

jobs:
  # It runs gh-aw's pinned handlers on the checked outputs, and nothing
  # that came from the agent's machine but those outputs. No `permissions`
  # here: it keeps what the caller granted the call, which with
  # `apply-environment` should be no more than the other jobs ask for.
  apply:
    # A run that ended well, or one stopped at a limit whose caller asked
    # for partial work. The exit state comes from the agent's machine and
    # decides only this; the check job decided whether it may be applied.
    if: >-
      ${{ !cancelled() && fromJSON(inputs.check).result == 'success' && (fromJSON(inputs.policy).proposals-artifact != '' || format('{0}', fromJSON(inputs.agent).outputs.exit) == '0' ||
          (fromJSON(inputs.policy).apply-partial == 'true' && contains(fromJSON('["3", "124"]'), fromJSON(inputs.agent).outputs.exit))) && fromJSON(inputs.policy).expect-check-refusal != 'true' }}
    runs-on: ${{ fromJSON(fromJSON(inputs.policy).runner) }}
    timeout-minutes: 15
    environment: ${{ fromJSON(inputs.policy).apply-environment }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      pull-request: ${{ steps.publish.outputs.created_pr_number || steps.apply.outputs.created_pr_number || steps.applied.outputs.pull-request-number }}
      result-url: ${{ steps.result.outputs.result-url }}
      # `true` when the run handed back only noop, missing_tool or missing_data, for conclude.
      no-result: ${{ steps.result.outputs.no-result }}
      missing-data: ${{ steps.result.outputs.missing-data }}
      # `true` when check found the run blocked and everything else here succeeded.
      blocked: ${{ steps.applied-all.outputs.blocked }}
      no-result-reason: ${{ steps.result.outputs.no-result-reason }}
      handler-errors: ${{ steps.handler-errors.outputs.reason }}
      # `true` when the secondary pull request was asked for and not opened.
      secondary-failed: ${{ steps.secondary.outputs.failed }}
    env:
      APPLY_ROLE_BINDINGS: ${{ inputs.role-bindings }}
      STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
      REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      PUBLICATION_TOKEN: ${{ secrets.PUBLICATION_TOKEN }}
      OUTPUT_REPO: ${{ fromJSON(inputs.policy).output-repo || github.repository }}
      # The issue the caller made the run for, a number policy checked, and
      # the repository it and a comment's target are in: the output
      # repository unless the caller put the item elsewhere (`item-repo`).
      ISSUE: ${{ fromJSON(inputs.policy).issue }}
      ITEM_REPO: ${{ fromJSON(inputs.policy).item-repo || fromJSON(inputs.policy).output-repo || github.repository }}
      REPO: ${{ fromJSON(inputs.policy).repo }}
      BASE: ${{ fromJSON(inputs.policy).base }}
      REPORT: /tmp/gh-aw/report.json
      # What gh-aw's handlers list the things they made in.
      MADE: /tmp/gh-aw/safe-output-items.jsonl
    steps:
      # The pieces must be one commit's: a policy call pinned elsewhere
      # would have this commit's code check (or apply) the settings,
      # binary and policy of another, possibly an older, weaker one.
      - name: The policy call is this workflow's commit
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_REPOSITORY" == "$REPOSITORY" && "$SOURCE_SHA" == "$SHA" ]] ||
            { echo "::error::policy.yml ran at $SOURCE_REPOSITORY@$SOURCE_SHA, this workflow at $REPOSITORY@$SHA: pin all pieces to one commit"; exit 1; }
      # From the caller's composition: an empty ID must not turn
      # download-artifact into a download of all uploads, the agent's
      # unchecked proposals included.
      - name: Require the checked outputs' artifact ID
        env:
          CHECKED: ${{ fromJSON(inputs.check).outputs.artifact-id }}
          DIGEST: ${{ fromJSON(inputs.check).outputs.artifact-digest }}
        run: |
          [[ "$CHECKED" =~ ^[1-9][0-9]*$ ]] || { echo '::error::a checked artifact ID is required'; exit 1; }
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::the checked artifact'\''s SHA-256 digest is required'; exit 1; }
      # Nor is the ID check's because the caller says so: one wired from
      # the agent job would apply unchecked proposals. It has to be this
      # run's upload of the name check.yml uploads under this policy
      # call's prefix, which only check's last step does, and only when
      # check accepted: a policy call's prefix is unique in a run, as its
      # own uploads under it would conflict, and so would an earlier upload
      # of the name with check's. Read with the job token (`actions: read`).
      # This binds the run, not the attempt: the API names no attempt, and
      # a re-run keeps the run ID, so an earlier attempt's upload passes.
      # That is still check's accepted output under this prefix. Its
      # digest, as check's upload step gave it, holds the download below
      # to the bytes check uploaded, as check holds the agent's.
      - name: The checked outputs are this run's check's
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ fromJSON(inputs.check).outputs.artifact-id }}
          DIGEST: ${{ fromJSON(inputs.check).outputs.artifact-digest }}
          NAME: ${{ fromJSON(inputs.policy).artifact-prefix }}checked-outputs
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CHECKED" |
            jq -e --arg name "$NAME" --arg run "$GITHUB_RUN_ID" --arg digest "sha256:$DIGEST" \
              '.name == $name and (.workflow_run.id | tostring) == $run and .digest == $digest' > /dev/null ||
            { echo "::error::artifact $CHECKED is not $NAME of run $GITHUB_RUN_ID with digest sha256:$DIGEST: apply takes check.yml's output of this run, and the call needs \`actions: read\`"; exit 1; }
      # The output repository, whole: the patch is applied on the commit
      # the agent started from, which a shallow clone does not have. The
      # handlers push with this checkout's credentials. Only check's accepted
      # patch report enables it; comment-only outputs need no repository/base.
      # A push's base is its pull request's branch, in the head repository
      # the fork step names: the checkout's own default is taken, and that
      # branch fetched below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' && fromJSON(inputs.policy).apply-staged != 'true' }}
        with:
          repository: ${{ env.OUTPUT_REPO }}
          ref: ${{ fromJSON(inputs.policy).push-item == '' && fromJSON(inputs.policy).base || '' }}
          fetch-depth: 0
          # Same selection as the handlers; only apply gets this PAT.
          token: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUSH_TOKEN }}
          persist-credentials: true
      - uses: github/gh-aw/actions/setup@462ed682857c4ab64d40f2c85e3738fa27834839 # v0.91.12-7
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.check).outputs.artifact-id }}
          path: ${{ env.GH_AW_TMP }}
          digest-mismatch: error
      - id: replacement
        run: echo "enabled=$(jq -r '.patch.commit_files != null' "$REPORT")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The apply step escapes the handlers' log with
        # workflow/workflow-commands.cjs, for a run without a patch too.
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: apply-source
          sparse-checkout: workflow
          persist-credentials: false
      # `git am` keeps the patch's author and needs a committer, and is to
      # keep a carriage return at a line's end, as the trial below does. Without
      # rename detection a patch that does not apply as it is stops with a
      # conflict, where `git am --3way` would look for the file by content
      # and could change another path than the patch names.
      - name: Configure git
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' && fromJSON(inputs.policy).apply-staged != 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.renames false
          git config diff.renames false
          git config am.keepcr true
      # Policy's binary decides where a patch goes, rebuilds and later
      # pushes a replacement series, links a pull request to its issue
      # and says why a handler failed, with or without a patch; check
      # already runs it, so every run has it. Never execute an artifact
      # ID supplied by the caller without binding it to policy's upload
      # in this run: an agent upload is executable code too.
      - name: Require policy's binary
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          NAME: ${{ fromJSON(inputs.policy).artifact-prefix }}agentic-job-binary
        run: |
          [[ "$BINARY" =~ ^[1-9][0-9]*$ ]] || { echo '::error::the policy binary artifact ID is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BINARY" |
            jq -e --arg name "$NAME" --arg run "$GITHUB_RUN_ID" \
              '.name == $name and (.workflow_run.id | tostring) == $run' > /dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        with:
          artifact-ids: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          path: ${{ runner.temp }}/apply-binary
          digest-mismatch: error
      # Prevent a missing/misbound role from borrowing the legacy PAT. Reject
      # legacy handlers and replacement pushes before the first fork write.
      - name: Check caller role credentials and routing
        if: ${{ inputs.role-bindings != '' && fromJSON(inputs.policy).apply-staged != 'true' }}
        run: |
          test "$(jq -r '.patch.commit_files == null' "$REPORT")" = true
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" check-apply-token --output-repo "$OUTPUT_REPO" \
            --role-policy "$GH_AW_TMP/policy.json" --outputs "$GH_AW_TMP/agent_output.json"
      # A pull request is opened from a fork of the output repository owned
      # by whoever the token names, never from a branch of the output
      # repository: its CI then runs the agent's commit as a fork's, with a
      # read-only token, no secrets and no OIDC token. The forge makes the
      # fork if there is none and answers with the existing one otherwise;
      # it is not synced, as the handler pushes the commit together with the
      # base it sits on. The job token names nobody and cannot fork (policy
      # refuses it create_pull_request). What the forge answers
      # with is the user's repository in the output repository's network,
      # which can be the network's root or the caller's repository: it has
      # to be a fork, the user's, and neither of those, with Actions turned
      # off. This comes before anything is pushed.
      #
      # An owner of the output repository (the user `GET /user` names) has
      # no fork of it to push to. A new pull request's branch is pushed to
      # the repository itself instead, with its Actions left as they are,
      # only where the repository says so: its `push` and `pull_request`
      # workflows then run the agent's commit with its secrets, a write
      # token and OIDC, which is what the fork prevents. It says so as for
      # a push (`OWNER_BRANCHES` in crates/agentic-job/src/apply/push.rs):
      # that file naming it on its default branch. The repository
      # carries that, not each caller's bounds, as it is its secrets that
      # are given up; a file, as only a commit to the default branch adds
      # one (reviewed and protected as that branch is, and never an
      # agent's: the patch may not touch `.github` here), where a topic is
      # a setting any admin token flips unseen and custom properties are an
      # organization's only.
      #
      # A push goes to the same fork, and only to the branch of a pull
      # request apply opened from it, where the pull request is from that
      # fork. One from anywhere else goes to its head repository, whose CI
      # then runs the agent's commit, only as `push target` allows (#553;
      # its rules are in push.rs). The handler pushes to the pull
      # request's head repository only if it is the one named here
      # (`head-repo` below); it is checked here too, before anything is
      # fetched from it. A push with a PAT, unlike one with the job
      # token, starts the fork's workflows on `push`, with the fork's
      # secrets: Actions are turned off there, and nothing is pushed
      # unless the forge then says they are off. The token goes to
      # policy's binary alone, as it does for the secondary pull request.
      - name: Fork the output repository for the pull request
        id: fork
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' && fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          GH_TOKEN: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUSH_TOKEN }}
          REPLACEMENT: ${{ steps.replacement.outputs.enabled }}
        run: |
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" push target --config "$GH_AW_TMP/config.json" --outputs "$GH_AW_TMP/agent_output.json" \
            --output-repo "$OUTPUT_REPO" --repo "$REPO" --calling-repo "$GITHUB_REPOSITORY" --base "$BASE" \
            --server "$GITHUB_SERVER_URL" --replacement "$REPLACEMENT" >> "$GITHUB_OUTPUT"
      # The target's base branch as this job fetched it, not as anything
      # that was handed back says. Never push the target's commits to an
      # output repository: its push workflows could run with privileges.
      # A push's pull request is in the repository the run worked on (policy
      # refuses any other): checked again here. Its base is the pull
      # request's branch, in the repository the step above checked, and nothing
      # here pushes for it.
      - name: Fetch the target's base branch
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' && fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          FORK: ${{ steps.fork.outputs.repo }}
        run: |
          jq -e '.push_to_pull_request_branch == null' "$GH_AW_TMP/config.json" > /dev/null || [ "${OUTPUT_REPO,,}" = "${REPO,,}" ] ||
            { echo "::error::a push goes to a pull request of $REPO, the repository the run worked on, not of $OUTPUT_REPO"; exit 1; }
          if jq -e 'any(.items[]; .type == "push_to_pull_request_branch")' "$GH_AW_TMP/agent_output.json" > /dev/null; then
            git fetch --no-tags "https://github.com/$FORK" "+refs/heads/$BASE:refs/agentic-job/target-base"
            exit 0
          fi
          git fetch --no-tags "https://github.com/$REPO" "+refs/heads/$BASE:refs/agentic-job/target-base"
          [ "${OUTPUT_REPO,,}" = "${REPO,,}" ] || git merge-base --is-ancestor "$(jq -er '.patch.base_commit' "$REPORT")" HEAD ||
            { echo "::error::sync $OUTPUT_REPO's $BASE to contain the patch's base commit before applying"; exit 1; }
      # The branch a pull request is pushed as is named in the hand-back,
      # and the handlers push that name as it is: it has to be this
      # run's, whatever the agent's machine wrote there. A push's names
      # its patch file: it has to be the policy's base, the pull request's
      # branch, which the handler pushes to by the pull request's number.
      - name: The pull request's branch is this run's
        run: |
          jq -e --arg want "agent-run-$GITHUB_RUN_ID" --arg base "$BASE" \
            'all(.items[] | select(.type == "create_pull_request"); .branch == $want)
             and all(.items[] | select(.type == "push_to_pull_request_branch"); .branch == $base)' "$GH_AW_TMP/agent_output.json"
      # The commit the patch says it starts from is the hand-back's own
      # claim: it has to be one the target's base branch holds. Applied
      # there with a plain `git am`, which takes a patch only where it
      # applies exactly, the patch must change the files `check` saw it
      # name and no others, before the handlers apply and push it. A
      # report that cannot be read stops the job: only one that says
      # there is no patch skips this.
      # Materialize both lists so pipefail catches extraction failures;
      # process substitutions would hide them. check rejects control
      # characters in paths, and quotePath=false keeps UTF-8 names literal.
      # A replacement series is rebuilt by policy's binary.
      - name: Apply the patch on its own base, and compare what changed with what was checked
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' && fromJSON(inputs.policy).apply-staged != 'true' }}
        id: trial
        env:
          CURRENT_BASE: ${{ steps.fork.outputs.current-base }}
        run: |
          patch=$(jq -c .patch "$REPORT")
          [ "$patch" != null ] || exit 0
          base=$(jq -er '.patch.base_commit' "$REPORT")
          if jq -e '.patch.commit_files != null' "$REPORT" > /dev/null; then
            chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
            "$RUNNER_TEMP/apply-binary/agentic-job" replacement trial --report "$REPORT" \
              --series "$GH_AW_TMP/replacement.json" --config "$GH_AW_TMP/config.json" \
              --current-base "$CURRENT_BASE" --remote "https://github.com/$REPO" --temp "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge-base --is-ancestor "$base" refs/agentic-job/target-base ||
            { echo "::error::the patch starts from $base, which is not a commit of the $BASE fetched above"; exit 1; }
          git worktree add --quiet --detach "$RUNNER_TEMP/trial" "$base"
          git -C "$RUNNER_TEMP/trial" am --keep-cr "$GH_AW_TMP/$(jq -er '.patch.file' "$REPORT")"
          git -C "$RUNNER_TEMP/trial" -c core.quotePath=false diff --name-only --no-renames "$base" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          jq -er '.patch.files | select(type == "array" and length > 0) | .[]' "$REPORT" | LC_ALL=C sort > "$RUNNER_TEMP/checked-files"
          diff "$RUNNER_TEMP/actual-files" "$RUNNER_TEMP/checked-files"
          echo "tree=$(git -C "$RUNNER_TEMP/trial" rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          git worktree remove --force "$RUNNER_TEMP/trial"
      # Whether the work is complete, which only a policy whose bounds set
      # `ready_when_complete` acts on (docs/safe-outputs.md#ready-or-draft).
      # A run stopped at a limit is not, whatever it handed back, and
      # neither is one whose pull request or push holds the checkpoint
      # check reported. The reason is check's word or this file's, chosen
      # by the exit state, which does not tell a request, task or spending
      # limit apart: `cap` is all three.
      - name: Decide whether the work is complete
        id: complete
        env:
          EXIT: ${{ fromJSON(inputs.policy).proposals-artifact != '' && '0' || fromJSON(inputs.agent).outputs.exit }}
        run: |
          case "${EXIT:-0}" in
            0) checkpoint=$(jq -r '.checkpoint.reason // ""' "$REPORT") ;;
            124) checkpoint=runtime ;;
            *) checkpoint=cap ;;
          esac
          case "$checkpoint" in ''|budget|runtime|cap|incomplete) ;; *) echo '::error::check reported an unknown checkpoint reason'; exit 1 ;; esac
          ready=$(jq --arg checkpoint "$checkpoint" \
            '$checkpoint == "" and ([.create_pull_request, .push_to_pull_request_branch] | any(.ready_when_complete == true))' "$GH_AW_TMP/config.json")
          printf '%s\n' "checkpoint=$checkpoint" "ready=$ready" | tee -a "$GITHUB_OUTPUT"
      # The collector's configuration with how to apply added: an unsigned
      # push keeps the author (a signed one is made through the API, as the
      # token's owner), a pull request that fails is not to become an
      # issue, and the branch goes to the fork (or the owner's repository
      # itself, as the fork step decided), which only it may name.
      # Without a fork there is no pull request to open or push to, and no
      # handler for either: one without its `head-repo` would push to the
      # output repository. Each input is one string of the result.
      #
      # The push handler takes the pull request only if its head repository
      # is `head-repo`, applies the patch on the head the run started from
      # (the patch's base, which check held to the policy's), and pushes
      # without force: a branch that moved on since refuses it, unless the
      # guard below finds the exact checked change already applied. One
      # rewritten since the trial above fetched it,
      # so that the head is no longer in it, the handler applies the patch
      # on instead, as only someone who may push to the head repository can
      # do; the last step then fails the job.
      - name: Write the handlers' configuration
        env:
          FORK: ${{ steps.fork.outputs.repo }}
          READY: ${{ steps.complete.outputs.ready }}
          BRANCH_PREFIX: ${{ fromJSON(inputs.policy).branch-prefix }}
          PARTIAL: >-
            ${{ fromJSON(inputs.agent).outputs.exit == '124' && '[partial: stopped at the timeout] '
                || fromJSON(inputs.agent).outputs.exit == '3' && '[partial: stopped at a limit] ' || '' }}
          TITLE_PREFIX: ${{ fromJSON(inputs.policy).title-prefix }}
          COMMENT_TARGET: ${{ fromJSON(inputs.policy).comment-target }}
          PULL_REQUEST: '{"signed_commits": false, "fallback_as_issue": false, "preserve_branch_name": true, "auto_close_issue": false}'
          # A push that fails is not to become a pull request, and an
          # empty one fails. Workflow edits require the exact-repository
          # exemption and the owned fork checked above, with Actions off.
          # Unsigned, as above. No title prefix: the push handler would
          # take it for one the pull request's title must have.
          PUSH: '{"signed_commits": false, "fallback_as_pull_request": false, "if_no_changes": "error"}'
        # A pull request's dot-folder exemption becomes the handler's
        # `protected_dot_folder_excludes`, filtered again to `.github`, the
        # only one policy admits; `protect_top_level_dot_folders` stays
        # true, so every other dot-folder stays protected there too. Push
        # additionally needs allow_workflows for this same exemption.
        # `checkout_mapping` tells the push handler that the output
        # repository's checkout is the workspace. From a caller in another
        # repository it would otherwise look for that checkout itself, and
        # refuse the output repository as not in `allowed_repos`, which
        # names the fork alone. An update's `allow_*` settings repeat the
        # bounds' `fields` where the pinned handlers honor them; they do
        # not for an issue's title and status, or a request's `draft` and
        # `update_branch`, so check refuses every field the bounds leave out.
        # The bounds' `protected_paths` globs are check's alone (gh-aw has no
        # such setting), so they are taken out like `ready_when_complete`.
        # A pull request opens ready only for complete work, decided above
        # (unset, as in a test of this step alone, means a draft);
        # gh-aw's handler takes `draft` from here, never from the request.
        #
        # A discussion goes to the run's repository, in the category the
        # bounds pinned and check held requests to. It does not fall back to
        # an issue, which create_issue's bounds would not cover, nor close
        # earlier discussions.
        #
        # A comment is hidden only on the run's triggering issue or pull
        # request in the item repository: its number is the handler's
        # target, as for gh-aw's `target: triggering`, which reads the
        # event apply was started by and so misses a dispatched run's item.
        # The handler looks the comment up and refuses one on another item
        # (with a number for its target it does not ask which kind of item
        # that is: issues, pull requests and discussions share their
        # numbers) or in another repository; no `allowed_repos` widens that.
        # A run without one item gets no handler, never `*`: check refused
        # every request of it, and the policy allowing the type is no reason
        # to fail the run's other outputs.
        #
        # Review comments, replies and resolved threads are held the same
        # way to the run's item, as a pull request of the item repository.
        # With a number for its target, the create handler comments on that
        # pull request's diff whatever a request names, and the resolve
        # handler looks the thread up and refuses one on another pull
        # request or in another repository. The reply handler posts to the
        # forge's replies URL under that number, and the guard below
        # refuses a reply to a comment on another pull request first.
        # Without a submit_pull_request_review the comments go in one
        # review of event COMMENT: no verdict.
        #
        # The check run handler names the run from `name`, which the bounds
        # pinned, and with `target: "*"` posts on the head of the pull
        # request check held to one number. It posts in the calling
        # repository whatever `target-repo` says, so a run whose `repo` is
        # another one would put a check run where nothing bounded it.
        run: |
          if jq -e 'has("create_check_run")' "$GH_AW_TMP/config.json" > /dev/null && [[ "${REPO,,}" != "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::error::create_check_run posts in the calling repository, $GITHUB_REPOSITORY, not the run's repository $REPO"
            exit 1
          fi
          jq --arg ready "${READY:-}" --arg repo "$OUTPUT_REPO" --arg base "$BASE" --arg branch "$BRANCH_PREFIX" --arg title "$PARTIAL$TITLE_PREFIX" \
            --arg target "$COMMENT_TARGET" --arg item_repo "$ITEM_REPO" --arg action_repo "$REPO" --argjson pr "$PULL_REQUEST" --argjson push "$PUSH" --arg fork "$FORK" '
            (if $fork == "" then del(.create_pull_request, .push_to_pull_request_branch) else . end)
            | (select(has("create_pull_request")).create_pull_request) |= (.draft = ($ready != "true") | del(.ready_when_complete, .protected_paths))
            | (select(has("push_to_pull_request_branch")).push_to_pull_request_branch) |= del(.ready_when_complete, .protected_paths)
            | (select(has("create_pull_request")).create_pull_request) |=
                ((.unprotected_dot_folders // [] | map(select(. == ".github"))) as $excludes | del(.unprotected_dot_folders)
                 | if $excludes != [] then .protected_dot_folder_excludes = $excludes else . end)
            | (select(has("push_to_pull_request_branch")).push_to_pull_request_branch) |=
                ((.unprotected_dot_folders // [] | map(select(. == ".github"))) as $excludes | del(.unprotected_dot_folders, .protected_dot_folder_excludes, .allow_workflows)
                 | if $excludes != [] then .protected_dot_folder_excludes = $excludes | .allow_workflows = true else . end)
            | (select(has("create_pull_request")).create_pull_request) += $pr
              + {"target-repo": $repo, base_branch: $base, branch_prefix: $branch, title_prefix: $title,
                 "head-repo": $fork, allowed_repos: [$fork]}
            | (select(has("push_to_pull_request_branch")).push_to_pull_request_branch) += $push
              + {"target-repo": $repo, "head-repo": $fork, allowed_repos: [$fork], checkout_mapping: {($repo | ascii_downcase): "."}}
            | (select(has("add_comment")).add_comment) += {"target-repo": $item_repo, target: $target}
            | if has("hide_comment") | not then .
              elif $target | test("^[1-9][0-9]*$") then .hide_comment += {"target-repo": $item_repo, target: $target}
              else del(.hide_comment) end
            | reduce ("create_pull_request_review_comment", "reply_to_pull_request_review_comment", "resolve_pull_request_review_thread") as $type (.;
                if has($type) | not then .
                elif $target | test("^[1-9][0-9]*$") then .[$type] += {"target-repo": $item_repo, target: $target}
                else del(.[$type]) end)
            | (select(has("create_issue")).create_issue) += {"target-repo": $repo, title_prefix: $title}
            | (select(has("create_discussion")).create_discussion) += {"target-repo": $action_repo, fallback_to_issue: false, close_older_discussions: false}
            | (select(has("close_issue")).close_issue) += {"target-repo": $action_repo, target: "*", issue_intent: false, allow_body: true}
            | (select(has("add_labels")).add_labels) += {"target-repo": $action_repo, target: "*", issue_intent: false, create_if_missing: false}
            | (select(has("remove_labels")).remove_labels) += {"target-repo": $action_repo, target: "*"}
            | (select(has("update_issue")).update_issue) |= . + {"target-repo": $action_repo, target: "*",
                allow_body: any(.fields[]; . == "body")}
            | (select(has("update_pull_request")).update_pull_request) |= . + {"target-repo": $action_repo, target: "*",
                allow_title: any(.fields[]; . == "title"), allow_body: any(.fields[]; . == "body"), update_branch: false}
            | (select(has("mark_pull_request_as_ready_for_review")).mark_pull_request_as_ready_for_review) += {"target-repo": $action_repo, target: "*"}
            | (select(has("add_reviewer")).add_reviewer) += {"target-repo": $action_repo, target: "*"}
            | (select(has("assign_to_user")).assign_to_user) += {"target-repo": $action_repo, target: "*", issue_intent: false, unassign_first: false}
            | (select(has("close_pull_request")).close_pull_request) += {"target-repo": $action_repo, target: "*"}
            | (select(has("link_sub_issue")).link_sub_issue) += {"target-repo": $action_repo, target: "*"}
            | (select(has("update_project")).update_project) += {"target-repo": $action_repo}
            | (select(has("create_check_run")).create_check_run) += {target: "*"}
          ' "$GH_AW_TMP/config.json" > "$GH_AW_TMP/handler-config.json"
          echo "GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG=$(jq -c . "$GH_AW_TMP/handler-config.json")" >> "$GITHUB_ENV"
      # A review's inline findings, when apply posts its verdict as the
      # comment (review.yml submitted no review), go in that comment's body
      # after the verdict line, not as a second review without a verdict
      # (docs/review.md). Check folded them (`agentic-job review fold`) and
      # bounded the folded length; its upload, held to the digest above,
      # has both. Before the guard below, so a re-run names the same comment.
      - name: Put a review's inline findings in its comment
        if: ${{ fromJSON(inputs.policy).review == 'true' }}
        run: mv "$GH_AW_TMP/folded.json" "$GH_AW_TMP/agent_output.json"
      # The first line of what a partial run opens or posts says so too,
      # in this file's words, chosen by the exit state. A partial run with
      # neither a pull request, an issue nor a comment would leave nothing
      # that says it was stopped, so it is not applied. Nor is a partial
      # run's push: its commit would land on an open pull request with
      # nothing on it to say the work was cut short.
      - name: Mark what a partial run opens or posts
        if: ${{ fromJSON(inputs.policy).proposals-artifact == '' && format('{0}', fromJSON(inputs.agent).outputs.exit) != '0' }}
        env:
          STOPPED: ${{ fromJSON(inputs.agent).outputs.exit == '124' && 'its timeout' || 'a request, task or spending limit, or an error that ended the agent''s turn' }}
        run: |
          jq -e 'all(.items[]; .type != "push_to_pull_request_branch")' "$GH_AW_TMP/agent_output.json" > /dev/null ||
            { echo "::error::the run was stopped at $STOPPED: a partial change is not pushed to a pull request's branch"; exit 1; }
          jq -e 'any(.items[]; .type == "create_pull_request" or .type == "add_comment" or .type == "create_issue" or .type == "close_issue")' "$GH_AW_TMP/agent_output.json" > /dev/null ||
            { echo "::error::the run was stopped at $STOPPED and handed back nothing that could say so"; exit 1; }
          jq --arg note "**Partial work.** The run was stopped at $STOPPED before the task was done; this is what it handed back." \
            '(.items[] | select(.type == "create_pull_request" or .type == "add_comment" or .type == "create_issue" or .type == "close_issue") | .body) |= "\($note)\n\n\(.)"' \
            "$GH_AW_TMP/agent_output.json" > "$RUNNER_TEMP/marked.json"
          mv "$RUNNER_TEMP/marked.json" "$GH_AW_TMP/agent_output.json"
      # A pull request says which issue the caller made the run for, in
      # this file's words. A closing reference lets the scheduler find the
      # implementation instead of starting duplicate work. Cross-repository
      # items are references only; existing batch closing lines stay intact.
      # Before the guard, so the name it digests is the same on a re-run.
      # Only a real patch application can open a PR and has the trusted helper
      # checkout; comment-only and staged runs must not require that checkout.
      # Only the caller names the issue: a pull request is not linked to its
      # comment target, which may be a tracking issue merging must not close.
      # A caller composing policy.yml itself that leaves `issue` out has its
      # pull requests link nothing, so say so where the run is looked at.
      - name: Say which issue a pull request is for
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' && fromJSON(inputs.policy).apply-staged != 'true' }}
        run: |
          if [ -z "$ISSUE" ]; then
            jq -e 'all(.items[]; .type != "create_pull_request")' "$GH_AW_TMP/agent_output.json" > /dev/null ||
              echo "::warning::the pull request names no issue: the caller passed policy.yml no \`issue\`"
            exit 0
          fi
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" link-issue --file "$GH_AW_TMP/agent_output.json" \
            --item-repo "$ITEM_REPO" --output-repo "$OUTPUT_REPO" --issue "$ISSUE"
      # A re-run of this job applies check's accepted outputs again, and
      # gh-aw's handlers would post each comment, issue and pull request
      # again. Each is named by this run, its place and its digest, the
      # digest over the artifact prefix too: the calls of one run share its
      # ID, and two may hand back the same request. The name goes last in
      # the body, after the first line a verdict or a partial run's note
      # needs, and the next step hides it in what it posts; one whose name is
      # already posted is left out, the others are applied, so a re-run
      # completes what an earlier attempt did not. A pull request's name
      # holds the checked patch too, so a different patch is not taken for
      # one applied before. Only what this job's token posts counts (the job
      # token's github-actions[bot], or the user /user names for the PAT;
      # with a PAT that names nobody, nothing counts), only the last
      # name in a body, and check refuses requests holding the name: neither
      # the agent nor a commenter can make a request look applied, not even
      # with text the handlers decode into a name. A pull request's closing
      # comment is looked for the same way, and the pull request closed if it
      # is still open, and an issue's closing comment likewise. Adding
      # labels and setting a project field are the same done twice and are
      # left alone.
      # A discussion is not looked for, and a re-run posts it again.
      # A comment is hidden again, even one a maintainer unhid since.
      # Review comments and replies are posted again; a thread resolved
      # before is left as it is.
      # Policy's binary does this (`agentic-job applied`, in
      # crates/agentic-job/src/apply/applied.rs), with the token as the fork
      # step's: it refuses a close_issue naming a pull request or a
      # transferred issue, a reply off the run's pull request and a pull
      # request without a fork before writing anything, and pushes a
      # replacement series itself, as `agentic-job replacement push` does.
      - name: Leave out what an earlier attempt applied
        id: applied
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          GH_TOKEN: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUBLICATION_TOKEN }}
          COMMENT_TARGET: ${{ fromJSON(inputs.policy).comment-target }}
          BRANCH_PREFIX: ${{ fromJSON(inputs.policy).branch-prefix }}
          ARTIFACT_PREFIX: ${{ fromJSON(inputs.policy).artifact-prefix }}
          # Where a pull request's branch is pushed: the step above's fork, or
          # a push's head repository.
          FORK: ${{ steps.fork.outputs.repo }}
          # Whether GH_TOKEN is the PAT.
          TOKEN_IS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT != '' }}
          TREE: ${{ steps.trial.outputs.tree }}
          REPLACEMENT_HEAD: ${{ steps.trial.outputs.head }}
        run: |
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" applied --dir "$GH_AW_TMP" --report "$REPORT" \
            --output-repo "$OUTPUT_REPO" --repo "$REPO" --item-repo "$ITEM_REPO" --comment-target "$COMMENT_TARGET" \
            --branch-prefix "$BRANCH_PREFIX" --artifact-prefix "$ARTIFACT_PREFIX" --fork "$FORK" --base "$BASE" \
            --tree "$TREE" --replacement-head "$REPLACEMENT_HEAD" --token-is-pat "$TOKEN_IS_PAT"
      # Every project field is read from the live project before either
      # publisher below writes anything: a field or value the pinned
      # handler would skip, create or misaddress refuses the whole run.
      # The writes it admits are counted for gh-aw's step, which holds its
      # project writes to them.
      - name: Check the project fields before anything is published
        id: project
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUBLICATION_TOKEN }}
          script: |
            // The pinned handler otherwise reports success for skipped values.
            const pending = new Map();
            const writeKey = variables => JSON.stringify([variables.projectId, variables.fieldId, variables.value]);
            const project = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).update_project;
            const items = JSON.parse(require('node:fs').readFileSync(`${process.env.GH_AW_TMP}/agent_output.json`, 'utf8')).items;
            for (const item of items.filter(item => item.type === 'update_project')) {
              if (!project?.projects.includes(item.project)) throw new Error("project is outside the apply bounds");
              const [, kind, login, , number] = new URL(item.project).pathname.split('/');
              const owner = kind === 'orgs' ? 'organization' : 'user';
              const found = await github.graphql(`query($login: String!, $number: Int!) {
                ${owner}(login: $login) { projectV2(number: $number) { id } }
              }`, { login, number: Number(number) });
              const projectId = found[owner]?.projectV2?.id;
              if (!projectId) throw new Error("bounded project could not be resolved");
              const fields = [];
              let after = null;
              do {
                const result = await github.graphql(`query($projectId: ID!, $after: String) {
                  node(id: $projectId) { ... on ProjectV2 { fields(first: 100, after: $after) {
                    nodes {
                      ... on ProjectV2Field { id name dataType }
                      ... on ProjectV2SingleSelectField { id name dataType options { id name } }
                      ... on ProjectV2IterationField { id name dataType configuration { iterations { id title } } }
                    }
                    pageInfo { hasNextPage endCursor }
                  } } }
                }`, { projectId, after });
                const page = result.node.fields;
                fields.push(...page.nodes);
                if (page.pageInfo.hasNextPage && (!page.pageInfo.endCursor || page.pageInfo.endCursor === after)) {
                  throw new Error("project field pagination did not advance");
                }
                after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
              } while (after);
              for (const [name, raw] of Object.entries(item.fields)) {
                const matches = fields.filter(field => field.name === name);
                if (!project.fields.includes(name) || matches.length !== 1) throw new Error(`project field ${name} is not an exact existing bounded field`);
                const field = matches[0];
                const normalized = name.split(/[\s_-]+/).map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
                if (normalized.toUpperCase() === 'REPOSITORY' || fields.find(candidate => candidate.name.toLowerCase() === normalized.toLowerCase())?.id !== field.id) {
                  throw new Error(`project field ${name} cannot be addressed exactly by the pinned handler`);
                }
                let value;
                if (field.dataType === 'NUMBER') {
                  const number = typeof raw === 'number' ? raw : Number(raw);
                  if (!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(String(raw).trim()) || !Number.isFinite(number)) throw new Error(`invalid number for project field ${name}`);
                  value = { number };
                } else if (field.dataType === 'SINGLE_SELECT' || field.dataType === 'ITERATION') {
                  const iteration = field.dataType === 'ITERATION';
                  const options = iteration ? field.configuration?.iterations : field.options;
                  const option = options?.find(option => (iteration ? option.title : option.name).toLowerCase() === String(raw).toLowerCase());
                  if (!option) throw new Error(`unknown option or iteration for project field ${name}`);
                  value = iteration ? { iterationId: option.id } : { singleSelectOptionId: option.id };
                } else if (field.dataType === 'DATE') {
                  const date = String(raw);
                  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(Date.parse(date)) || new Date(date).toISOString().slice(0, 10) !== date) throw new Error(`invalid date for project field ${name}`);
                  value = { date };
                } else if (field.dataType === 'TEXT') {
                  value = { text: String(raw) };
                } else {
                  throw new Error(`unsupported type for project field ${name}`);
                }
                const key = writeKey({ projectId, fieldId: field.id, value });
                pending.set(key, (pending.get(key) ?? 0) + 1);
              }
            }
            // The project writes gh-aw's step may make, each counted.
            require('node:fs').writeFileSync(`${process.env.GH_AW_TMP}/project-writes.json`, JSON.stringify([...pending]));
      # The output types the bounds route away from gh-aw's handlers
      # (`native_handlers`, off by default), from check's policy.json.
      - name: Which outputs agentic-job publishes
        id: route
        run: echo "native=$(jq -r '(.native_handlers // []) | length > 0' "$GH_AW_TMP/policy.json")" >> "$GITHUB_OUTPUT"
      # Policy's binary publishes the routed requests as gh-aw's handlers
      # would (docs/safe-outputs.md#agentic-jobs-own-handlers), with the
      # same token, settings and guard, and the same records, before
      # them. It leaves gh-aw's step the rest in gh-aw-output.json, written
      # before it publishes anything and not at all when it refuses the
      # run: no request is published by both, and a refusal publishes
      # nothing. A pull request that fails has the comments there warn of
      # it, as gh-aw's manager would. It pushes only to the `head-repo`
      # the fork step chose.
      - name: Publish the outputs routed to agentic-job
        id: publish
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' && steps.route.outputs.native == 'true' && steps.project.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUBLICATION_TOKEN }}
          GH_AW_WORKFLOW_ID: agentic-job
          GH_AW_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          GH_AW_WORKFLOW_NAME: ${{ github.workflow }}
          GH_AW_SAFE_OUTPUTS_URLS: allowed-or-code-region
          GH_AW_ALLOWED_DOMAINS: ${{ fromJSON(inputs.policy).allowed-domains }}
        run: |
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" publish --policy "$GH_AW_TMP/policy.json" --outputs "$GH_AW_TMP/agent_output.json" \
            --handlers "$GH_AW_TMP/handler-config.json" --checked "$GH_AW_TMP" --server "$GITHUB_SERVER_URL" \
            --remainder "$GH_AW_TMP/gh-aw-output.json" --made "$MADE" --errors "$GH_AW_TMP/publish-errors.json"
      # gh-aw's handler can open an issue in a pull request's place
      # whatever `fallback_as_issue` says (where the forge refuses it to
      # Actions, for one), so no client the handlers use opens more issues
      # than the run's create_issue outputs allow, none for a run without
      # that type. A handler that failed fails this step, and the last step
      # says what that means for the job.
      - name: Apply the outputs with gh-aw's handlers
        id: apply
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # What the step above left gh-aw where it routes any type: none
          # when that file is not there.
          GH_AW_AGENT_OUTPUT: ${{ env.GH_AW_TMP }}/${{ steps.route.outputs.native == 'true' && 'gh-aw-output.json' || 'agent_output.json' }}
          GH_AW_WORKFLOW_ID: agentic-job
          # The handlers end each body they post with this run's job (gh-aw's
          # execution provenance), and refuse to post without it.
          GH_AW_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          GH_AW_WORKFLOW_NAME: ${{ github.workflow }}
          # The handlers sanitize text again: the collector's policy, in check.yml.
          GH_AW_SAFE_OUTPUTS_URLS: allowed-or-code-region
          GH_AW_ALLOWED_DOMAINS: ${{ fromJSON(inputs.policy).allowed-domains }}
          PROJECT_CHECKED: ${{ steps.project.outcome }}
        with:
          # Use the checkout's credential selection for API writes too.
          github-token: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUBLICATION_TOKEN }}
          script: |
            const dir = `${process.env.RUNNER_TEMP}/gh-aw/actions`;
            // The footer names the workflow twice; handback check allows for
            // a name this long (safe-outputs/validation.mjs), so a longer
            // caller's is cut rather than push a comment over E006.
            const MAX_WORKFLOW_NAME = 100;
            const workflowName = process.env.GH_AW_WORKFLOW_NAME;
            if (workflowName.length > MAX_WORKFLOW_NAME) {
              process.env.GH_AW_WORKFLOW_NAME = `${workflowName.slice(0, MAX_WORKFLOW_NAME - 1).replace(/[\uD800-\uDBFF]$/, "")}…`;
            }
            // Issues may be opened up to the run's create_issue count, by any handler;
            // one is counted when it is made, so a request gh-aw retries counts once.
            let issues = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).create_issue?.max ?? 0;
            const creates = (options, what) => options.method === "POST" && new RegExp(`^/repos/[^/]+/[^/]+/${what}$`).test(options.url);
            let projectRefusal = false;
            // The project fields' step refused the run before either
            // publisher wrote anything; it is refused here, as it fails the job.
            if (process.env.PROJECT_CHECKED !== 'success') {
              core.setOutput("project-refused", "true");
              throw new Error("the project fields were refused before anything was published");
            }
            const pending = new Map(JSON.parse(require('node:fs').readFileSync(`${process.env.GH_AW_TMP}/project-writes.json`, 'utf8')));
            const writeKey = variables => JSON.stringify([variables.projectId, variables.fieldId, variables.value]);
            const guarded = client => {
              const project = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).update_project;
              if (project) {
                // gh-aw normalizes names and creates missing fields. Refuse
                // schema writes and IDs not read with an exact bounded name.
                const graphql = client.graphql.bind(client);
                const admitted = new Set();
                client.graphql = async (query, variables) => {
                  if (/\bcreateProjectV2Field\b/.test(query) ||
                      (/\bupdateProjectV2ItemFieldValue\b/.test(query) && (!admitted.has(variables.fieldId) || !(pending.get(writeKey(variables)) > 0)))) {
                    projectRefusal = true;
                    throw new Error("project schema or field ID is outside the named field bounds");
                  }
                  const result = await graphql(query, variables);
                  if (/\bupdateProjectV2ItemFieldValue\b/.test(query)) {
                    if (!result?.updateProjectV2ItemFieldValue?.projectV2Item?.id) {
                      projectRefusal = true;
                      throw new Error("project field update did not complete");
                    }
                    const key = writeKey(variables);
                    pending.set(key, pending.get(key) - 1);
                  }
                  for (const field of result?.node?.fields?.nodes ?? []) {
                    if (project.fields.includes(field.name)) admitted.add(field.id);
                  }
                  return result;
                };
              }
              const discussion = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).create_discussion;
              if (discussion) {
                // gh-aw's handler posts in Announcements, or the first
                // category, when it does not find the pinned one (renamed,
                // say, or past the 20 it reads). Only a category read back
                // under the pin, as the handler matches it, may be posted in.
                const graphql = client.graphql.bind(client);
                const pin = discussion.category.toLowerCase();
                const pinned = new Set();
                client.graphql = async (query, variables) => {
                  if (/\bcreateDiscussion\b/.test(query) && !pinned.has(variables?.categoryId)) {
                    throw new Error("the discussion category is not the one the bounds pin");
                  }
                  const result = await graphql(query, variables);
                  for (const category of result?.repository?.discussionCategories?.nodes ?? []) {
                    if (category.id === discussion.category || category.name?.toLowerCase() === pin || category.slug?.toLowerCase() === pin) {
                      pinned.add(category.id);
                    }
                  }
                  return result;
                };
              }
              client.hook.before("request", options => {
                if (creates(options, "issues") && issues <= 0) throw new Error("no issue beyond this run's create_issue outputs is opened");
                // The handlers strip HTML comments from bodies; the name the
                // step before put last in a body is hidden only as it is sent.
                if (typeof options.body === "string") {
                  options.body = options.body.replace(/^(agentic-job-applied: \d+\/\d+\/[0-9a-f]{16})$(?![\s\S]*^agentic-job-applied:)/m, "<!-- $1 -->");
                }
              });
              client.hook.after("request", (response, options) => {
                if (creates(options, "issues")) issues -= 1;
              });
              return client;
            };
            // The handlers log the patch's first lines and git's output,
            // the agent's text, and the runner reads a workflow command in
            // any line of this step's output. A commit message could set
            // an output no handler wrote (created_pr_url, the run's result
            // in conclude's comment) or mask text from the log. Everything
            // the handlers log and run goes through the escape `run` uses
            // for the agent's own log; the step's own `core` stays as it is.
            const { escapingCore, escapingExec } = require(`${process.env.GITHUB_WORKSPACE}/apply-source/workflow/workflow-commands.cjs`);
            require(`${dir}/setup_globals.cjs`).setupGlobals(escapingCore(core), guarded(github), context, escapingExec(exec), io, (...args) => guarded(getOctokit(...args)));
            await require(`${dir}/safe_output_handler_manager.cjs`).main();
            if (projectRefusal || [...pending.values()].some(count => count !== 0)) {
              core.setOutput("project-refused", "true");
              throw new Error("a project write was refused by the apply bounds");
            }
      # A staged run's preview of what the handlers would have taken. The
      # requests and paths are the agent's text: escaped into one <pre>,
      # so that a link or image in them is not rendered in the summary
      # (an image there is fetched by whoever opens it). The patch itself
      # is in the checked-outputs artifact.
      - name: Show what would be applied
        id: staged
        if: ${{ fromJSON(inputs.policy).apply-staged == 'true' }}
        run: |
          # Pretty JSON alone in the log: each line starts with a quote or a
          # bracket, so no agent-chosen line is read as a workflow command.
          jq .items "$GH_AW_TMP/agent_output.json"
          {
            echo '### Staged: nothing was applied'
            echo
            echo 'The outputs check accepted, as the handlers would have taken them:'
            echo
            jq .items "$GH_AW_TMP/agent_output.json" | jq -Rrs '@html "<pre>\(.)</pre>"'
            if jq -e '.patch.files | length > 0' "$REPORT" > /dev/null; then
              echo
              echo "The patch's files:"
              echo
              jq -r '.patch.files | join("\n")' "$REPORT" | jq -Rrs '@html "<pre>\(.)</pre>"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Whether the run is blocked rather than failed: check decides
      # (`blocked` in its report, crates/agentic-job/src/check), from
      # missing_data with at most noop beside it and no change.
      - name: Whether the run is blocked
        id: blocked
        if: ${{ always() && (steps.apply.outcome != 'skipped' || steps.staged.outcome != 'skipped') }}
        run: echo "blocked=$(jq -r '.blocked == true' "$REPORT")" >> "$GITHUB_OUTPUT"
      # What was made, for whoever reads the run: `pull_request` is null
      # when none was opened, and `fork` names where its branch went. A
      # staged run made nothing and says so with `staged`.
      - name: Write applied.json
        if: ${{ always() && (steps.apply.outcome != 'skipped' || steps.staged.outcome != 'skipped') }}
        env:
          PR: ${{ steps.publish.outputs.created_pr_number || steps.apply.outputs.created_pr_number || steps.applied.outputs.pull-request-number }}
          PR_URL: ${{ steps.publish.outputs.created_pr_url || steps.apply.outputs.created_pr_url || steps.applied.outputs.pull-request-url }}
          FORK: ${{ steps.fork.outputs.repo }}
          EXIT: ${{ fromJSON(inputs.policy).proposals-artifact != '' && '0' || fromJSON(inputs.agent).outputs.exit }}
          CHECKPOINT: ${{ steps.complete.outputs.checkpoint }}
          STAGED: ${{ fromJSON(inputs.policy).apply-staged }}
          BLOCKED: ${{ steps.blocked.outputs.blocked }}
        run: |
          touch "$MADE"
          [ "$STAGED" != true ] || echo '[]' > "$GH_AW_TMP/skipped.json"
          jq -n --slurpfile made "$MADE" --slurpfile handlers "$GH_AW_TMP/handler-config.json" --arg repo "$OUTPUT_REPO" \
            --slurpfile skipped "$GH_AW_TMP/skipped.json" --arg pr "$PR" --arg url "$PR_URL" --arg exit "$EXIT" --arg fork "$FORK" \
            --arg checkpoint "$CHECKPOINT" --arg staged "$STAGED" --arg blocked "${BLOCKED:-}" '
            {schema: "agentic-job-applied/v1", repo: $repo, staged: ($staged == "true"), partial: ($exit != "0"),
             blocked: ($blocked == "true"), made: $made,
             checkpoint: (if $checkpoint == "" then null else $checkpoint end),
             fork: (if $fork == "" then null else $fork end),
             already_applied: $skipped[0],
             pull_request: (if $pr == "" then null else {number: ($pr | tonumber), url: $url} end),
             handlers: $handlers[0]}' | tee "$GH_AW_TMP/applied.json"
      # Export the result for conclude's single status comment. No-result
      # reasons are agent text: sanitize and quote them before exporting.
      # Missing data is an incomplete task, not a successful decline.
      # Policy's binary (src/apply/result.rs) writes the outputs and the
      # summary; it makes no forge writes, so the step has no token.
      # Conclude edits the single opted-in status comment with the result.
      - name: Say where what the run made is
        id: result
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        continue-on-error: true
        env:
          # As the handlers sanitize text: the collector's policy, in check.yml.
          GH_AW_SAFE_OUTPUTS_URLS: allowed-or-code-region
          GH_AW_ALLOWED_DOMAINS: ${{ fromJSON(inputs.policy).allowed-domains }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" result --dir "$GH_AW_TMP" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # gh-aw logs a handler's error inside the apply step, which does not
      # fail the job (continue-on-error), so the job's annotations and the
      # status comment would say only how many outputs failed. Its error
      # report holds each failed output's type and error, not the request:
      # bounded and neutralized as check's refusal reasons are, as a
      # handler's error can quote the agent's text. The reader is policy's
      # binary, fetched above for every applied run; it reads agentic-job's
      # own handlers' report, of the same shape, as well.
      - name: Show why a handler failed
        id: handler-errors
        if: ${{ !cancelled() && (steps.apply.outcome == 'failure' || steps.publish.outcome == 'failure') }}
        continue-on-error: true
        run: |
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          "$RUNNER_TEMP/apply-binary/agentic-job" diagnostics handler-errors "$GH_AW_TMP/publish-errors.json" "$GH_AW_TMP/safe-output-errors.json" \
            --output "$GITHUB_OUTPUT"
      # A run that asked for a pull request and has none did not do what
      # it was for, and neither did one of whose outputs a handler failed,
      # nor one that handed back missing_data beside anything but noop. A
      # blocked one is a result, not a failure.
      - name: Every output was applied
        id: applied-all
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          OUTCOME: ${{ steps.apply.outcome }}
          FAILED: ${{ steps.apply.outputs.items_failed }}
          # agentic-job's own handlers, where the bounds route a type to them.
          PUBLISHED: ${{ steps.publish.outcome }}
          PUBLISH_FAILED: ${{ steps.publish.outputs.items_failed }}
          PROJECT_REFUSED: ${{ steps.apply.outputs.project-refused }}
          TREE: ${{ steps.trial.outputs.tree }}
          FORK: ${{ steps.fork.outputs.repo }}
          REPLACEMENT_HEAD: ${{ steps.trial.outputs.head }}
          MISSING_DATA: ${{ steps.result.outputs.missing-data }}
          BLOCKED: ${{ steps.blocked.outputs.blocked }}
        run: |
          [ "$PROJECT_REFUSED" != true ] || { echo "::error::a project write was refused"; exit 1; }
          if [ "${BLOCKED:-}" = true ]; then
            echo "::notice::the run is blocked: it handed back missing_data and no change; see the run summary for what it needs"
          elif [ "${MISSING_DATA:-}" = true ]; then
            echo "::error::the run handed back no result because required data was missing; see the run summary"; exit 1
          fi
          # gh-aw counts a push its handler skipped as no failure: the
          # branch itself, in the fork, has to hold the commit, on the head
          # it was for.
          if jq -e 'any(.items[]; .type == "push_to_pull_request_branch")' "$GH_AW_TMP/agent_output.json" > /dev/null ||
             jq -e 'any(.already_applied[]; .type == "push_to_pull_request_branch")' "$GH_AW_TMP/applied.json" > /dev/null; then
            head=$(jq -r '.push_to_pull_request_branch.head' "$GH_AW_TMP/config.json")
            git fetch --no-tags "https://github.com/$FORK" "+refs/heads/$BASE:refs/agentic-job/pushed"
            if [ -n "$REPLACEMENT_HEAD" ]; then
              [ "$(git rev-parse refs/agentic-job/pushed)" = "$REPLACEMENT_HEAD" ] || { echo '::error::the replacement head changed'; exit 1; }
            else
            [ "$(git show -s --format=%P refs/agentic-job/pushed)" = "$head" ] && [ "$(git rev-parse 'refs/agentic-job/pushed^{tree}')" = "$TREE" ] ||
              { echo "::error::$BASE of $FORK does not hold the checked change as one commit on $head"; exit 1; }
            fi
          fi
          asked=$(jq '[.items[] | select(.type == "create_pull_request")] | length' "$GH_AW_TMP/agent_output.json")
          opened=$(jq '.pull_request != null' "$GH_AW_TMP/applied.json")
          if [ "${PUBLISHED:-}" = failure ]; then
            echo "::error::agentic-job's handlers failed ${PUBLISH_FAILED:-or refused all} of the routed outputs in $OUTPUT_REPO"
          fi
          if [ "$OUTCOME" != success ] || [ "${PUBLISHED:-}" = failure ] || { [ "$asked" != 0 ] && [ "$opened" != true ]; }; then
            echo "::error::the handlers ended in $OUTCOME with ${FAILED:-no count of} failed outputs in $OUTPUT_REPO (pull requests asked for: $asked, opened: $opened)"; exit 1
          fi
          # Only now, with nothing else wrong, is the run blocked rather than failed.
          if [ "${BLOCKED:-}" = true ]; then echo blocked=true >> "$GITHUB_OUTPUT"; fi
      # The policy's secondary pull request (docs/safe-outputs.md), once
      # the run's own outputs are applied, and only where check reported a
      # request or patch for it: policy's binary holds check's report and
      # patch to the policy again and opens it from SAFE_OUTPUTS_PAT's
      # fork. The job token never can, so it gets none. What it printed,
      # its `error:` lines included (each one line, escaped), goes into
      # the summary as code; the status comment says only that it failed.
      - name: Open the secondary pull request
        id: secondary
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -e --slurpfile policy "$GH_AW_TMP/policy.json" '($policy[0].secondary_pull_request.repo // null) as $repo |
            $repo != null and (.secondary_patch != null or any(.items[]; .type == "create_pull_request" and .repo == $repo))' "$REPORT" > /dev/null || exit 0
          chmod +x "$RUNNER_TEMP/apply-binary/agentic-job"
          state=0
          "$RUNNER_TEMP/apply-binary/agentic-job" secondary-pull-request --policy "$GH_AW_TMP/policy.json" --checked "$GH_AW_TMP" \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" > "$RUNNER_TEMP/secondary.log" 2>&1 || state=$?
          cat "$RUNNER_TEMP/secondary.log"
          { printf '### The secondary pull request\n\n'; sed 's/^/    /' "$RUNNER_TEMP/secondary.log"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$state" = 0 ] || { echo failed=true >> "$GITHUB_OUTPUT"; echo "::error::the secondary pull request was not opened; the summary says why"; exit 1; }
      # A continuation under `ready_when_complete`: once its push is on the
      # branch, the pull request is marked ready if the work is complete,
      # and made a draft again at a checkpoint. This is the one place apply
      # takes a pull request out of draft. It needs no bound of its own:
      # what decides is the run's exit state and check's report, not a
      # request, and the review job remains the merge gate. A partial run's
      # push is not applied at all (above).
      - name: Mark a continued pull request ready, or a draft at a checkpoint
        if: ${{ fromJSON(inputs.policy).apply-staged != 'true' }}
        env:
          GH_TOKEN: ${{ inputs.role-bindings == '' && (secrets.SAFE_OUTPUTS_PAT || github.token) || secrets.PUBLICATION_TOKEN }}
          READY: ${{ steps.complete.outputs.ready }}
        run: |
          "$RUNNER_TEMP/apply-binary/agentic-job" push finish --dir "$GH_AW_TMP" --repo "$OUTPUT_REPO" --ready "$READY"
      # Include the final readiness decision, including a hold/read failure.
      - id: upload
        if: ${{ always() && (steps.apply.outcome != 'skipped' || steps.staged.outcome != 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.policy).artifact-prefix }}applied
          path: ${{ env.GH_AW_TMP }}/applied.json
          retention-days: 90
          if-no-files-found: error

  # How an opted-in run ended, for whoever started it: the status
  # comment `notify` posted is edited to say so, or a reaction says it
  # where the caller asked for reactions alone. The results of the jobs
  # are this workflow's own; the exit state and the pull request's
  # number are numbers.
  conclude:
    needs: apply
    if: ${{ always() && ((fromJSON(inputs.policy).notify != 'none' && fromJSON(inputs.policy).notified == 'true') || needs.apply.outputs.missing-data == 'true') }}
    concurrency:
      group: agentic-job-status-${{ fromJSON(inputs.policy).notify-repo }}-${{ fromJSON(inputs.policy).notify-item }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(fromJSON(inputs.policy).runner) }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW: ${{ github.workflow }}
    steps:
      # The pieces must be one commit's: a policy call pinned elsewhere
      # would have this commit's code check (or apply) the settings,
      # binary and policy of another, possibly an older, weaker one.
      - name: The policy call is this workflow's commit
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_REPOSITORY" == "$REPOSITORY" && "$SOURCE_SHA" == "$SHA" ]] ||
            { echo "::error::policy.yml ran at $SOURCE_REPOSITORY@$SOURCE_SHA, this workflow at $REPOSITORY@$SHA: pin all pieces to one commit"; exit 1; }
      - name: How the run ended
        id: ended
        env:
          RESULTS: ${{ fromJSON(inputs.policy).proposals-artifact != '' && 'success' || fromJSON(inputs.agent).result }}/${{ fromJSON(inputs.check).result }}/${{ needs.apply.result }}
          EXIT: ${{ fromJSON(inputs.agent).outputs.exit }}
          # The run action's fixed word for what the run ended on, checked
          # again below against the same list before it goes into the text.
          FAILURE_CLASS: ${{ fromJSON(inputs.agent).outputs.failure-class }}
          OVER_BUDGET: ${{ fromJSON(inputs.agent).outputs.over-budget }}
          SECRET_AT: ${{ fromJSON(inputs.agent).outputs.secret-at }}
          PR: ${{ needs.apply.outputs.pull-request }}
          # The status comment is on the item: a pull request of another
          # repository is named with it, or `#N` would link the item's own N.
          PR_REPO: ${{ fromJSON(inputs.policy).item-repo != '' && (fromJSON(inputs.policy).output-repo || github.repository) || '' }}
          NO_RESULT: ${{ needs.apply.outputs.no-result }}
          NO_RESULT_REASON: ${{ needs.apply.outputs.no-result-reason }}
          MISSING_DATA: ${{ needs.apply.outputs.missing-data }}
          BLOCKED: ${{ needs.apply.outputs.blocked }}
          REFUSAL: ${{ fromJSON(inputs.check).outputs.refusal }}
          RESULT_URL: ${{ needs.apply.outputs.result-url }}
          HANDLER_ERRORS: ${{ needs.apply.outputs.handler-errors }}
          SECONDARY_FAILED: ${{ needs.apply.outputs.secondary-failed }}
          STAGED: ${{ fromJSON(inputs.policy).apply-staged }}
        run: |
          [[ "$EXIT" =~ ^[0-9]*$ && "$PR" =~ ^[0-9]*$ && ( -z "$PR_REPO" || "$PR_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ) ]]
          # A fixed word or nothing: the same list as the run action's.
          [[ "$FAILURE_CLASS" =~ ^(timeout|budget|stall|agent_exit|inference_(rate_limited|overloaded|unreachable|quota|unauthorized))$ ]] || FAILURE_CLASS=
          case "$RESULTS" in
            success/success/success) text="✅ [$WORKFLOW]($RUN_URL) ended well${PR:+ and opened pull request $PR_REPO#$PR}." reaction=rocket
              if [ "$NO_RESULT" = true ]; then
                text="✅ [$WORKFLOW]($RUN_URL) ended well and handed back no result."
                if [ -z "$REFUSAL" ] && [ -n "$NO_RESULT_REASON" ]; then
                  printf '%s\n' "no-result-reason=$NO_RESULT_REASON" >> "$GITHUB_OUTPUT"
                fi
              fi ;;
            success/skipped/skipped) text="✅ [$WORKFLOW]($RUN_URL) ended well and handed back nothing to apply." reaction=rocket ;;
            *cancelled*) text="⏹️ [$WORKFLOW]($RUN_URL) was cancelled." reaction=confused ;;
            *) text="❌ [$WORKFLOW]($RUN_URL) failed (agent, check, apply: $RESULTS; the agent's exit state: ${EXIT:-none}${FAILURE_CLASS:+; failure class: $FAILURE_CLASS})." reaction=confused ;;
          esac
          # The hidden marker, at the start of a line, is for whoever reads
          # the comment to schedule work: blocked is neither done nor failed.
          # The reaction is one notify does not put there at the start.
          if [ "${BLOCKED:-}" = true ] && [ "$RESULTS" = success/success/success ]; then
            text="<!-- agentic-job-outcome: blocked -->⏸️ [$WORKFLOW]($RUN_URL) is blocked: it handed back missing_data and no change." reaction=+1
            if [ -z "$REFUSAL" ] && [ -n "$NO_RESULT_REASON" ]; then
              printf '%s\n' "no-result-reason=$NO_RESULT_REASON" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${MISSING_DATA:-}" = true ]; then
            text="❌ [$WORKFLOW]($RUN_URL) handed back no result because required data was missing." reaction=confused
            if [ -z "$REFUSAL" ] && [ -n "$NO_RESULT_REASON" ]; then
              printf '%s\n' "no-result-reason=$NO_RESULT_REASON" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Where, never what: the run action wrote it, and it is checked again here.
          [[ ! "$SECRET_AT" =~ ^(run|transcript|safe-outputs)/[A-Za-z0-9_.+@=,-]+,\ line\ [0-9]+$ ]] || [ "$reaction" != confused ] ||
            text="$text Nothing was uploaded: a secret or a private key is in \`$SECRET_AT\`."
          [ -z "$REFUSAL" ] || text="❌ [$WORKFLOW]($RUN_URL) refused by check: $REFUSAL"
          # One line, already neutralized by apply.
          [ -z "$HANDLER_ERRORS" ] || text="$text Failed outputs: $HANDLER_ERRORS"
          [ "$SECONDARY_FAILED" != true ] || text="$text The secondary pull request was not opened: the apply job's summary says why."
          [ -z "$RESULT_URL" ] || text="$text Result: $RESULT_URL"
          [ "${STAGED:-}" != true ] || [ "$reaction" = confused ] || text="$text Staged: nothing was applied; the apply job's summary shows what would have been."
          [ "${EXIT:-0}" = 0 ] || [ "$reaction" = confused ] || text="$text The run was stopped at a limit (exit state $EXIT${FAILURE_CLASS:+, $FAILURE_CLASS}); what it handed back is marked partial."
          # Numbers alone: the agent reported the cost they come from.
          [[ ! "$OVER_BUDGET" =~ ^[0-9]+(\.[0-9]+)?\ of\ [0-9]+(\.[0-9]+)?\ AIC$ ]] || [ "$reaction" = confused ] ||
            text="$text Its last reply took the agent over budget: it spent $OVER_BUDGET."
          printf '%s\n' "text=$text" "reaction=$reaction" | tee -a "$GITHUB_OUTPUT"
      # The same bounded lookup at start and finish, including retries, by
      # policy's binary, bound to this run's policy upload as the apply
      # job binds it: the ID is the caller's, and an agent upload is
      # executable code too. It holds the status token; nothing else here
      # runs.
      - name: Require policy's binary
        if: ${{ (fromJSON(inputs.policy).notify == 'comment' && fromJSON(inputs.policy).notified == 'true') || (needs.apply.outputs.missing-data == 'true' && fromJSON(inputs.policy).notify-item != '' && fromJSON(inputs.policy).notify-item != '*') }}
        env:
          BINARY: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          NAME: ${{ fromJSON(inputs.policy).artifact-prefix }}agentic-job-binary
        run: |
          [[ "$BINARY" =~ ^[1-9][0-9]*$ ]] || { echo '::error::the policy binary artifact ID is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BINARY" |
            jq -e --arg name "$NAME" --arg run "$GITHUB_RUN_ID" \
              '.name == $name and (.workflow_run.id | tostring) == $run' > /dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ (fromJSON(inputs.policy).notify == 'comment' && fromJSON(inputs.policy).notified == 'true') || (needs.apply.outputs.missing-data == 'true' && fromJSON(inputs.policy).notify-item != '' && fromJSON(inputs.policy).notify-item != '*') }}
        with:
          artifact-ids: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          path: ${{ runner.temp }}/conclude-binary
          digest-mismatch: error
      - name: Edit the status comment
        if: ${{ (fromJSON(inputs.policy).notify == 'comment' && fromJSON(inputs.policy).notified == 'true') || (needs.apply.outputs.missing-data == 'true' && fromJSON(inputs.policy).notify-item != '' && fromJSON(inputs.policy).notify-item != '*') }}
        continue-on-error: true
        env:
          ITEM: ${{ fromJSON(inputs.policy).notify-item }}
          REPO: ${{ fromJSON(inputs.policy).notify-repo }}
          APPLY_ROLE_BINDINGS: ${{ inputs.role-bindings }}
          STATUS_TOKEN: ${{ inputs.role-bindings == '' && secrets.SAFE_OUTPUTS_PAT || inputs.role-bindings != '' && secrets.STATUS_TOKEN || '' }}
          # Only with `notify: comment`: a missing-data status otherwise keeps to the marked comment.
          STATUS_COMMENT: ${{ fromJSON(inputs.policy).notify == 'comment' && fromJSON(inputs.policy).status-comment || '' }}
          TEXT: ${{ steps.ended.outputs.text }}
          COST: ${{ fromJSON(inputs.agent).outputs.cost }}
          NO_RESULT_REASON: ${{ steps.ended.outputs.no-result-reason }}
        run: |
          chmod +x "$RUNNER_TEMP/conclude-binary/agentic-job"
          "$RUNNER_TEMP/conclude-binary/agentic-job" status
      # A notify that failed before it found what to react to leaves no
      # id: nothing is reacted to then, and notify's failure says why.
      - name: A reaction that says how it ended
        if: ${{ fromJSON(inputs.policy).notify == 'reaction' && fromJSON(inputs.policy).notified == 'true' && fromJSON(inputs.policy).notify-id != '' }}
        env:
          KIND: ${{ fromJSON(inputs.policy).notify-kind }}
          ID: ${{ fromJSON(inputs.policy).notify-id }}
          REACTION: ${{ steps.ended.outputs.reaction }}
        run: |
          [[ "$ID" =~ ^[0-9]+$ ]] || { echo "::error::notify left nothing to react to"; exit 1; }
          case "$KIND" in
            issue) path="issues/$ID/reactions" ;;
            comment) path="issues/comments/$ID/reactions" ;;
            review_comment) path="pulls/comments/$ID/reactions" ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/$path" -f content="$REACTION" --jq .content
