# The last piece of an agent run: what check accepted, applied by the
# only job with a credential that can write, and how the run ended told
# to whoever started it. It runs nothing that came from the agent's
# machine but the checked outputs.
#
#   apply     gh-aw's pinned handlers on check.yml's accepted outputs;
#             the only job given SAFE_OUTPUTS_PAT
#   conclude  edits the status comment notify posted, or posts check's
#             refusal to the policy's comment target
#
# Its inputs are the caller's `needs` of the other pieces, as JSON: the
# settings come from policy.yml's outputs, so that what is applied is
# what that call decided. The agent's exit state decides only whether
# a partial run is applied; check decided whether anything may be.
name: agentic-job apply

on:
  workflow_call:
    inputs:
      policy:
        description: "`toJSON(needs.policy.outputs)` of the policy.yml call"
        type: string
        required: true
      agent:
        description: "`toJSON(needs.agent)` of the agent job (its result and its `exit` output); `{}` for proposals from a non-agent job"
        type: string
        default: "{}"
      check:
        description: "`toJSON(needs.check)` of the check.yml call (its result and outputs)"
        type: string
        required: true
    secrets:
      # Explicit optional credential, consumed only by apply. Never use inherit.
      # Callers must pass this name even for an environment secret;
      # the environment's same-name value takes precedence (docs/workflow.md).
      SAFE_OUTPUTS_PAT:
        description: Optional credential for applying safe outputs; defaults to the job token when empty
        required: false
    outputs:
      applied-artifact-id:
        description: The artifact holding applied.json, which names what the apply job made
        value: ${{ jobs.apply.outputs.artifact-id }}
      pull-request:
        description: The number of the pull request the run opened, if it opened one
        value: ${{ jobs.apply.outputs.pull-request }}
      result-url:
        description: The URL of what apply made, the pull request or else the first comment or issue; empty for none
        value: ${{ jobs.apply.outputs.result-url }}

# No `permissions` here: a job that names none keeps what the caller
# granted the call, which apply writes with and conclude comments with.

# With `pipefail`, which the default shell of a step does without: a check
# whose output is piped must still fail its step.
defaults:
  run:
    shell: bash

env:
  # github/gh-aw's fixed place for a run's files (its constants.cjs).
  GH_AW_TMP: /tmp/gh-aw

jobs:
  # It runs gh-aw's pinned handlers on the checked outputs, and nothing
  # that came from the agent's machine but those outputs. No `permissions`
  # here: it keeps what the caller granted the call, which with
  # `apply-environment` should be no more than the other jobs ask for.
  apply:
    # A run that ended well, or one stopped at a limit whose caller asked
    # for partial work. The exit state comes from the agent's machine and
    # decides only this; the check job decided whether it may be applied.
    if: >-
      ${{ !cancelled() && fromJSON(inputs.check).result == 'success' && (fromJSON(inputs.policy).proposals-artifact != '' || format('{0}', fromJSON(inputs.agent).outputs.exit) == '0' ||
          (fromJSON(inputs.policy).apply-partial == 'true' && contains(fromJSON('["3", "124"]'), fromJSON(inputs.agent).outputs.exit))) && fromJSON(inputs.policy).expect-check-refusal != 'true' }}
    runs-on: ${{ fromJSON(fromJSON(inputs.policy).runner) }}
    timeout-minutes: 15
    environment: ${{ fromJSON(inputs.policy).apply-environment }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      pull-request: ${{ steps.apply.outputs.created_pr_number || steps.applied.outputs.pull-request-number }}
      result-url: ${{ steps.result.outputs.result-url }}
    env:
      OUTPUT_REPO: ${{ fromJSON(inputs.policy).output-repo || github.repository }}
      # The issue the caller made the run for, a number policy checked.
      ISSUE: ${{ fromJSON(inputs.policy).issue }}
      REPO: ${{ fromJSON(inputs.policy).repo }}
      BASE: ${{ fromJSON(inputs.policy).base }}
      REPORT: /tmp/gh-aw/report.json
      # What gh-aw's handlers list the things they made in.
      MADE: /tmp/gh-aw/safe-output-items.jsonl
    steps:
      # The pieces must be one commit's: a policy call pinned elsewhere
      # would have this commit's code check (or apply) the settings,
      # binary and policy of another, possibly an older, weaker one.
      - name: The policy call is this workflow's commit
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_REPOSITORY" == "$REPOSITORY" && "$SOURCE_SHA" == "$SHA" ]] ||
            { echo "::error::policy.yml ran at $SOURCE_REPOSITORY@$SOURCE_SHA, this workflow at $REPOSITORY@$SHA: pin all pieces to one commit"; exit 1; }
      # From the caller's composition: an empty ID must not turn
      # download-artifact into a download of all uploads, the agent's
      # unchecked proposals included.
      - name: Require the checked outputs' artifact ID
        env:
          CHECKED: ${{ fromJSON(inputs.check).outputs.artifact-id }}
        run: |
          [[ "$CHECKED" =~ ^[1-9][0-9]*$ ]] || { echo '::error::a checked artifact ID is required'; exit 1; }
      # Nor is the ID check's because the caller says so: one wired from
      # the agent job would apply unchecked proposals. It has to be this
      # run's upload of the name check.yml uploads under this policy
      # call's prefix, which only check's last step does, and only when
      # check accepted: a policy call's prefix is unique in a run, as its
      # own uploads under it would conflict, and so would an earlier upload
      # of the name with check's. Read with the job token (`actions: read`).
      # This binds the run, not the attempt: the API names no attempt, and
      # a re-run keeps the run ID, so an earlier attempt's upload passes.
      # That is still check's accepted output under this prefix.
      - name: The checked outputs are this run's check's
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ fromJSON(inputs.check).outputs.artifact-id }}
          NAME: ${{ fromJSON(inputs.policy).artifact-prefix }}checked-outputs
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CHECKED" |
            jq -e --arg name "$NAME" --arg run "$GITHUB_RUN_ID" '.name == $name and (.workflow_run.id | tostring) == $run' > /dev/null ||
            { echo "::error::artifact $CHECKED is not $NAME of run $GITHUB_RUN_ID: apply takes check.yml's output of this run, and the call needs \`actions: read\`"; exit 1; }
      # The output repository, whole: the patch is applied on the commit
      # the agent started from, which a shallow clone does not have. The
      # handlers push with this checkout's credentials. Only check's accepted
      # patch report enables it; comment-only outputs need no repository/base.
      # A push's base is a branch of the fork its pull request is from, not
      # of the output repository: the checkout's own default is taken, and
      # the fork's branch fetched below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' }}
        with:
          repository: ${{ env.OUTPUT_REPO }}
          ref: ${{ fromJSON(inputs.policy).push-item == '' && fromJSON(inputs.policy).base || '' }}
          fetch-depth: 0
          # Same selection as the handlers; only apply gets this PAT.
          token: ${{ secrets.SAFE_OUTPUTS_PAT || github.token }}
          persist-credentials: true
      - uses: github/gh-aw/actions/setup@c227508baacbbe271be6c5a4f303936840b3c813 # v0.90.1-13
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(inputs.check).outputs.artifact-id }}
          path: ${{ env.GH_AW_TMP }}
      # `git am` keeps the patch's author and needs a committer, and is to
      # keep a carriage return at a line's end, as the trial below does. Without
      # rename detection a patch that does not apply as it is stops with a
      # conflict, where `git am --3way` would look for the file by content
      # and could change another path than the patch names.
      - name: Configure git
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.renames false
          git config diff.renames false
          git config am.keepcr true
      # A pull request is opened from a fork of the output repository owned
      # by whoever the token names, never from a branch of the output
      # repository: its CI then runs the agent's commit as a fork's, with a
      # read-only token, no secrets and no OIDC token. The forge makes the
      # fork if there is none and answers with the existing one otherwise;
      # it is not synced, as the handler pushes the commit together with the
      # base it sits on. The job token names nobody and cannot fork (policy
      # refuses it create_pull_request), and an owner of the output
      # repository has no fork of it to push to. What the forge answers
      # with is the user's repository in the output repository's network,
      # which can be the network's root or the caller's repository: it has
      # to be a fork, the user's, and neither of those, with Actions turned
      # off. This comes before anything is pushed.
      #
      # A push goes to the same fork, and only to the branch of a pull
      # request apply opened from it: never to a branch of the output
      # repository, whose CI would run the agent's commit with a write
      # token and OIDC, nor to anyone else's fork. The handler pushes to the
      # pull request's head repository only if it is this fork (`head-repo`
      # below); it is checked here too, before anything is fetched from it.
      - name: Fork the output repository for the pull request
        id: fork
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.SAFE_OUTPUTS_PAT || github.token }}
          script: |
            const fs = require('node:fs');
            const output = JSON.parse(fs.readFileSync(`${process.env.GH_AW_TMP}/agent_output.json`, 'utf8'));
            const push = output.items.some(item => item.type === 'push_to_pull_request_branch');
            if (!push && !output.items.some(item => item.type === 'create_pull_request')) return;
            const me = await github.rest.users.getAuthenticated().then(({ data }) => data.login, () => null);
            if (!me) throw new Error("a pull request is opened from a fork of the identity apply holds, and GET /user names none: SAFE_OUTPUTS_PAT must be a user's token");
            const [owner, repo] = process.env.OUTPUT_REPO.split('/');
            if (owner.toLowerCase() === me.toLowerCase()) {
              throw new Error(`${me} owns ${process.env.OUTPUT_REPO} and has no fork of it to push to: apply as an account that does not own it`);
            }
            // A push's pull request is checked before anything is forked:
            // open, from the branch the policy names, of a fork of `me`'s.
            let from = null, target = null;
            if (push) {
              ({ target } = JSON.parse(fs.readFileSync(`${process.env.GH_AW_TMP}/config.json`, 'utf8')).push_to_pull_request_branch ?? {});
              if (!/^[1-9][0-9]*$/.test(String(target))) throw new Error('a push is to be applied, and the policy names no pull request for it');
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: Number(target) });
              from = String(pull.head?.repo?.full_name);
              if (pull.state !== 'open' || pull.head?.repo?.fork !== true || String(pull.head?.repo?.owner?.login).toLowerCase() !== me.toLowerCase() ||
                  pull.head?.ref !== process.env.BASE) {
                throw new Error(`pull request ${target} of ${process.env.OUTPUT_REPO} is ${pull.state}, from ${from}:${pull.head?.ref}, not open from ${me}'s fork:${process.env.BASE}: ` +
                  `a push goes only to the branch of a pull request apply opened from ${me}'s fork`);
              }
            }
            const { data: fork } = await github.rest.repos.createFork({ owner, repo, default_branch_only: true });
            const name = String(fork.full_name);
            if (fork.fork !== true || String(fork.owner?.login).toLowerCase() !== me.toLowerCase() ||
                [process.env.REPO, process.env.OUTPUT_REPO].some(other => other.toLowerCase() === name.toLowerCase())) {
              throw new Error(`the forge answered a fork of ${process.env.OUTPUT_REPO} for ${me} with ${name}, which is not ${me}'s own fork of it`);
            }
            // The forge makes a fork in the background: wait until git can reach it and its branch.
            for (let attempt = 1; ; attempt++) {
              const { exitCode, stdout } = await exec.getExecOutput('git', ['ls-remote', '--heads', `https://github.com/${name}.git`],
                { ignoreReturnCode: true, silent: true });
              if (exitCode === 0 && stdout.includes('\trefs/heads/')) break;
              if (attempt === 30) throw new Error(`the fork ${name} is still not there after ${attempt} tries`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            // A push with a PAT, unlike one with the job token, starts the
            // fork's workflows on `push`, with the fork's secrets: Actions
            // are turned off there, and nothing is pushed unless the forge
            // then says they are off.
            const [forkOwner, forkRepo] = name.split('/');
            const enabled = await github.rest.actions.setGithubActionsPermissionsRepository({ owner: forkOwner, repo: forkRepo, enabled: false })
              .then(() => github.rest.actions.getGithubActionsPermissionsRepository({ owner: forkOwner, repo: forkRepo }))
              .then(({ data }) => data.enabled, () => null);
            if (enabled !== false) {
              throw new Error(`Actions could not be turned off on the fork ${name}, which a push with ${me}'s token would run workflows in: ` +
                "turn them off there, and give SAFE_OUTPUTS_PAT the repo scope (or a fine-grained token Administration: write on the fork)");
            }
            if (from !== null && from.toLowerCase() !== name.toLowerCase()) {
              throw new Error(`pull request ${target} of ${process.env.OUTPUT_REPO} is from ${from}:${process.env.BASE}, not from ${name}: ` +
                `a push goes only to the branch of a pull request apply opened from ${me}'s fork`);
            }
            core.setOutput('repo', name);
      # The target's base branch as this job fetched it, not as anything
      # that was handed back says. Never push the target's commits to an
      # output repository: its push workflows could run with privileges.
      # A push's pull request is in the repository the run worked on (policy
      # refuses any other): checked again here. Its base is the pull
      # request's branch, in the fork the step above checked, and nothing
      # here pushes for it.
      - name: Fetch the target's base branch
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' }}
        env:
          FORK: ${{ steps.fork.outputs.repo }}
        run: |
          jq -e '.push_to_pull_request_branch == null' "$GH_AW_TMP/config.json" > /dev/null || [ "${OUTPUT_REPO,,}" = "${REPO,,}" ] ||
            { echo "::error::a push goes to a pull request of $REPO, the repository the run worked on, not of $OUTPUT_REPO"; exit 1; }
          if jq -e 'any(.items[]; .type == "push_to_pull_request_branch")' "$GH_AW_TMP/agent_output.json" > /dev/null; then
            git fetch --no-tags "https://github.com/$FORK" "+refs/heads/$BASE:refs/agentic-job/target-base"
            exit 0
          fi
          git fetch --no-tags "https://github.com/$REPO" "+refs/heads/$BASE:refs/agentic-job/target-base"
          [ "${OUTPUT_REPO,,}" = "${REPO,,}" ] || git merge-base --is-ancestor "$(jq -er '.patch.base_commit' "$REPORT")" HEAD ||
            { echo "::error::sync $OUTPUT_REPO's $BASE to contain the patch's base commit before applying"; exit 1; }
      # The branch a pull request is pushed as is named in the hand-back,
      # and the handlers push that name as it is: it has to be this
      # run's, whatever the agent's machine wrote there. A push's names
      # its patch file: it has to be the policy's base, the pull request's
      # branch, which the handler pushes to by the pull request's number.
      - name: The pull request's branch is this run's
        run: |
          jq -e --arg want "agent-run-$GITHUB_RUN_ID" --arg base "$BASE" \
            'all(.items[] | select(.type == "create_pull_request"); .branch == $want)
             and all(.items[] | select(.type == "push_to_pull_request_branch"); .branch == $base)' "$GH_AW_TMP/agent_output.json"
      # The commit the patch says it starts from is the hand-back's own
      # claim: it has to be one the target's base branch holds. Applied
      # there with a plain `git am`, which takes a patch only where it
      # applies exactly, the patch must change the files `check` saw it
      # name and no others, before the handlers apply and push it. A
      # report that cannot be read stops the job: only one that says
      # there is no patch skips this.
      # Materialize both lists so pipefail catches extraction failures;
      # process substitutions would hide them. check rejects control
      # characters in paths, and quotePath=false keeps UTF-8 names literal.
      - name: Apply the patch on its own base, and compare what changed with what was checked
        if: ${{ fromJSON(inputs.check).outputs.has-patch == 'true' }}
        id: trial
        run: |
          patch=$(jq -c .patch "$REPORT")
          [ "$patch" != null ] || exit 0
          base=$(jq -er '.patch.base_commit' "$REPORT")
          git merge-base --is-ancestor "$base" refs/agentic-job/target-base ||
            { echo "::error::the patch starts from $base, which is not a commit of the $BASE fetched above"; exit 1; }
          git worktree add --quiet --detach "$RUNNER_TEMP/trial" "$base"
          git -C "$RUNNER_TEMP/trial" am --keep-cr "$GH_AW_TMP"/aw-*.patch
          git -C "$RUNNER_TEMP/trial" -c core.quotePath=false diff --name-only --no-renames "$base" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          jq -er '.patch.files | select(type == "array" and length > 0) | .[]' "$REPORT" | LC_ALL=C sort > "$RUNNER_TEMP/checked-files"
          diff "$RUNNER_TEMP/actual-files" "$RUNNER_TEMP/checked-files"
          echo "tree=$(git -C "$RUNNER_TEMP/trial" rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          git worktree remove --force "$RUNNER_TEMP/trial"
      # The collector's configuration with how to apply added: an unsigned
      # push keeps the author (a signed one is made through the API, as the
      # token's owner), a pull request that fails is not to become an
      # issue, and the branch goes to the fork, which only it may name.
      # Without a fork there is no pull request to open or push to, and no
      # handler for either: one without its `head-repo` would push to the
      # output repository. Each input is one string of the result.
      #
      # The push handler takes the pull request only if its head repository
      # is `head-repo`, applies the patch on the head the run started from
      # (the patch's base, which check held to the policy's), and pushes
      # without force: a branch that moved on since, by an earlier attempt's
      # push too, refuses it. One rewritten since the trial above fetched it,
      # so that the head is no longer in it, the handler applies the patch
      # on instead, as only the fork's owner or a maintainer of the output
      # repository can do; the last step then fails the job.
      - name: Write the handlers' configuration
        env:
          FORK: ${{ steps.fork.outputs.repo }}
          BRANCH_PREFIX: ${{ fromJSON(inputs.policy).branch-prefix }}
          PARTIAL: >-
            ${{ fromJSON(inputs.agent).outputs.exit == '124' && '[partial: stopped at the timeout] '
                || fromJSON(inputs.agent).outputs.exit == '3' && '[partial: stopped at a limit] ' || '' }}
          TITLE_PREFIX: ${{ fromJSON(inputs.policy).title-prefix }}
          COMMENT_TARGET: ${{ fromJSON(inputs.policy).comment-target }}
          PULL_REQUEST: '{"signed_commits": false, "fallback_as_issue": false, "preserve_branch_name": true, "auto_close_issue": false}'
          # A push that fails is not to become a pull request, and an
          # empty one fails; `allow_workflows` is never set, so a change
          # under .github/workflows/ is refused here as well as by check.
          # Unsigned, as above. No title prefix: the push handler would
          # take it for one the pull request's title must have.
          PUSH: '{"signed_commits": false, "fallback_as_pull_request": false, "if_no_changes": "error"}'
        # `checkout_mapping` tells the push handler that the output
        # repository's checkout is the workspace. From a caller in another
        # repository it would otherwise look for that checkout itself, and
        # refuse the output repository as not in `allowed_repos`, which
        # names the fork alone.
        run: |
          jq --arg repo "$OUTPUT_REPO" --arg base "$BASE" --arg branch "$BRANCH_PREFIX" --arg title "$PARTIAL$TITLE_PREFIX" \
            --arg target "$COMMENT_TARGET" --arg action_repo "$REPO" --argjson pr "$PULL_REQUEST" --argjson push "$PUSH" --arg fork "$FORK" '
            (if $fork == "" then del(.create_pull_request, .push_to_pull_request_branch) else . end)
            | (select(has("create_pull_request")).create_pull_request) += $pr
              + {"target-repo": $repo, base_branch: $base, branch_prefix: $branch, title_prefix: $title,
                 "head-repo": $fork, allowed_repos: [$fork]}
            | (select(has("push_to_pull_request_branch")).push_to_pull_request_branch) += $push
              + {"target-repo": $repo, "head-repo": $fork, allowed_repos: [$fork], checkout_mapping: {($repo | ascii_downcase): "."}}
            | (select(has("add_comment")).add_comment) += {"target-repo": $repo, target: $target}
            | (select(has("create_issue")).create_issue) += {"target-repo": $repo, title_prefix: $title}
            | (select(has("close_issue")).close_issue) += {"target-repo": $action_repo, target: "*", issue_intent: false, allow_body: false}
            | (select(has("add_labels")).add_labels) += {"target-repo": $action_repo, target: "*", issue_intent: false, create_if_missing: false}
            | (select(has("update_project")).update_project) += {"target-repo": $action_repo}
          ' "$GH_AW_TMP/config.json" > "$GH_AW_TMP/handler-config.json"
          echo "GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG=$(jq -c . "$GH_AW_TMP/handler-config.json")" >> "$GITHUB_ENV"
      # The first line of what a partial run opens or posts says so too,
      # in this file's words, chosen by the exit state. A partial run with
      # neither a pull request, an issue nor a comment would leave nothing
      # that says it was stopped, so it is not applied. Nor is a partial
      # run's push: its commit would land on an open pull request with
      # nothing on it to say the work was cut short.
      - name: Mark what a partial run opens or posts
        if: ${{ fromJSON(inputs.policy).proposals-artifact == '' && format('{0}', fromJSON(inputs.agent).outputs.exit) != '0' }}
        env:
          STOPPED: ${{ fromJSON(inputs.agent).outputs.exit == '124' && 'its timeout' || 'a request, task or spending limit' }}
        run: |
          jq -e 'all(.items[]; .type != "push_to_pull_request_branch")' "$GH_AW_TMP/agent_output.json" > /dev/null ||
            { echo "::error::the run was stopped at $STOPPED: a partial change is not pushed to a pull request's branch"; exit 1; }
          jq -e 'any(.items[]; .type == "create_pull_request" or .type == "add_comment" or .type == "create_issue")' "$GH_AW_TMP/agent_output.json" > /dev/null ||
            { echo "::error::the run was stopped at $STOPPED and handed back nothing that could say so"; exit 1; }
          jq --arg note "**Partial work.** The run was stopped at $STOPPED before the task was done; this is what it handed back." \
            '(.items[] | select(.type == "create_pull_request" or .type == "add_comment" or .type == "create_issue") | .body) |= "\($note)\n\n\(.)"' \
            "$GH_AW_TMP/agent_output.json" > "$RUNNER_TEMP/marked.json"
          mv "$RUNNER_TEMP/marked.json" "$GH_AW_TMP/agent_output.json"
      # A pull request says which issue the caller made the run for, in
      # this file's words: `Refs`, which closes nothing when it is merged.
      # Before the guard, so the name it digests is the same on a re-run.
      - name: Say which issue a pull request is for
        if: ${{ fromJSON(inputs.policy).issue != '' }}
        run: |
          jq --arg refs "Refs $OUTPUT_REPO#$ISSUE" '(.items[] | select(.type == "create_pull_request") | .body) |= "\(. // "")\n\n\($refs)"' \
            "$GH_AW_TMP/agent_output.json" > "$RUNNER_TEMP/refs.json"
          mv "$RUNNER_TEMP/refs.json" "$GH_AW_TMP/agent_output.json"
      # A re-run of this job applies check's accepted outputs again, and
      # gh-aw's handlers would post each comment, issue and pull request
      # again. Each is named by this run, its place and its digest, the
      # digest over the artifact prefix too: the calls of one run share its
      # ID, and two may hand back the same request. The name goes last in
      # the body, after the first line a verdict or a partial run's note
      # needs, and the next step hides it in what it posts; one whose name is
      # already posted is left out, the others are applied, so a re-run
      # completes what an earlier attempt did not. A pull request's name
      # holds the checked patch too, so a different patch is not taken for
      # one applied before. Only what this job's token posts counts (the job
      # token's github-actions[bot], or the user /user names for the PAT;
      # with a PAT that names nobody, nothing counts), only the last
      # name in a body, and check refuses requests holding the name: neither
      # the agent nor a commenter can make a request look applied, not even
      # with text the handlers decode into a name. Closing an issue (without
      # a comment: `allow_body` is false), adding labels and
      # setting a project field are the same done twice and are left alone.
      - name: Leave out what an earlier attempt applied
        id: applied
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_TARGET: ${{ fromJSON(inputs.policy).comment-target }}
          BRANCH_PREFIX: ${{ fromJSON(inputs.policy).branch-prefix }}
          ARTIFACT_PREFIX: ${{ fromJSON(inputs.policy).artifact-prefix }}
          # Where a pull request's branch is pushed, the step above's fork.
          FORK: ${{ steps.fork.outputs.repo }}
          # Whether the token below is the PAT; the secret itself stays there.
          TOKEN_IS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT != '' }}
        with:
          github-token: ${{ secrets.SAFE_OUTPUTS_PAT || github.token }}
          script: |
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const file = `${process.env.GH_AW_TMP}/agent_output.json`;
            const output = JSON.parse(fs.readFileSync(file, 'utf8'));
            const [owner, repo] = process.env.OUTPUT_REPO.split('/');
            // The job token posts as github-actions[bot] and cannot read
            // /user; a PAT posts as the user it names. Any other bot's post
            // is not this token's. A PAT that /user does not name (an app's
            // token) has no one here, and nothing posted counts as applied.
            const me = process.env.TOKEN_IS_PAT === 'true'
              ? await github.rest.users.getAuthenticated().then(({ data }) => data.login, () => null)
              : 'github-actions[bot]';
            if (me === null) core.warning('GET /user does not name the SAFE_OUTPUTS_PAT token, so nothing posted before counts as applied, and a re-run posts again');
            // For the link to the issue, which is looked for the same way.
            core.setOutput('poster', me ?? '');
            const ours = user => me !== null && user?.login === me;
            // The patch check accepted is what a pull request applies.
            const patch = () => {
              const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
              if (!report.patch?.file) throw new Error('a pull request is to be opened, and check accepted no patch');
              return fs.readFileSync(`${process.env.GH_AW_TMP}/${require('node:path').basename(report.patch.file)}`);
            };
            const skippedFile = `${process.env.GH_AW_TMP}/skipped.json`;
            const kept = [], skipped = [];
            for (const [index, item] of output.items.entries()) {
              if (!['add_comment', 'create_issue', 'create_pull_request'].includes(item.type)) { kept.push(item); continue; }
              // An input and JSON hold no NUL, so the prefix, the request and the patch cannot run into each other.
              const hash = createHash('sha256').update(process.env.ARTIFACT_PREFIX ?? '').update('\0').update(JSON.stringify(item));
              if (item.type === 'create_pull_request') hash.update('\0').update(patch());
              const name = `agentic-job-applied: ${process.env.GITHUB_RUN_ID}/${index}/${hash.digest('hex').slice(0, 16)}`;
              // The last name in a body is the one put there after what was asked.
              const marked = found => ours(found.user) &&
                [...String(found.body).matchAll(/<!-- (agentic-job-applied: \d+\/\d+\/[0-9a-f]{16}) -->/g)].at(-1)?.[1] === name;
              let found;
              if (item.type === 'add_comment') {
                const target = /^\d+$/.test(process.env.COMMENT_TARGET) ? process.env.COMMENT_TARGET : item.item_number;
                if (/^\d+$/.test(String(target))) {
                  const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(target), per_page: 100 });
                  found = comments.find(marked);
                }
              } else if (item.type === 'create_pull_request') {
                // The branch is this run's, checked above; the handler names it so, in the fork.
                if (!process.env.FORK) throw new Error('a pull request is to be opened, and there is no fork to open it from');
                const { normalizeBranchName } = require(`${process.env.RUNNER_TEMP}/gh-aw/actions/normalize_branch_name.cjs`);
                const prefix = normalizeBranchName(process.env.BRANCH_PREFIX);
                const branch = prefix && !item.branch.startsWith(prefix) ? prefix + item.branch : item.branch;
                const head = `${process.env.FORK.split('/')[0]}:${branch}`;
                const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, head, state: 'all', per_page: 100 });
                found = pulls.find(pull => marked(pull) && (pull.state === 'open' || pull.merged_at));
                if (found) {
                  core.setOutput('pull-request-number', found.number);
                  core.setOutput('pull-request-url', found.html_url);
                }
              } else {
                // gh-aw finds its own marked issues the same way; search lags seconds behind.
                const { data } = await github.rest.search.issuesAndPullRequests({ q: `repo:${owner}/${repo} is:issue in:body "${name}"`, per_page: 100 });
                found = data.items.find(marked);
              }
              if (found) {
                skipped.push({ type: item.type, name, url: found.html_url });
              } else {
                kept.push({ ...item, body: `${item.body ?? ''}\n\n${name}` });
              }
            }
            fs.writeFileSync(file, JSON.stringify({ ...output, items: kept }));
            fs.writeFileSync(skippedFile, JSON.stringify(skipped));
            if (skipped.length) {
              await core.summary.addHeading('Already applied by an earlier attempt, so left out', 3)
                .addList(skipped.map(({ type, url }) => `${type}: ${url}`)).write();
            }
      # gh-aw's handler can open an issue in a pull request's place
      # whatever `fallback_as_issue` says (where the forge refuses it to
      # Actions, for one), so no client the handlers use opens more issues
      # than the run's create_issue outputs allow, none for a run without
      # that type. A handler that failed fails this step, and the last step
      # says what that means for the job.
      - name: Apply the outputs with gh-aw's handlers
        id: apply
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ env.GH_AW_TMP }}/agent_output.json
          GH_AW_WORKFLOW_ID: agentic-job
          GH_AW_WORKFLOW_NAME: ${{ github.workflow }}
        with:
          # Use the checkout's credential selection for API writes too.
          github-token: ${{ secrets.SAFE_OUTPUTS_PAT || github.token }}
          script: |
            const dir = `${process.env.RUNNER_TEMP}/gh-aw/actions`;
            // Issues may be opened up to the run's create_issue count, by any handler;
            // one is counted when it is made, so a request gh-aw retries counts once.
            let issues = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).create_issue?.max ?? 0;
            const creates = (options, what) => options.method === "POST" && new RegExp(`^/repos/[^/]+/[^/]+/${what}$`).test(options.url);
            let projectRefusal = false;
            // Preflight every field before any handler can mutate the forge.
            // The pinned handler otherwise reports success for skipped values.
            const pending = new Map();
            const writeKey = variables => JSON.stringify([variables.projectId, variables.fieldId, variables.value]);
            const project = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).update_project;
            try {
              const items = JSON.parse(require('node:fs').readFileSync(process.env.GH_AW_AGENT_OUTPUT, 'utf8')).items;
              for (const item of items.filter(item => item.type === 'update_project')) {
                if (!project?.projects.includes(item.project)) throw new Error("project is outside the apply bounds");
                const [, kind, login, , number] = new URL(item.project).pathname.split('/');
                const owner = kind === 'orgs' ? 'organization' : 'user';
                const found = await github.graphql(`query($login: String!, $number: Int!) {
                  ${owner}(login: $login) { projectV2(number: $number) { id } }
                }`, { login, number: Number(number) });
                const projectId = found[owner]?.projectV2?.id;
                if (!projectId) throw new Error("bounded project could not be resolved");
                const fields = [];
                let after = null;
                do {
                  const result = await github.graphql(`query($projectId: ID!, $after: String) {
                    node(id: $projectId) { ... on ProjectV2 { fields(first: 100, after: $after) {
                      nodes {
                        ... on ProjectV2Field { id name dataType }
                        ... on ProjectV2SingleSelectField { id name dataType options { id name } }
                        ... on ProjectV2IterationField { id name dataType configuration { iterations { id title } } }
                      }
                      pageInfo { hasNextPage endCursor }
                    } } }
                  }`, { projectId, after });
                  const page = result.node.fields;
                  fields.push(...page.nodes);
                  if (page.pageInfo.hasNextPage && (!page.pageInfo.endCursor || page.pageInfo.endCursor === after)) {
                    throw new Error("project field pagination did not advance");
                  }
                  after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
                } while (after);
                for (const [name, raw] of Object.entries(item.fields)) {
                  const matches = fields.filter(field => field.name === name);
                  if (!project.fields.includes(name) || matches.length !== 1) throw new Error(`project field ${name} is not an exact existing bounded field`);
                  const field = matches[0];
                  const normalized = name.split(/[\s_-]+/).map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
                  if (normalized.toUpperCase() === 'REPOSITORY' || fields.find(candidate => candidate.name.toLowerCase() === normalized.toLowerCase())?.id !== field.id) {
                    throw new Error(`project field ${name} cannot be addressed exactly by the pinned handler`);
                  }
                  let value;
                  if (field.dataType === 'NUMBER') {
                    const number = typeof raw === 'number' ? raw : Number(raw);
                    if (!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(String(raw).trim()) || !Number.isFinite(number)) throw new Error(`invalid number for project field ${name}`);
                    value = { number };
                  } else if (field.dataType === 'SINGLE_SELECT' || field.dataType === 'ITERATION') {
                    const iteration = field.dataType === 'ITERATION';
                    const options = iteration ? field.configuration?.iterations : field.options;
                    const option = options?.find(option => (iteration ? option.title : option.name).toLowerCase() === String(raw).toLowerCase());
                    if (!option) throw new Error(`unknown option or iteration for project field ${name}`);
                    value = iteration ? { iterationId: option.id } : { singleSelectOptionId: option.id };
                  } else if (field.dataType === 'DATE') {
                    const date = String(raw);
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(Date.parse(date)) || new Date(date).toISOString().slice(0, 10) !== date) throw new Error(`invalid date for project field ${name}`);
                    value = { date };
                  } else if (field.dataType === 'TEXT') {
                    value = { text: String(raw) };
                  } else {
                    throw new Error(`unsupported type for project field ${name}`);
                  }
                  const key = writeKey({ projectId, fieldId: field.id, value });
                  pending.set(key, (pending.get(key) ?? 0) + 1);
                }
              }
            } catch (error) {
              core.setOutput("project-refused", "true");
              throw error;
            }
            const guarded = client => {
              const project = JSON.parse(process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG).update_project;
              if (project) {
                // gh-aw normalizes names and creates missing fields. Refuse
                // schema writes and IDs not read with an exact bounded name.
                const graphql = client.graphql.bind(client);
                const admitted = new Set();
                client.graphql = async (query, variables) => {
                  if (/\bcreateProjectV2Field\b/.test(query) ||
                      (/\bupdateProjectV2ItemFieldValue\b/.test(query) && (!admitted.has(variables.fieldId) || !(pending.get(writeKey(variables)) > 0)))) {
                    projectRefusal = true;
                    throw new Error("project schema or field ID is outside the named field bounds");
                  }
                  const result = await graphql(query, variables);
                  if (/\bupdateProjectV2ItemFieldValue\b/.test(query)) {
                    if (!result?.updateProjectV2ItemFieldValue?.projectV2Item?.id) {
                      projectRefusal = true;
                      throw new Error("project field update did not complete");
                    }
                    const key = writeKey(variables);
                    pending.set(key, pending.get(key) - 1);
                  }
                  for (const field of result?.node?.fields?.nodes ?? []) {
                    if (project.fields.includes(field.name)) admitted.add(field.id);
                  }
                  return result;
                };
              }
              client.hook.before("request", options => {
                if (creates(options, "issues") && issues <= 0) throw new Error("no issue beyond this run's create_issue outputs is opened");
                // The handlers strip HTML comments from bodies; the name the
                // step before put last in a body is hidden only as it is sent.
                if (typeof options.body === "string") {
                  options.body = options.body.replace(/^(agentic-job-applied: \d+\/\d+\/[0-9a-f]{16})$(?![\s\S]*^agentic-job-applied:)/m, "<!-- $1 -->");
                }
              });
              client.hook.after("request", (response, options) => {
                if (creates(options, "issues")) issues -= 1;
              });
              return client;
            };
            require(`${dir}/setup_globals.cjs`).setupGlobals(core, guarded(github), context, exec, io, (...args) => guarded(getOctokit(...args)));
            await require(`${dir}/safe_output_handler_manager.cjs`).main();
            if (projectRefusal || [...pending.values()].some(count => count !== 0)) {
              core.setOutput("project-refused", "true");
              throw new Error("a project write was refused by the apply bounds");
            }
      # What was made, for whoever reads the run: `pull_request` is null
      # when none was opened, and `fork` names where its branch went.
      - name: Write applied.json
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        env:
          PR: ${{ steps.apply.outputs.created_pr_number || steps.applied.outputs.pull-request-number }}
          PR_URL: ${{ steps.apply.outputs.created_pr_url || steps.applied.outputs.pull-request-url }}
          FORK: ${{ steps.fork.outputs.repo }}
          EXIT: ${{ fromJSON(inputs.policy).proposals-artifact != '' && '0' || fromJSON(inputs.agent).outputs.exit }}
        run: |
          touch "$MADE"
          jq -n --slurpfile made "$MADE" --slurpfile handlers "$GH_AW_TMP/handler-config.json" --arg repo "$OUTPUT_REPO" \
            --slurpfile skipped "$GH_AW_TMP/skipped.json" --arg pr "$PR" --arg url "$PR_URL" --arg exit "$EXIT" --arg fork "$FORK" '
            {schema: "agentic-job-applied/v1", repo: $repo, partial: ($exit != "0"), made: $made,
             fork: (if $fork == "" then null else $fork end),
             already_applied: $skipped[0],
             pull_request: (if $pr == "" then null else {number: ($pr | tonumber), url: $url} end),
             handlers: $handlers[0]}' | tee "$GH_AW_TMP/applied.json"
      - id: upload
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ fromJSON(inputs.policy).artifact-prefix }}applied
          path: ${{ env.GH_AW_TMP }}/applied.json
          retention-days: 90
          if-no-files-found: error
      # Where to find what the run made: the pull request, or else the
      # first comment or issue, an earlier attempt's before this one's. The
      # issue the run was made for is told where it is, unless it is a
      # comment there already; once, by the guard's rule: a comment of this
      # token's poster named by this run and this call. The link is not
      # what the run was for, so failing to post it fails no run.
      - name: Say where what the run made is
        id: result
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_PREFIX: ${{ fromJSON(inputs.policy).artifact-prefix }}
          POSTER: ${{ steps.applied.outputs.poster }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.SAFE_OUTPUTS_PAT || github.token }}
          script: |
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const applied = JSON.parse(fs.readFileSync(`${process.env.GH_AW_TMP}/applied.json`, 'utf8'));
            // A push's URL is the pull request it pushed to.
            const posted = [...applied.already_applied, ...applied.made]
              .filter(item => ['add_comment', 'create_issue', 'push_to_pull_request_branch'].includes(item.type) && item.url).map(item => item.url);
            const url = applied.pull_request?.url ?? posted[0] ?? '';
            core.setOutput('result-url', url);
            if (!url) return;
            await core.summary.addHeading('What the run made', 3).addLink(url, url).write();
            const { ISSUE: issue, OUTPUT_REPO: where, POSTER: me } = process.env;
            const on = new RegExp(`^https://[^/]+/${where.replace(/[.]/g, '\\.')}/(issues|pull)/${issue}(#|$)`, 'i');
            if (!issue || on.test(url)) return;
            const [owner, repo] = where.split('/');
            const hash = createHash('sha256').update(process.env.ARTIFACT_PREFIX ?? '');
            const name = `agentic-job-linked: ${process.env.GITHUB_RUN_ID}/${hash.digest('hex').slice(0, 16)}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(issue), per_page: 100 });
            if (comments.some(found => me && found.user?.login === me && String(found.body).includes(`<!-- ${name} -->`))) return;
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(issue),
              body: `The [run](${process.env.RUN_URL}) for this made ${url}\n\n<!-- ${name} -->` });
      # A run that asked for a pull request and has none did not do what
      # it was for, and neither did one of whose outputs a handler failed.
      - name: Every output was applied
        env:
          OUTCOME: ${{ steps.apply.outcome }}
          FAILED: ${{ steps.apply.outputs.items_failed }}
          PROJECT_REFUSED: ${{ steps.apply.outputs.project-refused }}
          TREE: ${{ steps.trial.outputs.tree }}
          FORK: ${{ steps.fork.outputs.repo }}
        run: |
          [ "$PROJECT_REFUSED" != true ] || { echo "::error::a project write was refused"; exit 1; }
          # gh-aw counts a push its handler skipped as no failure: the
          # branch itself, in the fork, has to hold the commit, on the head
          # it was for.
          if jq -e 'any(.items[]; .type == "push_to_pull_request_branch")' "$GH_AW_TMP/agent_output.json" > /dev/null; then
            head=$(jq -r '.push_to_pull_request_branch.head' "$GH_AW_TMP/config.json")
            git fetch --no-tags "https://github.com/$FORK" "+refs/heads/$BASE:refs/agentic-job/pushed"
            [ "$(git rev-parse --verify --quiet 'refs/agentic-job/pushed^')" = "$head" ] && [ "$(git rev-parse 'refs/agentic-job/pushed^{tree}')" = "$TREE" ] ||
              { echo "::error::$BASE of $FORK does not hold the checked change as one commit on $head"; exit 1; }
          fi
          asked=$(jq '[.items[] | select(.type == "create_pull_request")] | length' "$GH_AW_TMP/agent_output.json")
          opened=$(jq '.pull_request != null' "$GH_AW_TMP/applied.json")
          [ "$OUTCOME" = success ] && { [ "$asked" = 0 ] || [ "$opened" = true ]; } ||
            { echo "::error::the handlers ended in $OUTCOME with ${FAILED:-no count of} failed outputs in $OUTPUT_REPO (pull requests asked for: $asked, opened: $opened)"; exit 1; }

  # How an event-triggered run ended, for whoever started it: the status
  # comment `notify` posted is edited to say so, or a reaction says it
  # where the caller asked for reactions alone. The results of the jobs
  # are this workflow's own; the exit state and the pull request's
  # number are numbers.
  conclude:
    needs: apply
    if: ${{ always() && ((fromJSON(inputs.policy).event == 'true' && fromJSON(inputs.policy).notify != 'none' && fromJSON(inputs.policy).notified == 'true') || (fromJSON(inputs.check).outputs.refusal != '' && fromJSON(inputs.policy).comment-target != '' && fromJSON(inputs.policy).comment-target != '*')) }}
    runs-on: ${{ fromJSON(fromJSON(inputs.policy).runner) }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW: ${{ github.workflow }}
    steps:
      # The pieces must be one commit's: a policy call pinned elsewhere
      # would have this commit's code check (or apply) the settings,
      # binary and policy of another, possibly an older, weaker one.
      - name: The policy call is this workflow's commit
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_REPOSITORY" == "$REPOSITORY" && "$SOURCE_SHA" == "$SHA" ]] ||
            { echo "::error::policy.yml ran at $SOURCE_REPOSITORY@$SOURCE_SHA, this workflow at $REPOSITORY@$SHA: pin all pieces to one commit"; exit 1; }
      - name: How the run ended
        id: ended
        env:
          RESULTS: ${{ fromJSON(inputs.agent).result }}/${{ fromJSON(inputs.check).result }}/${{ needs.apply.result }}
          EXIT: ${{ fromJSON(inputs.agent).outputs.exit }}
          PR: ${{ needs.apply.outputs.pull-request }}
          REFUSAL: ${{ fromJSON(inputs.check).outputs.refusal }}
        run: |
          [[ "$EXIT" =~ ^[0-9]*$ && "$PR" =~ ^[0-9]*$ ]]
          case "$RESULTS" in
            success/success/success) text="✅ [$WORKFLOW]($RUN_URL) ended well${PR:+ and opened pull request #$PR}." reaction=rocket ;;
            success/skipped/skipped) text="✅ [$WORKFLOW]($RUN_URL) ended well and handed back nothing to apply." reaction=rocket ;;
            *cancelled*) text="⏹️ [$WORKFLOW]($RUN_URL) was cancelled." reaction=confused ;;
            *) text="❌ [$WORKFLOW]($RUN_URL) failed (agent, check, apply: $RESULTS; the agent's exit state: ${EXIT:-none})." reaction=confused ;;
          esac
          [ -z "$REFUSAL" ] || text="❌ [$WORKFLOW]($RUN_URL) refused by check: $REFUSAL"
          [ "${EXIT:-0}" = 0 ] || [ "$reaction" != rocket ] || text="$text The run was stopped at a limit (exit state $EXIT); what it handed back is marked partial."
          printf '%s\n' "text=$text" "reaction=$reaction" | tee -a "$GITHUB_OUTPUT"
      # Notify's comment is edited; if posting it failed (which does not
      # stop the run), the status goes in a new comment on the same item.
      - name: Edit the status comment
        if: ${{ fromJSON(inputs.policy).notify == 'comment' && fromJSON(inputs.policy).notified == 'true' }}
        env:
          ID: ${{ fromJSON(inputs.policy).notify-comment-id }}
          ITEM: ${{ fromJSON(inputs.policy).notify-item }}
          TEXT: ${{ steps.ended.outputs.text }}
        run: |
          if [[ "$ID" =~ ^[0-9]+$ ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$TEXT" --jq .html_url
          else
            [[ "$ITEM" =~ ^[0-9]+$ ]] || { echo "::error::notify left no comment id and no item"; exit 1; }
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$ITEM/comments" -f body="$TEXT" --jq .html_url
          fi
      # Only a policy-admitted numeric target, never an agent-selected endpoint.
      - name: Post the refusal to the comment target
        if: ${{ fromJSON(inputs.check).outputs.refusal != '' && fromJSON(inputs.policy).comment-target != '' && fromJSON(inputs.policy).comment-target != '*' && !(fromJSON(inputs.policy).notify == 'comment' && fromJSON(inputs.policy).notified == 'true') }}
        env:
          TARGET: ${{ fromJSON(inputs.policy).comment-target }}
          REPO: ${{ fromJSON(inputs.policy).output-repo || github.repository }}
          TEXT: ${{ steps.ended.outputs.text }}
        run: |
          [[ "$TARGET" =~ ^[0-9]+$ && "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          gh api -X POST "repos/$REPO/issues/$TARGET/comments" -f body="$TEXT" --jq .html_url
      # A notify that failed before it found what to react to leaves no
      # id: nothing is reacted to then, and notify's failure says why.
      - name: A reaction that says how it ended
        if: ${{ fromJSON(inputs.policy).notify == 'reaction' && fromJSON(inputs.policy).notified == 'true' && fromJSON(inputs.policy).notify-id != '' }}
        env:
          KIND: ${{ fromJSON(inputs.policy).notify-kind }}
          ID: ${{ fromJSON(inputs.policy).notify-id }}
          REACTION: ${{ steps.ended.outputs.reaction }}
        run: |
          [[ "$ID" =~ ^[0-9]+$ ]] || { echo "::error::notify left nothing to react to"; exit 1; }
          case "$KIND" in
            issue) path="issues/$ID/reactions" ;;
            comment) path="issues/comments/$ID/reactions" ;;
            review_comment) path="pulls/comments/$ID/reactions" ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/$path" -f content="$REACTION" --jq .content
