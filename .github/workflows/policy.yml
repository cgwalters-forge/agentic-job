# The first piece of an agent run: the request against the caller's
# bounds, before a machine is spent on the agent. Its jobs hold no write
# token but activate's and notify's, which act on the event that started
# the run and on nothing the agent wrote, and apply-token's, which only
# reads with it.
#
#   policy    the bounds, the binary, the configuration and the task;
#             contents: read, actions: read
#   activate  consumes a command label (event-triggered runs)
#   notify    an eyes reaction and a status comment (event-triggered runs)
#   apply-token
#             SAFE_OUTPUTS_PAT checked, with `require-safe-outputs-pat`
#
# The caller's own agent job comes next (prepare, the caller's steps,
# secure-host, run), then check.yml and apply.yml, each given this call's
# outputs; agentic-job.yml is that composition with no steps of the
# caller's. docs/workflow.md says how to put the pieces together.
#
# Every input reaches a step through its environment and is never pasted
# into a script, and the agent's configuration is written by `agentic-job
# config`, which takes each as a value and nothing else.
name: agentic-job policy

on:
  workflow_call:
    inputs:
      id:
        description: The caller's name for this run (an issue, a board item); in summary.json as `item`
        type: string
        required: true
      task:
        description: >-
          The task given to the agent. Public, like everything about a run. With `event`, the
          standing instruction the event's text follows, 64 KiB at most
        type: string
        default: ""
      proposals-artifact:
        description: Artifact from a caller job containing outputs.jsonl (and optional base.json and patch); skips the agent
        type: string
        default: ""
      review:
        description: Enforce an analysis-only pull request review with a pinned head and verdict comment
        type: boolean
        default: false
      review-task:
        description: Review task file in the trusted base checkout, never the review head
        type: string
        default: ""
      review-item:
        description: Positive pull request number for an operator-dispatched review (not an event run)
        type: string
        default: ""
      push-item:
        description: >-
          Positive pull request number in `repo` whose branch a branch run starts from and pushes one
          commit to (`push_to_pull_request_branch`, off unless the bounds allow it); its branch and head
          are read here and replace `base`. Apply pushes only where its user may, never to a default
          or protected branch, and to a branch of anything but its user's fork (`repo` itself or
          another's fork) only where that repository accepts it
        type: string
        default: ""
      repo:
        description: The repository the agent works on, OWNER/NAME on github.com; it must be public, or the calling repository where the bounds set `private = true` (docs/private-repositories.md)
        type: string
        required: true
      base:
        description: The branch of it the agent starts from
        type: string
        default: main
      kind:
        description: "`branch` for a run that may propose a change, `analysis` for one that may not"
        type: string
        default: branch
      outputs:
        description: The output types the run may hand back, comma separated, or `all` for what the bounds allow
        type: string
        default: create_pull_request,noop,missing_tool
      max-outputs:
        description: The most outputs the run may hand back in all, or `max` for the bounds' own ceiling
        type: string
        default: "3"
      allow:
        description: The caller's bounds file, a path in the calling repository (`agentic-job policy --allow`)
        type: string
        required: true
      config:
        description: >-
          A configuration file in the calling repository (TOML) for what the inputs below do not
          cover: the services to stop on the runner, the sockets it may keep, the egress rules,
          the commit's author. The inputs below go over it. A path under `.agentic-job-source/`
          is in this workflow's own source at the called commit, as for this repository's hosted.toml
        type: string
        default: ""
      agent:
        description: "The agent: `claude`, `opencode`, `vibe`, or `fake`, a scripted one that needs no inference"
        type: string
        default: fake
      fake-profile:
        description: Built-in scripted trial, implement, comment or review; only with agent fake and no setup
        type: string
        default: ""
      model:
        description: The model, as the agent names it (empty for the agent's own default)
        type: string
        default: ""
      context:
        description: 'Public reference repositories on an allowed host: JSON array of {"repo":"OWNER/REPO","ref":"optional branch, tag or SHA"}, at most 8'
        type: string
        default: '[]'
      agent-config-repo:
        description: A public repository, OWNER/NAME, holding the agent's configuration
        type: string
        default: ""
      agent-config-ref:
        description: The branch or tag of it (empty for its default branch)
        type: string
        default: ""
      agent-config-path:
        description: The directory of it the configuration is in (empty for its root)
        type: string
        default: ""
      agent-skills:
        description: Install the binary's skills and subagents for claude or opencode, for a task that names one (docs/skills.md)
        type: boolean
        default: false
      runner:
        description: The runner of the policy, check and apply jobs, as JSON (a label or a list of labels). It needs rustup, apt and Node
        type: string
        default: '"ubuntu-24.04"'
      build-binary:
        description: >-
          Build the binary from this workflow's source on every run, also where a release fits its
          commit and would be fetched by its checksum
        type: boolean
        default: false
      inference-url:
        description: >-
          The inference proxy, as http://ADDRESS:PORT, or with `api-key` the provider's API root; empty
          for an agent that needs none
        type: string
        default: ""
      inference-register:
        description: "How the run announces itself to the proxy named by `inference-url`: `github-oidc`, `plain`, `token-file` or `api-key`"
        type: string
        default: github-oidc
      inference-provider:
        description: >-
          For `api-key`, the API the key is for: `anthropic` (claude), `openai` (opencode), or
          `github` (either), GitHub's billing, which implies `api-key`. agentic-job.yml's agent job
          refuses both for now; an agent job of the caller's own needs the sandbox user for them
          (docs/inference.md#a-provider-api-key)
        type: string
        default: ""
      inference-audience:
        description: For `github-oidc`, the audience of the identity token
        type: string
        default: ""
      inference-token-file:
        description: For `token-file`, where on the agent's runner the token is
        type: string
        default: ""
      timeout:
        description: Minutes the agent may run
        type: string
        default: "75"
      max-requests:
        description: The most model requests, as the proxy counts them (0 for no such cap)
        type: string
        default: "150"
      max-tasks:
        description: The most subagent tasks the agent may start (0 for no such cap)
        type: string
        default: "4"
      budget-usd:
        description: The most the run may spend, in US dollars (0 for no such cap; rounded down to cents); overrides budget
        type: string
        default: ""
      budget:
        description: Deprecated for one release, used while budget-usd is empty; the most the run may spend in AIC (hundredths of a dollar)
        type: string
        default: "500"
      session:
        description: >-
          After the task's turn, wait for the operator's prompts over the tailnet (specs/session.md).
          Who may attach and from which page is the configuration's `[session]` table, not an input
        type: boolean
        default: false
      idle-minutes:
        description: With `session`, how long the session waits for the client's next prompt (empty for 10, at most 60)
        type: string
        default: ""
      packages:
        description: Packages the task needs, installed by the runner's package manager; names with spaces between them
        type: string
        default: ""
      npm:
        description: The agent's programs, each NAME@VERSION with an exact version, installed with npm in place of the built-in agent's pinned tarballs
        type: string
        default: ""
      setup:
        description: A script in the calling repository that runs as the sandbox user before the agent, for toolchains
        type: string
        default: ""
      egress-write-policy:
        description: Set egress.write-policy in the run's configuration; false leaves the caller's file to decide
        type: boolean
        default: false
      output-repo:
        description: Where the outputs are applied, OWNER/NAME (empty for the calling repository). For a new pull request, the patch's base commit must already be in the output repository; comments need no checkout
        type: string
        default: ""
      item-repo:
        description: >-
          The repository `comment-target` and `issue` are numbers of, OWNER/NAME, when that is not
          the output repository (one with issues turned off): comments and the status comment go
          there, a pull request or a new issue still to the output repository. It must be public and
          within the bounds' `repos`. Empty for the output repository; not with `event`, `review-item` or `push-item`
        type: string
        default: ""
      apply-environment:
        description: >-
          An environment of the calling repository gating apply. Explicitly pass SAFE_OUTPUTS_PAT;
          an empty secret falls back to the job token. Empty skips environment
          gates; with no passed secret apply uses the calling repository's job token
        type: string
        default: ""
      apply-partial:
        description: Apply what a run stopped at a limit handed back, as a draft that says it is partial
        type: boolean
        default: false
      apply-staged:
        description: Show what apply would do in its summary and applied.json (`staged` true) without writing anything
        type: boolean
        default: false
      require-safe-outputs-pat:
        description: >-
          Refuse the run before the agent unless SAFE_OUTPUTS_PAT is nonempty, a user's with the repo
          scope that can read the output repository and does not own it; read in a job of its own in
          `apply-environment`, which then gates the run before the agent too
        type: boolean
        default: false
      expect-check-refusal:
        description: Expect a policy-check refusal instead of applying outputs; unexpected acceptance or operational failure still fails
        type: boolean
        default: false
      comment-target:
        description: >-
          The issue or pull request of the output repository (or `item-repo`) an `add_comment` goes to, or `*` for
          the one each comment names. Empty for the issue or pull request that started an
          event-triggered run, and `*` where no event did
        type: string
        default: ""
      issue:
        description: >-
          The issue or pull request of the output repository (or `item-repo`) the run was made for, by number:
          a pull request the run opens says `Refs` to it, and apply links it to what the run made
          when that is not a comment on it. Empty for none
        type: string
        default: ""
      event:
        description: >-
          Decide the run from the event that started the calling workflow (`agentic-job event`,
          docs/events.md): the `[trigger]` table of the bounds file says who may start one and from
          which events; the event's text joins `task` behind a fence; a pull request's base becomes
          the run's; comments go to the triggering item; and a refused event ends the run in the
          policy job, with its reason in the job summary and the other jobs skipped
        type: boolean
        default: false
      notify:
        description: >-
          How a run with an item or numeric comment-target reports its state, by jobs
          that run nothing from the agent's machine: `comment` (an eyes reaction on what started it,
          and a comment edited when the run ends), `reaction` (eyes, then rocket, +1 for a blocked run, or confused), or
          `none`. These write with the call's own token, which then needs `issues: write` or
          `pull-requests: write`
        type: string
        default: none
      status-comment:
        description: >-
          With `notify: comment`, the id of a comment the status goes in instead of the marked
          status comment: used only when it is the status credential's own, on the same item.
          Its opening hidden-comment lines are kept. Empty for the marked status comment
        type: string
        default: ""
      title-prefix:
        description: Put before the title of a pull request or an issue the run opens
        type: string
        default: ""
      branch-prefix:
        description: Put before the name of the branch a pull request is pushed as (`agent-run-RUNID`)
        type: string
        default: ""
      artifact-prefix:
        description: Put before the name of every artifact, for a caller that calls this more than once in a run
        type: string
        default: ""
    secrets:
      SAFE_OUTPUTS_PAT:
        description: Optional apply credential, for opted-in status comments and `require-safe-outputs-pat`
        required: false
    # The whole set goes to check.yml and apply.yml as `toJSON(needs.policy.outputs)`,
    # so that what they check and apply is what this call decided, and the
    # caller's agent job finds its trusted inputs here by upload ID.
    outputs:
      admitted:
        description: "`true` unless an event was refused; the agent job runs only then"
        value: ${{ jobs.policy.outputs.admitted }}
      reason:
        description: Why, in the binary's words, for an event-triggered run
        value: ${{ jobs.policy.outputs.reason }}
      refusal:
        description: For a refused review, the reason as one line of inert text to post
        value: ${{ jobs.policy.outputs.refusal }}
      binary-artifact-id:
        description: The upload holding the binary, for prepare and check
        value: ${{ jobs.policy.outputs.binary-artifact-id }}
      policy-artifact-id:
        description: The upload holding policy.json, task.md, config.toml and run.json, for prepare and check
        value: ${{ jobs.policy.outputs.policy-artifact-id }}
      source-repository:
        description: This workflow's own repository, whose prepare, secure-host and run actions the agent job checks out
        value: ${{ jobs.policy.outputs.source-repository }}
      source-sha:
        description: This workflow's own commit, the one the binary was built from or matches
        value: ${{ jobs.policy.outputs.source-sha }}
      ref:
        description: The calling repository's commit the configuration and setup script were read at; the agent job checks it out
        value: ${{ jobs.policy.outputs.ref }}
      base:
        description: The branch the run starts from (the input, or an event's pull request's base)
        value: ${{ jobs.policy.outputs.base }}
      comment-target:
        description: Where an `add_comment` goes, as decided here
        value: ${{ jobs.policy.outputs.comment-target }}
      issue:
        description: The `issue` input
        value: ${{ jobs.policy.outputs.issue }}
      allowed-domains:
        description: >-
          The domains, comma-separated, whose links gh-aw keeps in what is posted, subdomains
          included: the policy's `allowed_domains`, every top-level domain
        value: ${{ jobs.policy.outputs.allowed-domains }}
      review-head:
        description: The exact review head resolved by the read-only policy job
        value: ${{ jobs.policy.outputs.review-head }}
      push-item:
        description: The `push-item` input, the pull request a run pushes to
        value: ${{ jobs.policy.outputs.push-item }}
      runner:
        description: The `runner` input, for check and apply
        value: ${{ jobs.policy.outputs.runner }}
      repo:
        description: The `repo` input
        value: ${{ jobs.policy.outputs.repo }}
      output-repo:
        description: The `output-repo` input
        value: ${{ jobs.policy.outputs.output-repo }}
      item-repo:
        description: The `item-repo` input
        value: ${{ jobs.policy.outputs.item-repo }}
      review:
        description: The `review` input, `true` or `false`
        value: ${{ jobs.policy.outputs.review }}
      expect-check-refusal:
        description: The `expect-check-refusal` input, `true` or `false`
        value: ${{ jobs.policy.outputs.expect-check-refusal }}
      proposals-artifact:
        description: The `proposals-artifact` input
        value: ${{ jobs.policy.outputs.proposals-artifact }}
      apply-environment:
        description: The `apply-environment` input
        value: ${{ jobs.policy.outputs.apply-environment }}
      apply-partial:
        description: The `apply-partial` input, `true` or `false`
        value: ${{ jobs.policy.outputs.apply-partial }}
      apply-staged:
        description: The `apply-staged` input, `true` or `false`
        value: ${{ jobs.policy.outputs.apply-staged }}
      title-prefix:
        description: The `title-prefix` input
        value: ${{ jobs.policy.outputs.title-prefix }}
      branch-prefix:
        description: The `branch-prefix` input
        value: ${{ jobs.policy.outputs.branch-prefix }}
      artifact-prefix:
        description: The `artifact-prefix` input
        value: ${{ jobs.policy.outputs.artifact-prefix }}
      event:
        description: The `event` input, `true` or `false`
        value: ${{ jobs.policy.outputs.event }}
      notify:
        description: The `notify` input
        value: ${{ jobs.policy.outputs.notify }}
      status-comment:
        description: The `status-comment` input, which conclude edits too
        value: ${{ jobs.policy.outputs.status-comment }}
      notified:
        description: "`true` when the notify job ran, failed or not, so that conclude reports how the run ended"
        value: ${{ jobs.notify.result != 'skipped' }}
      notify-kind:
        description: What the notify job reacted to
        value: ${{ jobs.notify.outputs.kind }}
      notify-id:
        description: Its number
        value: ${{ jobs.notify.outputs.id }}
      notify-item:
        description: The issue or pull request the notify job comments on, and conclude reports to
        value: ${{ jobs.notify.outputs.item || jobs.policy.outputs.item || jobs.policy.outputs.comment-target }}
      notify-repo:
        description: The caller repository for event items, otherwise the item's or else the fixed output repository
        value: ${{ jobs.policy.outputs.item != '' && github.repository || inputs.item-repo || inputs.output-repo || github.repository }}
      notify-comment-id:
        description: The status comment the notify job posted, which apply.yml's conclude job edits
        value: ${{ jobs.notify.outputs.comment-id }}

# No `permissions` here: a job that names none keeps what the caller
# granted the call; activation and notification also use that token.

# With `pipefail`, which the default shell of a step does without: a check
# whose output is piped must still fail its step.
defaults:
  run:
    shell: bash

env:
  # github/gh-aw's fixed place for a run's files (its constants.cjs).
  GH_AW_TMP: /tmp/gh-aw
  # Where a job keeps the binary, the policy and what it downloads.
  JOB_DIR: ${{ github.workspace }}/.agentic-job
  # This repository at this file's commit, where a job needs its source.
  SOURCE_DIR: ${{ github.workspace }}/.agentic-job-source

jobs:
  policy:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      binary-artifact-id: ${{ steps.binary.outputs.artifact-id }}
      policy-artifact-id: ${{ steps.policy.outputs.artifact-id }}
      # Whether the run goes on: `true` unless an event was refused.
      admitted: ${{ steps.event.outputs.admitted || 'true' }}
      reason: ${{ steps.event.outputs.reason }}
      refusal: ${{ steps.event.outputs.refusal }}
      # The number of the issue or pull request the event was about, for the notify job; empty for a schedule or a dispatch.
      item: ${{ steps.event.outputs.item }}
      # The branch the run starts from, and where its comments go, as
      # decided here: the inputs, or the event's pull request and item.
      base: ${{ steps.request.outputs.base }}
      comment-target: ${{ steps.request.outputs.comment-target }}
      issue: ${{ steps.request.outputs.issue }}
      allowed-domains: ${{ steps.request.outputs.allowed-domains }}
      push-item: ${{ inputs.push-item }}
      review-head: ${{ steps.event.outputs.review-head || steps.dispatch-review.outputs.review-head }}
      source-repository: ${{ job.workflow_repository }}
      source-sha: ${{ job.workflow_sha }}
      # Event review agent checkout stays on its trusted base, not the head.
      # Dispatch uses the operator's trusted caller commit, not target code.
      ref: ${{ inputs.review && !inputs.review-item && (github.event.pull_request.base.sha || inputs.base) || github.sha }}
      # The caller's settings for check and apply, as given to this call.
      runner: ${{ inputs.runner }}
      repo: ${{ inputs.repo }}
      output-repo: ${{ inputs.output-repo }}
      item-repo: ${{ inputs.item-repo }}
      review: ${{ inputs.review }}
      expect-check-refusal: ${{ inputs.expect-check-refusal }}
      proposals-artifact: ${{ inputs.proposals-artifact }}
      apply-environment: ${{ inputs.apply-environment }}
      apply-partial: ${{ inputs.apply-partial }}
      apply-staged: ${{ inputs.apply-staged }}
      title-prefix: ${{ inputs.title-prefix }}
      branch-prefix: ${{ inputs.branch-prefix }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      event: ${{ inputs.event }}
      notify: ${{ inputs.notify }}
      status-comment: ${{ inputs.status-comment }}
    steps:
      - name: Check the proposals mode
        env:
          PROPOSALS: ${{ inputs.proposals-artifact }}
          EVENT: ${{ inputs.event }}
          REVIEW: ${{ inputs.review }}
          PARTIAL: ${{ inputs.apply-partial }}
          TASK: ${{ inputs.task }}
        run: |
          if [ -n "$PROPOSALS" ]; then
            [ "$EVENT/$REVIEW/$PARTIAL" = false/false/false ] || { echo '::error::proposals mode cannot use event, review or apply-partial'; exit 1; }
          elif [ "$EVENT/$REVIEW" = false/false ]; then
            [ -n "$TASK" ] || { echo '::error::an agent run needs a task'; exit 1; }
          fi
      # The calling repository, for its bounds file.
      # The agent job checks out the same commit (the `ref` output), for
      # the setup script the configuration names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Read current trusted caller policy, even when the PR base is stale.
          # The separate `ref` output keeps the agent on its trusted base.
          # Dispatch uses the operator's trusted caller commit, not target code.
          ref: ${{ github.event_name == 'pull_request_target' && github.workflow_sha || (inputs.review && !inputs.review-item && (github.event.pull_request.base.sha || inputs.base) || github.sha) }}
      # Logs, transcripts and patches are published, so nothing is run for
      # a repository that cannot be shown to be public. An answer that is
      # an error counts as not public. The one exception is a target that
      # is the calling repository and private: its logs and artifacts are
      # its collaborators' alone and the job token reads it. The policy
      # step passes `--private`, which the binary refuses unless every
      # bounds file sets `private = true`; the agent configuration is
      # cloned without a credential and stays public
      # (docs/private-repositories.md).
      - name: Check that the repositories are public
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          REPOS: ${{ inputs.agent-config-repo }} ${{ inputs.item-repo }}
        run: |
          set -f
          name='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          refuse() { echo "::error::$1 cannot be confirmed to be public; private runs are refused unless the target is the calling repository and the bounds set private = true, because run evidence can disclose source. See docs/private-repositories.md in the agentic-job source"; exit 1; }
          visibility() {
            gh api "repos/$1" --jq 'if .private == false and .visibility == "public" then "public"
              elif .private == true and .visibility == "private" then "private" else "unknown" end' || echo unknown
          }
          [[ "$REPO" =~ $name ]] || { echo "::error::not a repository name: $REPO"; exit 1; }
          target=$(visibility "$REPO")
          case "$target" in
            public) ;;
            private) [ "$REPO" = "$GITHUB_REPOSITORY" ] || refuse "$REPO"; echo private=true >> "$GITHUB_OUTPUT" ;;
            *) refuse "$REPO" ;;
          esac
          for repo in $REPOS; do
            [[ "$repo" =~ $name ]] || { echo "::error::not a repository name: $repo"; exit 1; }
            [ "$(visibility "$repo")" = public ] || refuse "$repo"
          done
      # Which repository and commit this file is running from. Without
      # them the checkout below would quietly take the caller's.
      - name: This workflow's own repository and commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          echo "$WORKFLOW_REPOSITORY at $WORKFLOW_SHA"
          [[ "$WORKFLOW_REPOSITORY" == */* && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agentic-job-source
          persist-credentials: false
      # A release's binaries, by its attested source-matching checksums
      # at this commit, when that release was built from this commit's
      # source; a build of that source otherwise, or when the caller says
      # so. The action that secures a host gets its binary the same way,
      # with the same script, which says why no cache is used.
      - name: Get the binary
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build-binary }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          # Read the new ref field at runtime: pinned actionlint's job schema
          # predates it. Do not broaden the unknown-property lint suppression.
          WORKFLOW_IDENTITY: ${{ toJSON(job) }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [ "$BUILD" != true ] || set -- --build
          bash "$SOURCE_DIR/secure-host/binary.sh" get --out "$JOB_DIR/bin" "$@"
      # An event-triggered run (docs/events.md). What the decision needs
      # of the forge comes from the API with the job's token, which can
      # read and no more; the binary makes no request. The actor's
      # permission: a bot has none to fetch, since the bounds admit one by
      # name or not at all, and a person whose permission cannot be
      # fetched is refused by the binary for want of it. For a comment on
      # a pull request, the pull request itself, so that the fork rule
      # applies to its head; its number is the one thing of the event
      # read here, as a number. Both are written outside the checkout, so
      # that nothing committed there can stand in for them.
      - name: Fetch the actor's permission, and the pull request a comment is on
        if: ${{ inputs.event }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PULL: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number || '' }}
        run: |
          [[ "$ACTOR" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "::error::the actor is not a login"; exit 1; }
          [[ "$ACTOR" == *'[bot]' ]] || gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" > "$RUNNER_TEMP/permission.json" ||
            { rm -f "$RUNNER_TEMP/permission.json"; echo "::notice::the permission of $ACTOR could not be fetched"; }
          [[ -z "$PULL" ]] || { [[ "$PULL" =~ ^[0-9]+$ ]] && gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL" > "$RUNNER_TEMP/pull.json"; }
      # The payload is read by the binary from the file GitHub wrote, and
      # the caller's task reaches it by path: no text of either is in a
      # script. A refusal is exit state 1 and no task, and ends the run
      # here: the jobs after this one are skipped, and the reason is in
      # the summary. Exit state 2 is a bounds file or payload that could
      # not be read, which fails the job.
      - name: Decide whether the event may start a run, and write the task
        id: decision
        if: ${{ inputs.event || (inputs.review && !inputs.review-item) }}
        env:
          ALLOW: ${{ inputs.allow }}
          TASK: ${{ inputs.task }}
          ACTOR: ${{ github.actor }}
          REVIEW: ${{ inputs.review }}
          REVIEW_TASK: ${{ inputs.review-task }}
          EVENT: ${{ inputs.event }}
          KIND: ${{ inputs.kind }}
          OUTPUTS: ${{ inputs.outputs }}
          MAX_OUTPUTS: ${{ inputs.max-outputs }}
          NOTIFY: ${{ inputs.notify }}
          TARGET: ${{ inputs.comment-target }}
          REPO: ${{ inputs.repo }}
          OUTPUT_REPO: ${{ inputs.output-repo }}
          APPLY_ENVIRONMENT: ${{ inputs.apply-environment }}
          APPLY_PARTIAL: ${{ inputs.apply-partial }}
          AGENT: ${{ inputs.agent }}
        run: |
          printf '%s\n' "$TASK" > "$RUNNER_TEMP/task.md"
          if [ "$REVIEW" = true ]; then "$JOB_DIR/bin/agentic-job" review task "$REVIEW_TASK" > "$RUNNER_TEMP/task.md"; fi
          [ ! -e "$RUNNER_TEMP/permission.json" ] || set -- "$@" --actor-permission "$RUNNER_TEMP/permission.json"
          [ ! -e "$RUNNER_TEMP/pull.json" ] || set -- "$@" --pull-request "$RUNNER_TEMP/pull.json"
          state=0
          "$JOB_DIR/bin/agentic-job" event --allow "$ALLOW" --event-name "$GITHUB_EVENT_NAME" --event "$GITHUB_EVENT_PATH" \
            --actor "$ACTOR" --repository "$GITHUB_REPOSITORY" --task "$RUNNER_TEMP/task.md" --out "$JOB_DIR" "$@" || state=$?
          case "$state" in 0 | 1) ;; *) echo "::error::agentic-job event ended with exit state $state"; exit "$state" ;; esac
      # The binary writes the outputs, each on one line: a reason can name
      # event fields, and no text of the decision passes through the shell.
      # A review is narrowed to an exact pull request head first.
      - name: Refuse unsupported routing before any item number is consumed
        id: event
        if: ${{ inputs.event }}
        env:
          REVIEW: ${{ inputs.review }}
          BASE: ${{ inputs.base }}
        run: |
          [ "$REVIEW" != true ] || set -- --base "$BASE"
          "$JOB_DIR/bin/agentic-job" review admit --decision "$JOB_DIR/event.json" --output "$GITHUB_OUTPUT" "$@" >> "$GITHUB_STEP_SUMMARY"
      # Operator dispatch has no event admission; resolve the head here with
      # read-only API access, never from agent text or the caller's task.
      # The binary checks the request before the call and prints only a SHA.
      - name: Resolve a dispatched review
        id: dispatch-review
        if: ${{ inputs.review-item != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ inputs.review }}
          EVENT: ${{ inputs.event }}
          KIND: ${{ inputs.kind }}
          OUTPUTS: ${{ inputs.outputs }}
          MAX_OUTPUTS: ${{ inputs.max-outputs }}
          NOTIFY: ${{ inputs.notify }}
          TARGET: ${{ inputs.comment-target }}
          ITEM: ${{ inputs.review-item }}
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          OUTPUT_REPO: ${{ inputs.output-repo }}
          APPLY_PARTIAL: ${{ inputs.apply-partial }}
        run: |
          target=$("$JOB_DIR/bin/agentic-job" review dispatch-target)
          gh api "$(jq -r '"repos/\(.owner)/\(.repo)/pulls/\(.pull_number)"' <<< "$target")" > "$RUNNER_TEMP/dispatch-review.json"
          head=$("$JOB_DIR/bin/agentic-job" review resolve-dispatch --pull-request "$RUNNER_TEMP/dispatch-review.json")
          echo "review-head=$head" >> "$GITHUB_OUTPUT"
      # A run that pushes to a pull request starts from its branch at the
      # head read here with the read-only token, never from agent text or
      # the caller's task; the binary checks the branch against the bounds
      # and pins the head, which the agent's run, check and apply hold to.
      - name: Resolve the pull request a run pushes to
        id: push
        if: ${{ inputs.push-item != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ inputs.event }}
          REVIEW: ${{ inputs.review }}
          KIND: ${{ inputs.kind }}
          ITEM: ${{ inputs.push-item }}
          REPO: ${{ inputs.repo }}
          # Apply applies outputs to the calling repository when none is named.
          OUTPUT_REPO: ${{ inputs.output-repo || github.repository }}
        run: |
          "$JOB_DIR/bin/agentic-job" push resolve --event "$EVENT" --review "$REVIEW" --kind "$KIND" \
            --item "$ITEM" --repo "$REPO" --output-repo "$OUTPUT_REPO" >> "$GITHUB_OUTPUT"
      # The base is the pull request's where an event named one, or the
      # branch of the one a run pushes to, and the bounds have to cover it
      # like any other. Comments go to the item the event was about unless
      # the caller named a target.
      - name: Check the request against the caller's bounds
        id: request
        if: ${{ steps.event.outputs.admitted != 'false' }}
        env:
          ALLOW: ${{ inputs.allow }}
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          KIND: ${{ inputs.kind }}
          OUTPUTS: ${{ inputs.outputs }}
          MAX_OUTPUTS: ${{ inputs.max-outputs }}
          TARGET: ${{ inputs.comment-target }}
          APPLY_ENVIRONMENT: ${{ inputs.apply-environment }}
          ISSUE: ${{ inputs.issue }}
          PUSH_ITEM: ${{ inputs.push-item }}
          PUSH_BRANCH: ${{ steps.push.outputs.branch }}
          PUSH_HEAD: ${{ steps.push.outputs.head }}
          REPLACEMENT_BASE: ${{ steps.push.outputs.replacement-base }}
          OUTPUT_REPO: ${{ inputs.output-repo }}
          ITEM_REPO: ${{ inputs.item-repo }}
          PRIVATE: ${{ steps.visibility.outputs.private }}
          EVENT: ${{ inputs.event }}
          REVIEW_ITEM: ${{ inputs.review-item }}
          REVIEW: ${{ inputs.review }}
          CONTEXT_REPOS: ${{ inputs.context }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -z "$ISSUE" || "$ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::issue is not a number: $ISSUE"; exit 1; }
          # An event's item is in the calling repository, and a review's or
          # a push's pull request in `repo`; another item's repository has
          # to be one the bounds let runs work on.
          if [ -n "$ITEM_REPO" ]; then
            [ "$EVENT" != true ] || { echo "::error::item-repo is not for an event-triggered run, whose item is in $GITHUB_REPOSITORY"; exit 1; }
            # A review without `review-item` takes its pull request from the
            # event, in the calling repository, as its comment's target.
            [ -z "$REVIEW_ITEM$PUSH_ITEM" ] && [ "$REVIEW" != true ] || { echo "::error::item-repo is not for a review or a push, whose pull request is in $REPO"; exit 1; }
            set -- --item-repo "$ITEM_REPO"
          fi
          base=$BASE target=${TARGET:-*}
          if [ -n "$PUSH_ITEM" ]; then
            base=$PUSH_BRANCH
            set -- "$@" --pull-request "$PUSH_ITEM" --head "$PUSH_HEAD" --output-repo "${OUTPUT_REPO:-$GITHUB_REPOSITORY}"
          fi
          # A private run names where its outputs go, for the binary to
          # hold them to its own repository.
          if [ "$PRIVATE" = true ]; then
            set -- "$@" --private
            [ -n "$PUSH_ITEM" ] || set -- "$@" --output-repo "${OUTPUT_REPO:-$GITHUB_REPOSITORY}"
          fi
          # Without an apply environment apply holds the job token: refuse
          # here, not after the agent ran, what that token cannot apply.
          [ -n "$APPLY_ENVIRONMENT" ] || set -- "$@" --job-token
          if [ -e "$JOB_DIR/event.json" ]; then
            base=$(jq -r --arg base "$BASE" '.base // $base' "$JOB_DIR/event.json")
            [ -n "$TARGET" ] || target=$(jq -r '.item.number // "*"' "$JOB_DIR/event.json")
          fi
          # The binary resolves `context` through the API with the read-only
          # job token, and prints its reasons as plain log lines, escaped.
          "$JOB_DIR/bin/agentic-job" policy --allow "$ALLOW" --repo "$REPO" --clone-url "https://github.com/$REPO" --context-request "$CONTEXT_REPOS" \
            --base "$base" --kind "$KIND" --outputs "$OUTPUTS" --max-outputs "$MAX_OUTPUTS" "$@" > "$JOB_DIR/policy.json" ||
            { echo "::error::The request was refused; this step's log says why"; exit 1; }
          if [ -n "$PUSH_ITEM" ]; then
            jq --arg base "$REPLACEMENT_BASE" '.safe_outputs.push_to_pull_request_branch.replacement_base = $base' "$JOB_DIR/policy.json" > "$JOB_DIR/policy-base.json"
            mv "$JOB_DIR/policy-base.json" "$JOB_DIR/policy.json"
          fi
          # An event's item is in the calling repository, but check and apply
          # take a comment's repository to be `output-repo`: there the event's
          # number is another item, whose comments a run is not to hide, nor
          # comment on, reply to or resolve as a pull request.
          if [ "$EVENT" = true ] && [ -n "$OUTPUT_REPO" ] && [ "${OUTPUT_REPO,,}" != "${GITHUB_REPOSITORY,,}" ] &&
            type=$(jq -re '.safe_outputs | [keys[] | select(IN("hide_comment", "create_pull_request_review_comment", "reply_to_pull_request_review_comment", "resolve_pull_request_review_thread"))][0]' "$JOB_DIR/policy.json"); then
            echo "::error::$type is for an event-triggered run only when output-repo is the calling repository, where the event's item is"
            exit 1
          fi
          # The top-level domains by their count: over a thousand.
          jq '.allowed_domains |= length' "$JOB_DIR/policy.json"
          printf '%s\n' "base=$base" "comment-target=$target" "issue=$ISSUE" | tee -a "$GITHUB_OUTPUT"
          # The binary wrote and checked these: domain names, no comma.
          echo "allowed-domains=$(jq -r '.allowed_domains // [] | join(",")' "$JOB_DIR/policy.json")" >> "$GITHUB_OUTPUT"
      # Uploaded for a refused event too: review.yml's refusal job writes
      # its status comment with it.
      - id: binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}agentic-job-binary
          path: .agentic-job/bin/
          retention-days: 1
          if-no-files-found: error
      # The agent job's configuration, written and validated here before an
      # agent runner is spent, and handed to it with the policy. An input
      # that was left empty sets nothing, so the caller's file stands;
      # `register` means nothing without a proxy. No network probe here:
      # this machine need not be on the proxy's network (secure-host makes
      # one on the agent's). Proposals mode runs no agent and needs no
      # inference configuration. `--repo` picks the target's entry of the
      # caller's `setup.repo-packages`, a list in the caller's own file:
      # the target's contents name no package.
      - name: Write the configuration
        if: ${{ inputs.proposals-artifact == '' && steps.event.outputs.admitted != 'false' }}
        env:
          CONFIG: ${{ inputs.config }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          CONFIG_REPO: ${{ inputs.agent-config-repo != '' && format('https://github.com/{0}', inputs.agent-config-repo) || '' }}
          CONFIG_REF: ${{ inputs.agent-config-ref }}
          CONFIG_PATH: ${{ inputs.agent-config-path }}
          # Off sets nothing, so the caller's file stands.
          SKILLS: ${{ inputs.agent-skills && 'true' || '' }}
          # `github` alone selects GitHub's billing: its proxy is `run`'s,
          # and its API's root GitHub's. Another root (GitHub Enterprise's)
          # needs `inference-register: api-key` too, so that a broker's
          # `inference-url` left in place never receives the GitHub token.
          URL: ${{ inputs.inference-provider == 'github' && inputs.inference-register != 'api-key' && 'https://api.githubcopilot.com' || inputs.inference-url }}
          REGISTER: ${{ inputs.inference-provider == 'github' && 'api-key' || (inputs.inference-url != '' && inputs.inference-register || '') }}
          AUDIENCE: ${{ inputs.inference-audience }}
          TOKEN_FILE: ${{ inputs.inference-token-file }}
          PROVIDER: ${{ inputs.inference-provider }}
          TIMEOUT: ${{ inputs.timeout }}
          MAX_REQUESTS: ${{ inputs.max-requests }}
          MAX_TASKS: ${{ inputs.max-tasks }}
          # An unchanged caller's `budget`, its default or an empty one that
          # keeps the file's cap, stands until it sets `budget-usd`.
          BUDGET: ${{ inputs.budget-usd == '' && inputs.budget || '' }}
          BUDGET_USD: ${{ inputs.budget-usd }}
          # Off sets nothing, so the caller's file stands.
          SESSION: ${{ inputs.session && 'true' || '' }}
          IDLE_MINUTES: ${{ inputs.idle-minutes }}
          PACKAGES: ${{ inputs.packages }}
          NPM: ${{ inputs.npm }}
          # The built-in agents come from the binary's pinned tarballs
          # (crates/agentic-job/src/sandbox/setup/agents.toml), without
          # npm or install scripts; an `npm` input replaces them.
          AGENTS: ${{ inputs.npm == '' && (inputs.agent == 'opencode' && 'opencode-ai@1.18.35' || inputs.agent == 'claude' && '@agentclientprotocol/claude-agent-acp@0.88.0' || '') || '' }}
          SETUP: ${{ inputs.setup }}
          # Off sets nothing, so the caller's file stands. The agent job's
          # host configuration is this file's, so setup, admission and
          # `run` all read this one setting.
          WRITE_POLICY: ${{ inputs.egress-write-policy && 'true' || '' }}
          REPO: ${{ inputs.repo }}
        run: |
          "$JOB_DIR/bin/agentic-job" config ${CONFIG:+--from "$CONFIG"} --repo "$REPO" \
            --string agent.name="$AGENT" --string agent.model="$MODEL" --string agent.config-repo="$CONFIG_REPO" \
            --string agent.config-ref="$CONFIG_REF" --string agent.config-path="$CONFIG_PATH" \
            --boolean agent.skills="$SKILLS" \
            --string inference.url="$URL" --string inference.register="$REGISTER" \
            --string inference.audience="$AUDIENCE" --string inference.token-file="$TOKEN_FILE" \
            --string inference.provider="$PROVIDER" \
            --integer limits.timeout-minutes="$TIMEOUT" --integer limits.max-requests="$MAX_REQUESTS" \
            --integer limits.max-tasks="$MAX_TASKS" --integer limits.budget="$BUDGET" \
            --budget-usd "$BUDGET_USD" \
            --boolean session.listen="$SESSION" --integer session.idle-minutes="$IDLE_MINUTES" \
            --list setup.packages="$PACKAGES" --list setup.npm="$NPM" \
            --list setup.agents="$AGENTS" --string setup.script="$SETUP" \
            --boolean egress.write-policy="$WRITE_POLICY" \
            > "$JOB_DIR/config.toml"
          cat "$JOB_DIR/config.toml"
      # What the agent job's actions read of this call, so that its job
      # passes them nothing but the upload IDs: the task (for an
      # event-triggered run the one the decision wrote, the caller's task
      # and then the event's text, fenced) and run.json. The built-in
      # scripted session comes from this workflow's source and runs only
      # as the sandbox user; it is for the scripted agent alone.
      - name: Write the task and the run's settings
        if: ${{ inputs.proposals-artifact == '' && steps.event.outputs.admitted != 'false' }}
        env:
          EVENT: ${{ inputs.event }}
          TASK: ${{ inputs.task }}
          ID: ${{ inputs.id }}
          REPO: ${{ inputs.repo }}
          AGENT: ${{ inputs.agent }}
          SETUP: ${{ inputs.setup }}
          PROFILE: ${{ inputs.fake-profile }}
          CONFIG_REPO: ${{ inputs.agent-config-repo }}
          REVIEW_HEAD: ${{ steps.event.outputs.review-head || steps.dispatch-review.outputs.review-head }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          APPLY_PARTIAL: ${{ inputs.apply-partial }}
          # Checked above: a number, and a repository within the bounds.
          ISSUE: ${{ steps.request.outputs.issue }}
          ITEM_REPO: ${{ inputs.item-repo || inputs.output-repo || github.repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -n "$PROFILE" ]; then
            [ "$AGENT" = fake ] && [ -z "$SETUP" ] || { echo '::error::fake-profile requires agent fake and no setup'; exit 1; }
            case "$PROFILE" in implement|comment|review) ;; *) echo '::error::unknown fake-profile'; exit 1 ;; esac
          fi
          if [ "$EVENT" = true ]; then [ -s "$JOB_DIR/task.md" ] || { echo "::error::the decision left no task for an event-triggered run"; exit 1; }
          else printf '%s\n' "$TASK" > "$JOB_DIR/task.md"; fi
          # The issue or pull request the run is for, which `run` watches
          # for the agent where the configuration's [session] watch-item
          # says: the event's, in this repository, or the `issue` input's.
          watch_item=
          if [ -e "$JOB_DIR/event.json" ]; then
            watch_item=$(jq -r --arg repo "$GITHUB_REPOSITORY" \
              'if (.item.kind == "issue" or .item.kind == "pull_request") and (.item.number | type) == "number" then "\($repo)#\(.item.number)" else "" end' "$JOB_DIR/event.json")
          elif [ -n "$ISSUE" ]; then
            watch_item="$ITEM_REPO#$ISSUE"
          fi
          jq -n --arg id "$ID" --arg repo "$REPO" --arg agent "$AGENT" --arg fake_profile "$PROFILE" \
            --arg agent_config_repo "$CONFIG_REPO" --arg review_head "$REVIEW_HEAD" --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg apply_partial "$APPLY_PARTIAL" --arg watch_item "$watch_item" --arg source_sha "$SOURCE_SHA" '$ARGS.named' | tee "$JOB_DIR/run.json"
      # With the event's decision and the task, when there was one; a
      # refused event leaves its decision and nothing else.
      - id: policy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}agentic-job-policy
          path: |
            .agentic-job/policy.json
            .agentic-job/event.json
            .agentic-job/task.md
            .agentic-job/config.toml
            .agentic-job/run.json
          retention-days: 30
          if-no-files-found: error

  # Only this trusted machine consumes command labels. No write token is
  # passed to policy, agent or check; failed removal blocks execution.
  activate:
    needs: policy
    if: ${{ inputs.proposals-artifact == '' && needs.policy.outputs.admitted == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.event }}
        with:
          artifact-ids: ${{ needs.policy.outputs.policy-artifact-id }}
          path: .agentic-job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.event }}
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: activation-bin
      - name: Consume the admitted command label
        if: ${{ inputs.event }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x activation-bin/agentic-job
          activation-bin/agentic-job activate --decision .agentic-job/event.json --repository "$GITHUB_REPOSITORY"

  # With `require-safe-outputs-pat`, a wrong SAFE_OUTPUTS_PAT fails the
  # call here, before the agent runs, rather than in apply after it: see
  # `agentic-job check-apply-token`. Not a security control, as apply checks
  # the token again: it saves an agent session. It enters the apply
  # environment, as an environment's secret reaches only a job that names
  # it, and the token goes to the policy job's binary alone, as activate's
  # write token does, and never to the agent's machine.
  apply-token:
    needs: policy
    if: ${{ inputs.require-safe-outputs-pat && needs.policy.outputs.admitted == 'true' }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    environment: ${{ inputs.apply-environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: apply-token-bin
      - name: Check SAFE_OUTPUTS_PAT
        env:
          # Empty when the caller did not pass it, which the check refuses
          # before any request.
          SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
          OUTPUT_REPO: ${{ inputs.output-repo || github.repository }}
        run: |
          chmod +x apply-token-bin/agentic-job
          apply-token-bin/agentic-job check-apply-token --output-repo "$OUTPUT_REPO"

  # For an event-triggered run: an eyes reaction on what started it, and a
  # comment that says a run started, which `conclude` edits when the run
  # ends, so that whoever started it sees that it did and how it went.
  # Like the apply job this names no permissions and writes with what the
  # caller granted the call; the agent's machine never holds a token that
  # can comment. Nothing of the event reaches these steps but numbers,
  # from event.json: the item's and the comment's.
  # Nothing here gates the run: a failure anywhere in this job, its
  # download included, would otherwise fail the policy call and skip the
  # agent, check, apply and conclude with nothing said. conclude reports
  # how the run ended on the policy's item if this found none.
  notify:
    # Not after a refused SAFE_OUTPUTS_PAT, as nothing would conclude the comment.
    needs: [policy, activate, apply-token]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.apply-token.result != 'failure' && (needs.activate.result == 'success' || (inputs.proposals-artifact != '' && needs.activate.result == 'skipped')) && inputs.notify != 'none' && needs.policy.outputs.admitted == 'true' && (needs.policy.outputs.item != '' || (needs.policy.outputs.comment-target != '' && needs.policy.outputs.comment-target != '*')) }}
    # Serialize lookup/create with conclude so simultaneous runs cannot create duplicates.
    concurrency:
      group: agentic-job-status-${{ needs.policy.outputs.item != '' && github.repository || inputs.item-repo || inputs.output-repo || github.repository }}-${{ needs.policy.outputs.item || needs.policy.outputs.comment-target }}
      cancel-in-progress: false
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      kind: ${{ steps.target.outputs.kind }}
      id: ${{ steps.target.outputs.id }}
      item: ${{ steps.target.outputs.item }}
      comment-id: ${{ steps.comment.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW: ${{ github.workflow }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.policy.outputs.policy-artifact-id }}
          path: .agentic-job
      # The policy job's binary writes the status comment, as activate's
      # consumes the label: by ID from this workflow's own policy job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.notify == 'comment' }}
        with:
          artifact-ids: ${{ needs.policy.outputs.binary-artifact-id }}
          path: notify-bin
      - name: What to react to, and where to comment
        id: target
        env:
          TARGET: ${{ needs.policy.outputs.comment-target }}
        run: |
          if [ ! -f "$JOB_DIR/event.json" ] || [ "$(jq -r '.item.number // empty' "$JOB_DIR/event.json")" = '' ]; then
            [[ "$TARGET" =~ ^[1-9][0-9]*$ ]] || exit 1
            printf '%s\n' "item=$TARGET" "what=item" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kind=$(jq -r '.react_to.kind' "$JOB_DIR/event.json") id=$(jq -r '.react_to.id // .react_to.number' "$JOB_DIR/event.json")
          item=$(jq -r '.item.number' "$JOB_DIR/event.json") what=$(jq -r '.item.kind' "$JOB_DIR/event.json")
          [[ "$kind" =~ ^(issue|comment|review_comment)$ && "$id" =~ ^[0-9]+$ && "$item" =~ ^[0-9]+$ && "$what" =~ ^(issue|pull_request)$ ]] ||
            { echo "::error::event.json names nothing to react to"; exit 1; }
          printf '%s\n' "kind=$kind" "id=$id" "item=$item" "what=${what/_/ }" | tee -a "$GITHUB_OUTPUT"
      # The two posts below don't gate the run: a forge hiccup here would
      # otherwise stop it before the agent with nothing said, as conclude
      # would not run. conclude posts a status comment when this left none.
      - name: An eyes reaction on what started the run
        if: ${{ steps.target.outputs.id != '' }}
        continue-on-error: true
        env:
          KIND: ${{ steps.target.outputs.kind }}
          ID: ${{ steps.target.outputs.id }}
        run: |
          case "$KIND" in
            issue) path="issues/$ID/reactions" ;;
            comment) path="issues/comments/$ID/reactions" ;;
            review_comment) path="pulls/comments/$ID/reactions" ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/$path" -f content=eyes --jq .content
      - name: A comment that says the run started
        id: comment
        if: ${{ inputs.notify == 'comment' }}
        continue-on-error: true
        env:
          ITEM: ${{ steps.target.outputs.item }}
          WHAT: ${{ steps.target.outputs.what }}
          TEXT: ⏳ [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) is running.
          REPO: ${{ needs.policy.outputs.item != '' && github.repository || inputs.item-repo || inputs.output-repo || github.repository }}
          STATUS_TOKEN: ${{ secrets.SAFE_OUTPUTS_PAT }}
          STATUS_COMMENT: ${{ inputs.status-comment }}
        run: |
          chmod +x notify-bin/agentic-job
          notify-bin/agentic-job status | tee -a "$GITHUB_OUTPUT"
