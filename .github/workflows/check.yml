# Read-only validation on a machine the proposal producer never touched.
# Trusted artifacts must come directly from policy, never through the producer:
# their upload IDs and every setting are policy.yml's outputs, and only the
# proposals' upload ID and digest come from the producer.
name: Check agentic-job proposals

on:
  workflow_call:
    inputs:
      policy:
        description: >-
          `toJSON(needs.policy.outputs)` of the policy.yml call in this run: the trusted binary and
          policy upload IDs, the comment target, and the caller's settings as that call took them
        type: string
        required: true
      safe-outputs-artifact-id:
        description: Immutable untrusted proposal upload ID; required unless the policy names a proposals artifact
        type: string
        default: ""
      safe-outputs-artifact-digest:
        description: The SHA-256, in hex, upload-artifact gave for that upload; required with it
        type: string
        default: ""
    outputs:
      artifact-id:
        description: Immutable checked upload ID for apply; absent on refusal
        value: ${{ jobs.detect.outputs.artifact-id }}
      artifact-digest:
        description: The checked upload's SHA-256 in hex, which apply holds it to
        value: ${{ jobs.detect.outputs.artifact-digest }}
      refusal:
        description: Bounded refusal diagnostic, not authorization to apply
        value: ${{ jobs.check.outputs.refusal }}
      has-patch:
        description: Whether the trusted checker report contains a patch
        value: ${{ jobs.check.outputs.has-patch }}
      verdict:
        description: For a review, APPROVE or CHANGES as the checked comment starts, or empty
        value: ${{ jobs.check.outputs.verdict }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GH_AW_TMP: /tmp/gh-aw
  JOB_DIR: ${{ github.workspace }}/.agentic-job
  SOURCE_DIR: ${{ github.workspace }}/.agentic-job-source

jobs:
  # No proposal can select or disable this control: the caller owns the
  # repository variable. Even a crashed/unavailable detector blocks apply.
  detect:
    needs: check
    if: ${{ needs.check.outputs.artifact-id != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.release.outputs.artifact-id }}
      artifact-digest: ${{ steps.release.outputs.artifact-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ vars.AGENTIC_JOB_DETECT_MODEL != '' }}
        with:
          artifact-ids: ${{ fromJSON(inputs.policy).binary-artifact-id }},${{ fromJSON(inputs.policy).policy-artifact-id }}
          path: .agentic-job
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ vars.AGENTIC_JOB_DETECT_MODEL != '' }}
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: .agentic-job/checked
      - name: Detect threats without a repository write token
        if: ${{ vars.AGENTIC_JOB_DETECT_MODEL != '' }}
        env:
          MODEL: ${{ vars.AGENTIC_JOB_DETECT_MODEL }}
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          "$JOB_DIR/agentic-job" detect --config "$JOB_DIR/config.toml" --task "$JOB_DIR/task.md" --checked "$JOB_DIR/checked" --model "$MODEL"
      - id: release
        env:
          ARTIFACT: ${{ needs.check.outputs.artifact-id }}
          DIGEST: ${{ needs.check.outputs.artifact-digest }}
        run: |
          echo "artifact-id=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "artifact-digest=$DIGEST" >> "$GITHUB_OUTPUT"

  check:
    # `actions: read` for the proposals upload's digest, nothing else.
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(fromJSON(inputs.policy).runner) }}
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      refusal: ${{ steps.refusal.outputs.reason }}
      has-patch: ${{ steps.checked.outputs.has-patch }}
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # The pieces must be one commit's: a policy call pinned elsewhere
      # would have this commit's code check (or apply) the settings,
      # binary and policy of another, possibly an older, weaker one.
      - name: The policy call is this workflow's commit
        env:
          SOURCE_REPOSITORY: ${{ fromJSON(inputs.policy).source-repository }}
          SOURCE_SHA: ${{ fromJSON(inputs.policy).source-sha }}
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_REPOSITORY" == "$REPOSITORY" && "$SOURCE_SHA" == "$SHA" ]] ||
            { echo "::error::policy.yml ran at $SOURCE_REPOSITORY@$SOURCE_SHA, this workflow at $REPOSITORY@$SHA: pin all pieces to one commit"; exit 1; }
      # Empty IDs must not turn download-artifact into a download of all uploads.
      - name: Require explicit artifact contracts
        env:
          BINARY: ${{ fromJSON(inputs.policy).binary-artifact-id }}
          POLICY: ${{ fromJSON(inputs.policy).policy-artifact-id }}
          PROPOSALS: ${{ inputs.safe-outputs-artifact-id }}
          DIGEST: ${{ inputs.safe-outputs-artifact-digest }}
          NAME: ${{ fromJSON(inputs.policy).proposals-artifact }}
        run: |
          [[ "$BINARY" =~ ^[0-9]+$ && "$POLICY" =~ ^[0-9]+$ ]] || { echo '::error::trusted artifact IDs are required'; exit 1; }
          if [ -z "$NAME" ]; then
            [[ "$PROPOSALS" =~ ^[0-9]+$ ]] || { echo '::error::a proposal artifact ID is required'; exit 1; }
            [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::the proposal upload'\''s SHA-256 digest is required'; exit 1; }
          else
            [ -z "$PROPOSALS$DIGEST" ] || { echo '::error::choose a proposal ID or legacy name, not both'; exit 1; }
          fi
      # What is checked is byte for byte what the agent job's upload step
      # hashed as it uploaded: the server's digest for the ID has to be the
      # one upload-artifact gave that step, and download-artifact below
      # refuses bytes that do not hash to the server's. An ID alone names
      # any upload of the run, and says nothing of what is stored under it
      # by the time check reads it; a missing or other digest fails here,
      # before anything is downloaded. So does another run's upload.
      - name: The proposals are the agent job's upload
        if: ${{ fromJSON(inputs.policy).proposals-artifact == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSALS: ${{ inputs.safe-outputs-artifact-id }}
          DIGEST: ${{ inputs.safe-outputs-artifact-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROPOSALS" |
            jq -e --arg digest "sha256:$DIGEST" --arg run "$GITHUB_RUN_ID" '.digest == $digest and (.workflow_run.id | tostring) == $run' > /dev/null ||
            { echo "::error::artifact $PROPOSALS of run $GITHUB_RUN_ID does not have the digest the agent job gave, sha256:$DIGEST; the call needs \`actions: read\`"; exit 1; }
      # Same source commit as the whole wrapper: a local reusable call is pinned
      # to its caller workflow's commit, not the target repository checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agentic-job-source
          sparse-checkout: |
            safe-outputs
            workflow
          persist-credentials: false
      - uses: github/gh-aw/actions/setup@462ed682857c4ab64d40f2c85e3738fa27834839 # v0.91.12-7
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.policy).binary-artifact-id }},${{ fromJSON(inputs.policy).policy-artifact-id }}
          path: .agentic-job
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ fromJSON(inputs.policy).proposals-artifact == '' }}
        with:
          artifact-ids: ${{ inputs.safe-outputs-artifact-id }}
          path: .agentic-job/safe-outputs
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ fromJSON(inputs.policy).proposals-artifact != '' }}
        with:
          name: ${{ fromJSON(inputs.policy).proposals-artifact }}
          path: .agentic-job/safe-outputs
      # The collector counts a policy's secondary pull request with the
      # run's own, as one type: it is given their sum, and check counts each
      # against its own `max`. Apply's handlers get the policy's own.
      - name: Write the collector's configuration
        run: |
          chmod +x "$JOB_DIR/agentic-job"
          jq .safe_outputs "$JOB_DIR/policy.json" > "$GH_AW_TMP/config.json"
          jq '.secondary_pull_request.max as $more | .safe_outputs
            | if $more then .create_pull_request.max += $more else . end' "$JOB_DIR/policy.json" > "$RUNNER_TEMP/collector.json"
      - name: Ingest the outputs with gh-aw's collector
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SAFE_OUTPUTS: ${{ env.JOB_DIR }}/safe-outputs/outputs.jsonl
          GH_AW_SAFE_OUTPUTS_CONFIG_PATH: ${{ runner.temp }}/collector.json
          GH_AW_VALIDATION_CONFIG_PATH: ${{ env.SOURCE_DIR }}/safe-outputs/validation.json
          # gh-aw's `safe-outputs.urls`. Its default redacts a non-https
          # `scheme://` up to the next space even in code, which ate Cargo's
          # `path+file://` package ids (#401). URLs in what gh-aw takes for
          # code are now kept, and its idea of code is not quite GitHub's:
          # see docs/safe-outputs.md for why that is acceptable. Check
          # refuses a private key either way.
          GH_AW_SAFE_OUTPUTS_URLS: allowed-or-code-region
          # The hosts whose https links are kept: every top-level domain,
          # so any public host (#918). gh-aw has no setting for all of them.
          GH_AW_ALLOWED_DOMAINS: ${{ fromJSON(inputs.policy).allowed-domains }}
        with:
          script: |
            const dir = `${process.env.RUNNER_TEMP}/gh-aw/actions`;
            require(`${dir}/setup_globals.cjs`).setupGlobals(core, github, context, exec, io, getOctokit);
            await require(`${dir}/collect_ndjson_output.cjs`).main();
      - name: The collector refused nothing
        run: jq -e '.errors == []' "$GH_AW_TMP/agent_output.json"
      # One of two words, never agent text: a caller may report it as a
      # status, which the comment's posting has still to be checked for.
      - name: Validate the review verdict
        id: verdict
        if: ${{ fromJSON(inputs.policy).review == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET: ${{ fromJSON(inputs.policy).comment-target }}
        with:
          script: |
            const fs = require('node:fs');
            const { checkOutputs } = require(`${process.env.SOURCE_DIR}/workflow/review.cjs`);
            try {
              core.setOutput('verdict', checkOutputs(JSON.parse(fs.readFileSync(`${process.env.GH_AW_TMP}/agent_output.json`, 'utf8')), process.env.TARGET));
            } catch (error) {
              fs.writeFileSync(`${process.env.GH_AW_TMP}/report.json`, JSON.stringify({ ok: false, errors: [error.message] }));
              core.setFailed(error.message);
            }
      - name: Check the outputs against the policy
        id: checked
        env:
          COMMENT_REPO: ${{ fromJSON(inputs.policy).item-repo || fromJSON(inputs.policy).output-repo || github.repository }}
          COMMENT_TARGET: ${{ fromJSON(inputs.policy).comment-target }}
          EXPECT_REFUSAL: ${{ fromJSON(inputs.policy).expect-check-refusal }}
        run: |
          destination=()
          case "$COMMENT_TARGET" in ''|'*') ;; *) destination=(--comment-repo "$COMMENT_REPO" --comment-target "$COMMENT_TARGET") ;; esac
          set +e
          "$JOB_DIR/agentic-job" check --policy "$JOB_DIR/policy.json" --outputs "$JOB_DIR/safe-outputs" \
            --collected "$GH_AW_TMP/agent_output.json" --report "$GH_AW_TMP/report.json" "${destination[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[1]}" = 0
          if [ "$EXPECT_REFUSAL" = true ]; then
            test "${statuses[0]}" = 1
            jq -e '.ok == false and (.errors | type == "array" and length > 0)' "$GH_AW_TMP/report.json"
            echo 'refused=true' >> "$GITHUB_OUTPUT"
          else
            test "${statuses[0]}" = 0
          fi
          echo "has-patch=$(jq -r '.patch != null' "$GH_AW_TMP/report.json")" >> "$GITHUB_OUTPUT"
      - name: Show why check refused the outputs
        id: refusal
        if: ${{ failure() || steps.checked.outputs.refused == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { refusalReasons } = await import(pathToFileURL(`${process.env.SOURCE_DIR}/safe-outputs/diagnostics.mjs`).href);
            const reasons = await refusalReasons(process.env.GH_AW_TMP);
            for (const reason of reasons) core.error(`Refused by check: ${reason}`);
            core.setOutput('reason', reasons.join('; ').slice(0, 4000));
      # Apply's handlers get the requests check accepted, and not the
      # incomplete report gh-aw's collector adds to a result without one,
      # which check leaves out (src/check/mod.rs) and no handler is set up for.
      #
      # A policy's secondary pull request is kept apart, in `secondary/`:
      # its request (a create_pull_request whose `repo` is the secondary's,
      # exactly, as check tells them apart), the patch check accepted for it
      # by name, and the policy's table it is to be opened by. Apply's pass
      # for the run's own outputs then sees what it saw before there was a
      # secondary, and its trial `git am` of every `aw-*.patch` never takes
      # the secondary's.
      - name: Put the patch beside the ingested outputs
        if: ${{ success() && fromJSON(inputs.policy).expect-check-refusal != 'true' }}
        run: |
          target=$(jq -c '.secondary_pull_request' "$JOB_DIR/policy.json")
          ours='.type == "create_pull_request" and $target != null and .repo == $target.repo'
          jq --argjson target "$target" "{items: [.items[] | select($ours | not)], errors: []}" "$GH_AW_TMP/report.json" > "$RUNNER_TEMP/accepted.json"
          mv "$RUNNER_TEMP/accepted.json" "$GH_AW_TMP/agent_output.json"
          secondary=$(jq -r '.secondary_patch.file // ""' "$GH_AW_TMP/report.json")
          if [ -n "$secondary" ]; then
            mkdir "$GH_AW_TMP/secondary"
            jq --argjson target "$target" "{items: [.items[] | select($ours)], errors: []}" "$GH_AW_TMP/report.json" > "$GH_AW_TMP/secondary/agent_output.json"
            printf '%s\n' "$target" > "$GH_AW_TMP/secondary/target.json"
            cp -t "$GH_AW_TMP/secondary" "$JOB_DIR/safe-outputs/$secondary"
          fi
          find "$JOB_DIR/safe-outputs" -maxdepth 1 \( -name 'aw-*.patch' -o -name replacement.json \) ! -name "$secondary" -exec cp -t "$GH_AW_TMP" {} +
      - id: upload
        if: ${{ success() && fromJSON(inputs.policy).expect-check-refusal != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.policy).artifact-prefix }}checked-outputs
          path: |
            ${{ env.GH_AW_TMP }}/agent_output.json
            ${{ env.GH_AW_TMP }}/config.json
            ${{ env.GH_AW_TMP }}/report.json
            ${{ env.GH_AW_TMP }}/aw-*.patch
            ${{ env.GH_AW_TMP }}/replacement.json
            ${{ env.GH_AW_TMP }}/secondary/
          retention-days: 30
          if-no-files-found: error
