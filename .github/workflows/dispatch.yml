# Copy this file and .github/agentic-job/dispatch.toml at the same paths.
# Pin the reusable call, and the target job's checkout, to this source
# commit; see docs/dispatch.md.
name: dispatch
run-name: ${{ inputs.kind }} ${{ inputs.item-repo || inputs.repo }}#${{ inputs.item }}${{ inputs.item-repo && format(' for {0}', inputs.repo) || '' }}${{ inputs.session && ' session' || '' }}${{ inputs.runner && format(' on {0}', inputs.runner) || '' }}

on:
  workflow_call:
    # Forward only this declared credential, never inherit. Environment-only
    # callers must explicitly pass the name through this wrapper too.
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
      # Not passed on: preflight refuses `api-key`, as agentic-job.yml's
      # `run` does. Kept so that callers that pass it still parse.
      INFERENCE_API_KEY:
        required: false
    outputs:
      review-head:
        description: Exact PR head resolved for the review profile
        value: ${{ jobs.run.outputs.review-head }}
      result-url:
        description: The URL of what the run made, its pull request or comment; empty for none
        value: ${{ jobs.run.outputs.result-url }}
      blocked:
        description: "`true` when the run handed back only missing_data (and noop) and no change: blocked, not failed"
        value: ${{ jobs.run.outputs.blocked }}
    inputs:
      scripted:
        description: Trusted CI forces the model-free hosted trial regardless of deployment variables
        type: boolean
        default: false
      task:
        type: string
        required: true
      repo:
        type: string
        required: true
      item:
        type: string
        required: true
      item-repo:
        type: string
        default: ""
      kind:
        type: string
        required: true
      status-comment:
        type: string
        default: ""
      status-comment-mode:
        type: string
        default: edit
      session:
        type: boolean
        default: false
      idle-minutes:
        type: string
        default: ""
      runner:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      task:
        description: Public task for the agent
        type: string
        required: true
      repo:
        description: Public target repository, OWNER/NAME, allowed by the bounds
        type: string
        required: true
      item:
        description: Positive item number (issue for implement/triage, issue or PR for research, PR for review/fix)
        type: string
        required: true
      item-repo:
        description: >-
          The item's repository, OWNER/NAME, when not the target; the bounds must allow it.
          Empty for the target. Research accepts an issue or PR; implement/triage an issue. Not for review/fix
        type: string
        default: ""
      kind:
        description: Fixed profile (research accepts issues or PRs; review/fix require PRs; fix needs bounds enabling it)
        type: choice
        options: [implement, triage, research, review, fix]
        required: true
      status-comment:
        description: >-
          The id of the dispatcher's own comment on the item for the run's status, instead of a
          second comment; ignored unless the status credential wrote it on that item
        type: string
        default: ""
      status-comment-mode:
        description: Edit one item status, or add one status per run
        type: choice
        options: [edit, add]
        default: edit
      session:
        description: >-
          After the task's turn, wait for the operator's prompts until idle or ended (docs/interactive.md);
          the runner's configuration says who may attach. Not for review
        type: boolean
        default: false
      idle-minutes:
        description: With `session`, how long it waits for the next prompt (empty for 10, at most 60)
        type: string
        default: ""
      runner:
        description: A runner named in the AGENT_RUNNERS variable; empty for AGENT_RUNNER and AGENT_CONFIG
        type: string
        default: ""

permissions: {}
# One run per kind and item: GitHub keeps at most one run pending in a
# group and cancels the older, so a second dispatch for the same item
# replaces a waiting one. CI's scripted calls name a fixed item, and its
# run id keeps two CI runs (merge queue entries, or a pull request and a
# queue entry) from cancelling each other's call.
concurrency:
  group: dispatch-${{ inputs.kind }}-${{ inputs.repo }}-${{ inputs.item-repo }}-${{ inputs.item }}${{ inputs.scripted && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # read the opted-in main build's workflow artifact
    outputs:
      task: ${{ steps.target.outputs.task }}
      agent: ${{ steps.target.outputs.agent }}
      skills: ${{ steps.target.outputs.skills }}
      runner: ${{ steps.target.outputs.runner }}
      config: ${{ steps.target.outputs.config }}
    # Trusted pinned code only; no target checkout and no write token. The
    # binary is the one `run`'s policy job takes: a release's, by its
    # attested checksums for this source, else a build of this source.
    steps:
      # This repository runs the caller against its own source commit. When
      # copying elsewhere, replace these with cgwalters-forge/agentic-job and
      # the full reviewed source SHA that `run` names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agentic-job-source
          persist-credentials: false
      - name: Get the binary
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          BUILD_ARTIFACTS: ${{ vars.SOURCE_BUILD_ARTIFACTS == 'true' }}
          BUILD_COMMIT: ${{ vars.SOURCE_BUILD_COMMIT }}
        run: bash .agentic-job-source/secure-host/binary.sh get --out "$RUNNER_TEMP/agentic-job-bin"
      # The checks, the item's read and the task: `agentic-job dispatch`.
      - id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
          TARGET_ITEM: ${{ inputs.item }}
          ITEM_REPO: ${{ inputs.item-repo }}
          PROFILE: ${{ inputs.kind }}
          TASK: ${{ inputs.task }}
          SESSION: ${{ inputs.session }}
          SCRIPTED: ${{ inputs.scripted }}
          # A scripted run names none: it runs on hosted Ubuntu.
          RUNNER: ${{ !inputs.scripted && inputs.runner || '' }}
          AGENT_RUNNERS: ${{ vars.AGENT_RUNNERS }}
          AGENT: ${{ inputs.scripted && 'fake' || vars.AGENT || 'fake' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_RUNNER: ${{ vars.AGENT_RUNNER }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL }}
          INFERENCE_AUDIENCE: ${{ vars.INFERENCE_AUDIENCE }}
          INFERENCE_REGISTER: ${{ vars.INFERENCE_REGISTER }}
          INFERENCE_PROVIDER: ${{ vars.INFERENCE_PROVIDER }}
          APPLY_ENVIRONMENT: ${{ !inputs.scripted && vars.APPLY_ENVIRONMENT || '' }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/agentic-job-bin/agentic-job" dispatch --output "$GITHUB_OUTPUT"'

  run:
    needs: target
    # This repository runs the caller against its own source commit. When
    # copying elsewhere, replace this with the full reviewed source SHA:
    # cgwalters-forge/agentic-job/.github/workflows/agentic-job.yml@COMMIT
    uses: ./.github/workflows/agentic-job.yml # zizmor: ignore[self-repository] Call the reusable workflow from this revision.
    # Scripted CI passes no credential value. The explicit name is forwarded
    # even when its value is available only in apply's environment.
    # No write credential reaches target, the agent process or the nested
    # checker; the agent gets only its job's read-only token.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ !inputs.scripted && secrets.SAFE_OUTPUTS_PAT || '' }}
    permissions:
      # Agent/policy/check downscope to read. Apply and refusal reporting
      # use these writes; neither executes agent-produced code. Every push
      # is with the apply environment's token: a new pull request's branch
      # goes to a fork, or to a target the applying account owns that
      # accepts it, and a fix to a pull request's branch where that token
      # may push and `agentic-job push target` allows. The job token
      # pushes nothing.
      contents: read
      issues: write
      pull-requests: write
      actions: read # the agent job's GitHub reads, and apply's and conclude's look-ups of policy's and check's uploads
      # Asked for by register and check's detector. Activate, notify, apply
      # and conclude name no permissions, so they hold it too; the agent
      # job gets none (docs/workflow.md#what-a-caller-provides).
      id-token: write
    with:
      id: ${{ inputs.item-repo || inputs.repo }}#${{ inputs.item }}
      repo: ${{ inputs.repo }}
      task: ${{ needs.target.outputs.task }}
      kind: ${{ (inputs.kind == 'implement' || inputs.kind == 'fix') && 'branch' || 'analysis' }}
      # A triage run may close issues of `repo` it finds done, each with
      # its reason as the closing comment (dispatch.toml bounds how many).
      # Implement may deliver one comment on the fixed item, still intersected
      # with caller bounds; task/plan prose never grants a capability.
      outputs: ${{ inputs.kind == 'review' && 'add_comment,noop' || (inputs.kind == 'implement' && 'create_pull_request,add_comment,noop,missing_tool,missing_data' || (inputs.kind == 'fix' && 'push_to_pull_request_branch,noop,missing_tool,missing_data' || (inputs.kind == 'triage' && 'close_issue,add_comment,noop,missing_tool,missing_data' || 'add_comment,noop,missing_tool,missing_data'))) }}
      max-outputs: ${{ inputs.kind == 'review' && '1' || (inputs.kind == 'triage' && 'max' || '3') }}
      allow: .github/agentic-job/dispatch.toml
      agent: ${{ needs.target.outputs.agent }}
      model: ${{ needs.target.outputs.agent != 'fake' && vars.AGENT_MODEL || '' }}
      agent-config-repo: ${{ (needs.target.outputs.agent == 'opencode' || needs.target.outputs.agent == 'vibe') && vars.AGENT_CONFIG_REPO || '' }}
      agent-config-path: ${{ (needs.target.outputs.agent == 'opencode' || needs.target.outputs.agent == 'vibe') && vars.AGENT_CONFIG_PATH || '' }}
      agent-skills: ${{ needs.target.outputs.skills == 'true' }}
      # A named runner's labels and configuration come from AGENT_RUNNERS,
      # which `agentic-job dispatch` checked above, never from the input.
      agent-runner: ${{ inputs.scripted && '"ubuntu-26.04"' || needs.target.outputs.runner || vars.AGENT_RUNNER || '"ubuntu-26.04"' }}
      # The caller's runner configuration, else this repository's own for
      # hosted ubuntu-26.04 at the pinned commit: policy.yml checks this
      # source out at .agentic-job-source, so no caller keeps a copy of it.
      config: ${{ !inputs.scripted && (needs.target.outputs.config || vars.AGENT_CONFIG) || '.agentic-job-source/.github/agentic-job/hosted.toml' }}
      # The configuration's [session] table says who may attach; the
      # session's writes still wait for check and apply after it ends.
      session: ${{ inputs.session }}
      idle-minutes: ${{ inputs.idle-minutes }}
      fake-profile: ${{ needs.target.outputs.agent == 'fake' && ((inputs.kind == 'triage' || inputs.kind == 'research') && 'comment' || (inputs.kind == 'fix' && 'implement' || inputs.kind)) || '' }}
      max-requests: ${{ needs.target.outputs.agent == 'fake' && '0' || '150' }}
      review: ${{ inputs.kind == 'review' }}
      review-item: ${{ inputs.kind == 'review' && inputs.item || '' }}
      # The pull request a fix pushes to; its branch and head are read by
      # policy, and the bounds must allow the push (off by default).
      push-item: ${{ inputs.kind == 'fix' && inputs.item || '' }}
      inference-url: ${{ needs.target.outputs.agent != 'fake' && vars.INFERENCE_URL || '' }}
      inference-register: ${{ needs.target.outputs.agent != 'fake' && vars.INFERENCE_REGISTER || 'github-oidc' }}
      inference-provider: ${{ needs.target.outputs.agent != 'fake' && vars.INFERENCE_PROVIDER || '' }}
      inference-audience: ${{ needs.target.outputs.agent != 'fake' && vars.INFERENCE_AUDIENCE || '' }}
      output-repo: ${{ inputs.repo }}
      item-repo: ${{ inputs.item-repo }}
      comment-target: ${{ inputs.item }}
      # A pull request says `Refs` to the item, and the item links to what
      # the run made when that is not a comment on it.
      issue: ${{ inputs.item }}
      apply-environment: ${{ !inputs.scripted && vars.APPLY_ENVIRONMENT || '' }}
      apply-partial: false
      # Status jobs are grouped by item alone, and a third waiting one
      # cancels the older pending: scripted CI runs, which share an item
      # across runs, post none. CI covers notify and conclude on an
      # event's item (e2e-event), not on a dispatched comment-target.
      notify: ${{ (inputs.kind == 'review' || inputs.scripted) && 'none' || 'comment' }}
      status-comment: ${{ inputs.status-comment }}
      status-comment-mode: ${{ inputs.status-comment-mode || 'edit' }}
      artifact-prefix: dispatch-${{ inputs.kind }}-
      branch-prefix: dispatch/${{ inputs.kind }}/
