name: world-write enforcement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bpftool:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo node secure-host/apt.mjs
      - name: Install compiler and bpftool
        run: sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang linux-tools-common linux-tools-$(uname -r)
        timeout-minutes: 5
      - run: node --test secure-host/world-write.test.mjs
      - name: Writable before policy activation
        run: sudo node secure-host/world-write-host.mjs before
      - name: Build, load, attach, pin, scope and prove the policy
        run: sudo node secure-host/world-write.mjs
      - name: Denied after loader exits, with owner positive control
        run: sudo node secure-host/world-write-host.mjs after
