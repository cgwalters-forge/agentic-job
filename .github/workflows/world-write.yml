name: world-write enforcement

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bpftool:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install recipe runner
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.58.0
      - run: just world-write-test
      - name: Publish bounded enforcement and object evidence
        run: just world-write-evidence "$RUNNER_TEMP/world-write"
