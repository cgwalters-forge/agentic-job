name: world-write enforcement

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bpftool:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install recipe runner
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: just@1.58.0
      - run: just world-write-test
      - name: Publish bounded enforcement and object evidence
        run: just world-write-evidence "$RUNNER_TEMP/world-write"
