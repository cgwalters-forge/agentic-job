name: world-write enforcement

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bpftool:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo node secure-host/apt.mjs
      - name: Install compiler and bpftool
        run: sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang linux-tools-common linux-tools-$(uname -r)
        timeout-minutes: 5
      - run: node --test secure-host/world-write.test.mjs secure-host/world-write-cases.test.mjs
      - name: Writable before policy activation
        run: sudo node secure-host/world-write-host.mjs before
      # As the release build compiles it (binary.mjs), not on the host that loads it.
      - name: Compile the policy object
        run: node secure-host/binary.mjs object --out "$RUNNER_TEMP/world-write"
      - name: Load, attach, pin, scope and prove the policy
        run: sudo node secure-host/world-write.mjs "$RUNNER_TEMP/world-write/world_write.bpf.o"
      - name: Denials and sticky, owner, tmpfs and overlay controls after loader exits
        run: sudo node secure-host/world-write-host.mjs after
