# Proposes upgrades of the actions this repository's workflows pin by
# commit. Its pull requests are reviewed and merged like any other; see
# docs/review.md for how review treats them.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" is .github/workflows; the composite actions are listed by path.
    directories: [/, /prepare, /run, /secure-host]
    schedule:
      interval: daily
    # A hijacked action release is usually found and pulled within days;
    # waiting a week keeps it from being proposed here in that window.
    cooldown:
      default-days: 7
    # One pull request per run for every action in every directory:
    # each pull request costs its own CI (and any review) run, and one
    # per action exceeds the account's limit on concurrent jobs.
    groups:
      github-actions:
        patterns: ["*"]
